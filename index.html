<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>財務会計論(理論) ポケット論証集 一問一答</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@500;700;900&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#16233A;
    --ink-2:#1F3350;
    --paper:#F7F5EF;
    --paper-2:#EFEBE0;
    --charcoal:#2B2B2B;
    --gold:#B8924A;
    --gold-dim:#8f7239;
    --steel:#4C6E91;
    --sage:#6E8B74;
    --gray:#8C8C86;
    --line: rgba(22,35,58,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--ink);
    background-image:
      radial-gradient(circle at 15% 0%, rgba(184,146,74,0.10), transparent 45%),
      radial-gradient(circle at 100% 100%, rgba(76,110,145,0.12), transparent 50%);
    color: var(--charcoal);
    font-family: 'Noto Sans JP', sans-serif;
    min-height:100vh;
    -webkit-font-smoothing: antialiased;
  }
  .wrap{
    max-width: 640px;
    margin: 0 auto;
    padding: 18px 14px 60px;
  }
  header.top{
    text-align:center;
    padding: 22px 8px 18px;
    color: var(--paper);
  }
  header.top .eyebrow{
    font-size: 11px;
    letter-spacing: 0.28em;
    color: var(--gold);
    margin-bottom: 8px;
  }
  header.top h1{
    font-family:'Noto Serif JP', serif;
    font-weight:700;
    font-size: 22px;
    margin: 0 0 6px;
    letter-spacing: 0.02em;
  }
  header.top p.sub{
    margin:0;
    font-size:12.5px;
    color: rgba(247,245,239,0.62);
    line-height:1.6;
  }

  .panel{
    background: var(--paper);
    border-radius: 14px;
    padding: 16px;
    box-shadow: 0 18px 40px rgba(0,0,0,0.28);
    border: 1px solid rgba(255,255,255,0.06);
  }
  .panel + .panel{margin-top:14px;}

  /* chapter select */
  .field-label{
    font-size:11px;
    color: var(--ink-2);
    font-weight:700;
    letter-spacing:0.06em;
    margin: 0 0 8px 2px;
  }
  select#chapterSelect{
    width:100%;
    padding: 11px 12px;
    border-radius: 9px;
    border: 1px solid var(--line);
    background: #fff;
    font-family:'Noto Sans JP', sans-serif;
    font-size: 14.5px;
    color: var(--charcoal);
    appearance:none;
    -webkit-appearance:none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='9'><path d='M1 1l6 6 6-6' stroke='%2316233A' stroke-width='2' fill='none' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat:no-repeat;
    background-position: right 14px center;
    padding-right: 34px;
  }
  .chapter-meta{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    margin-top:10px;
    font-size:11.5px;
    color: var(--gray);
  }
  .chapter-meta b{color:var(--ink-2);font-weight:700;}

  .rank-row{
    display:flex;
    gap:8px;
    margin-top:12px;
  }
  .rank-chip{
    flex:1;
    text-align:center;
    padding: 8px 0;
    border-radius: 8px;
    border: 1.5px solid var(--line);
    font-size: 12.5px;
    font-weight:700;
    cursor:pointer;
    background:#fff;
    color: var(--gray);
    user-select:none;
    transition: all .15s ease;
  }
  .rank-chip[data-rank="A"].active{ background: var(--gold); border-color: var(--gold); color:#fff; }
  .rank-chip[data-rank="B"].active{ background: var(--steel); border-color: var(--steel); color:#fff; }
  .rank-chip[data-rank="C"].active{ background: var(--sage); border-color: var(--sage); color:#fff; }
  .rank-chip[data-rank="D"].active{ background: var(--gray); border-color: var(--gray); color:#fff; }

  /* progress */
  .progress-row{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top: 4px;
  }
  .progress-track{
    flex:1;
    height:5px;
    background: var(--paper-2);
    border-radius: 4px;
    overflow:hidden;
  }
  .progress-fill{
    height:100%;
    background: linear-gradient(90deg, var(--gold), var(--steel));
    width:0%;
    transition: width .25s ease;
  }
  .progress-count{
    font-size:12px;
    color: var(--ink-2);
    font-weight:700;
    white-space:nowrap;
  }

  /* card */
  .stage{
    margin-top:14px;
    perspective: 1400px;
  }
  .card{
    position:relative;
    min-height: 260px;
    border-radius: 16px;
    cursor:pointer;
    background: #fff;
    border: 1px solid var(--line);
    padding: 22px 20px 20px;
    display:flex;
    flex-direction:column;
  }
  .card-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom: 14px;
  }
  .rank-badge{
    font-family:'Noto Serif JP', serif;
    font-weight:900;
    font-size: 13px;
    color:#fff;
    width:26px;height:26px;
    border-radius:50%;
    display:flex;align-items:center;justify-content:center;
  }
  .rank-badge.A{background:var(--gold);}
  .rank-badge.B{background:var(--steel);}
  .rank-badge.C{background:var(--sage);}
  .rank-badge.D{background:var(--gray);}
  .card-id{
    font-size:11px;
    color: var(--gray);
    letter-spacing:0.04em;
  }
  .mode-tag{
    font-size: 10.5px;
    padding: 3px 9px;
    border-radius: 20px;
    font-weight:700;
    letter-spacing:0.03em;
  }
  .mode-tag.q{ background: rgba(22,35,58,0.08); color: var(--ink-2); }
  .mode-tag.a{ background: rgba(184,146,74,0.14); color: var(--gold-dim); }

  .card-body{
    flex:1;
    font-size: 15.5px;
    line-height: 1.85;
    color: var(--charcoal);
    white-space: pre-wrap;
  }
  .card-body.question{
    font-family:'Noto Serif JP', serif;
    font-weight:500;
  }
  .card-body.answer{
    font-family:'Noto Sans JP', sans-serif;
  }
  .comment-box{
    margin-top:14px;
    padding: 10px 12px;
    background: var(--paper);
    border-left: 3px solid var(--gold);
    border-radius: 4px;
    font-size: 12.5px;
    color: var(--ink-2);
    line-height:1.7;
  }
  .card-hint{
    text-align:center;
    font-size:11.5px;
    color: var(--gray);
    margin-top:14px;
    letter-spacing:0.03em;
  }

  /* controls */
  .controls{
    display:flex;
    gap:8px;
    margin-top:14px;
  }
  .btn{
    flex:1;
    padding: 12px 0;
    border-radius: 10px;
    border:none;
    font-family:'Noto Sans JP', sans-serif;
    font-weight:700;
    font-size: 13.5px;
    cursor:pointer;
    transition: transform .1s ease, opacity .1s ease;
  }
  .btn:active{ transform: scale(0.97); }
  .btn.prev, .btn.next{
    background: var(--ink);
    color: var(--paper);
  }
  .btn.shuffle{
    background: var(--paper-2);
    color: var(--ink-2);
    flex: 0 0 46px;
    font-size:16px;
  }
  .btn:disabled{ opacity:0.35; cursor:default; }

  .self-check{
    display:flex;
    gap:8px;
    margin-top:10px;
  }
  .self-check button{
    flex:1;
    padding:10px 0;
    border-radius:9px;
    border:1.5px solid var(--line);
    background:#fff;
    font-weight:700;
    font-size:12.5px;
    cursor:pointer;
  }
  .self-check button.got{ color: var(--sage); border-color: var(--sage); }
  .self-check button.retry{ color: #B0553F; border-color: #B0553F; }
  .self-check button.got.on{ background: var(--sage); color:#fff; }
  .self-check button.retry.on{ background: #B0553F; color:#fff; }

  footer.note{
    text-align:center;
    color: rgba(247,245,239,0.4);
    font-size: 10.5px;
    margin-top: 26px;
    line-height:1.8;
    padding: 0 12px;
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <div class="eyebrow">CPA · 財務会計論（理論）</div>
    <h1>ポケット論証集 一問一答</h1>
    <p class="sub">渡辺レジュメ／論文対策講義（2026年8月目標）全414論証収録<br>タップして解答を表示・非表示できます</p>
  </header>

  <div class="panel">
    <div class="field-label">章を選択</div>
    <select id="chapterSelect"></select>
    <div class="chapter-meta"><span id="chapterTitleMeta"></span><b id="chapterCountMeta"></b></div>

  <div class="panel">
    <div class="progress-row">
      <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
      <div class="progress-count" id="progressCount">0 / 0</div>
    </div>

    <div class="stage">
      <div class="card" id="card">
        <div class="card-top">
          <div style="display:flex;align-items:center;gap:8px;">
            <div class="rank-badge" id="rankBadge">A</div>
            <div class="card-id" id="cardId">論証2-1</div>
          </div>
          <div class="mode-tag q" id="modeTag">問題</div>
        </div>
        <div class="card-body question" id="cardBody">読み込み中...</div>
        <div class="comment-box" id="commentBox" style="display:none;"></div>
        <div class="card-hint" id="cardHint">タップして解答を見る</div>
      </div>
    </div>

    <div class="self-check" id="selfCheck" style="display:none;">
      <button class="retry" id="btnRetry">△ 要復習</button>

  <footer class="note">
    全414論証（第2〜23章）を収録しています。重要度A・B・C・Dはバッジの色で区別でき、上の絞り込みで切り替えられます。
  </footer>
</div>

<script>
/* ==================== データ ==================== */
const DATA = [
{ch:2, title:"財務会計総論", items:[
 {"id":"2-1","rank":"D","q":"会計主体論の代表的な２つの見解について説明し、それぞれの見解において貸借対照表が描写する内容を、等式を用いて説明しなさい。","a":"資本主理論：企業を資本主の所有物と捉え、会計主体を資本主に求める見解。貸借対照表は「資産－負債＝資本」という資本等式で表され、資本主の観点から、資本主に帰属する部分が資産と負債の差額である資本として描写される。\n企業主体理論：企業を資本主とは別個独立の存在と捉え、会計主体を企業それ自体に求める見解。貸借対照表は「資産＝負債＋資本」という貸借対照表等式で表され、企業それ自体の観点から、資金の調達源泉と運用状況が負債・資本と資産の対照関係として描写される。"},
 {"id":"2-2","rank":"D","q":"資本主理論と企業主体理論のそれぞれにおいて、支払配当金と支払利息はどのように取扱われるかを説明しなさい。","a":"資本主理論：株主は内部構成員、債権者は外部者と位置付けられるため、支払配当金は利益の処分、支払利息は費用として取扱われる。\n企業主体理論：株主・債権者のいずれも外部者と位置付けられるため、支払配当金・支払利息のいずれも費用として取扱われる。"},
 {"id":"2-3","rank":"D","q":"静態論と動態論のそれぞれについて、貸借対照表がどのような本質を有するかを説明するとともに、繰延資産の貸借対照表能力の有無を述べなさい。","a":"静態論：企業会計の目的を債務弁済能力の開示による債権者保護に置くため、貸借対照表は企業の財産価値を表示する手段としての本質を有する。資産は換金能力を有するものに限定されるため、繰延資産は貸借対照表能力を有さない。\n動態論：企業会計の目的を収益力の開示による投資家保護に置くため、貸借対照表は収支と損益の期間帰属のズレを収容する残高表としての本質を有する。適正な期間損益計算のために必要な資産が幅広く計上されるため、繰延資産も貸借対照表能力を有する。"},
 {"id":"2-4","rank":"C","q":"収益費用アプローチと資産負債アプローチのそれぞれについて、意義、会計の主要課題及び算定される期間利益を説明しなさい。","a":"収益費用アプローチ：一会計期間の成果たる収益に、これを獲得するための努力たる費用を対応させ、両者の差額を利益と捉える考え方。主要課題は企業活動の効率性の解明で、収益・費用の定義と認識・測定基準が中心的課題となり、期間利益は企業の業績を示す測定値（純利益）となる。\n資産負債アプローチ：資産と負債の差額として定義される純資産の一会計期間における変動額を利益と捉える考え方。主要課題は企業の富の解明で、資産・負債の定義と認識・測定基準が中心的課題となり、期間利益は企業の富の増加分を示す測定値（包括利益）となる。"},
 {"id":"2-5","rank":"B","q":"収益費用アプローチと資産負債アプローチの前提となっている、損益計算書と貸借対照表の基本的な関係について説明しなさい。","a":"両アプローチはいずれもクリーン・サープラス関係を前提としている。クリーン・サープラス関係とは、ある期間における資本の増減（資本取引による増減を除く）が当該期間の利益と等しくなる関係をいい、資本取引がないと仮定すると、損益計算書で算定された期間利益と貸借対照表の純資産の一会計期間における変動額が一致することを意味する。","cm":"クリーン・サープラス関係の成立が重要な理由：会計情報の信頼性を高めるとともに、企業価値の評価に役立つから。"},
 {"id":"2-6","rank":"B","q":"製品保証引当金の負債計上の可否について、収益費用アプローチと資産負債アプローチのそれぞれの観点から説明しなさい。","a":"収益費用アプローチの観点：将来発生する保証費が当期の製品販売による収益の獲得に貢献する費用と考えられるため、収益と費用を対応させるべく、当期に保証費を見越計上し、その相手勘定として製品保証引当金を負債計上することに合理性がある。\n資産負債アプローチの観点：保証付販売という過去の事実から生じた将来の保証費の支払義務を負っていることから、負債計上に合理性がある。"},
 {"id":"2-7","rank":"A","q":"修繕引当金の負債計上の可否について、収益費用アプローチと資産負債アプローチのそれぞれの観点から説明しなさい。","a":"収益費用アプローチの観点：将来発生する修繕費が当期の固定資産の稼動を通じた収益の獲得に貢献する費用と考えられるため、収益と費用を対応させるべく、当期に修繕費を見越計上し、その相手勘定として修繕引当金を負債計上することに合理性がある。\n資産負債アプローチの観点：操業停止や設備の廃棄をした場合には修繕が不要となることから、義務を負っているとは考えられないため、負債計上に合理性はない。"},
 {"id":"2-8","rank":"D","q":"当期業績主義と包括主義のそれぞれの考え方を説明しなさい。","a":"当期業績主義：損益計算書において経常損益のみを示し、企業の正常的・経常的な収益力を表す利益を算定しようとする考え方。\n包括主義：損益計算書において経常損益だけでなく特別損益も計上し、一会計期間の期間的に分配可能な利益及び企業の長期的・平均的な収益力を表す利益を算定しようとする考え方。"},
 {"id":"2-9","rank":"D","q":"制度会計上、包括主義の損益計算書が採用されている理由を説明しなさい。","a":"①損益計算書の役割には、投下資本の回収余剰たる分配可能利益を明らかにすることが含まれる。②長期的にみれば特別損益は平準化されるため、長期的・平均的な収益力を明らかにすることが長期的な業績予測に役立つ。③期間利益の合計額が全体利益に一致するという一致の原則を充足する。④当期業績主義では経常損益と特別損益の区別に経営者の恣意性が介入し、利益操作に悪用されるおそれがある。"},
 {"id":"2-10","rank":"D","q":"名目資本維持概念、実質資本維持概念及び実体資本維持概念のそれぞれについて、維持すべき資本及び算定される期間利益の意味を説明しなさい。","a":"名目資本維持概念：維持すべき資本を投下された貨幣の名目額と把握。期間利益は名目額を維持した後の余剰。\n実質資本維持概念：維持すべき資本を投下された貨幣の実質的価値たる一般購買力と把握。期間利益は一般購買力を維持した後の余剰。\n実体資本維持概念：維持すべき資本を投下された個別具体的な物的資産と把握。期間利益はその物的資産を維持した後の余剰。"},
 {"id":"2-11","rank":"B","q":"名目資本維持概念、実質資本維持概念及び実体資本維持概念のうち、取得原価主義と結びつくものはどれか、説明しなさい。","a":"取得原価主義は名目資本維持概念と結びつく。なぜなら、取得原価主義によれば、費用性資産の費用化額は過去の支出額（＝投下された貨幣の名目額）により測定されるため、期間利益が投下された貨幣の名目額を上回って回収された余剰として算定されるからである。"},
 {"id":"2-12","rank":"B","q":"会計基準の設定方法としての帰納的アプローチと演繹的アプローチのそれぞれについて、意義を述べるとともに、帰納的アプローチの長所及び短所を説明しなさい。","a":"帰納的アプローチとは、現実に行われている会計実務を観察し、そこから一般的・共通的なものを抽出することで会計基準を設定する方法。演繹的アプローチとは、会計の前提となる仮定・目的・基礎概念を先に規定し、これと矛盾しないルールを導き出すことで設定する方法。\n帰納的アプローチの長所：既に実務で普及した処理方法から構成されるため遵守されやすい。\n短所：①現状是認的なルールが形成されやすく実務改善に繋がりにくい ②新たな取引に対応できない ③個別トピックごとの基準が相互に矛盾する可能性がある。"},
 {"id":"2-13","rank":"A","q":"資本取引と損益取引のそれぞれについて、意義を述べるとともに、両者の区別が必要とされる理由を説明しなさい。","a":"資本取引とは、企業の株主資本を直接的に増減させることを目的として行われる取引をいう。損益取引とは、企業が利益の獲得を目指して行う取引をいい、株主資本を間接的に増減させ、利益剰余金の増減として表れる。\n区別が必要な理由：適正な期間損益計算のためには、企業の成果と関連しない資本取引を期間損益計算の構成要素から除外し、損益取引のみを構成要素としなければならないため。"},
 {"id":"2-14","rank":"A","q":"資本剰余金と利益剰余金の混同が禁止されることについて、①利害調整の観点と②情報提供の観点のそれぞれから説明しなさい。","a":"①両者を混同すると、分配可能性を特質とする利益剰余金から行われるべき利益分配が、維持拘束性を特質とする資本剰余金から行われるおそれがあるため、債権者保護・株主と債権者の利害調整の観点から混同禁止が要請される。\n②資本剰余金は資本取引を源泉とし、利益剰余金は損益取引を源泉とするが、この源泉を明らかにすることが投資家の合理的意思決定に役立つため、情報提供の観点から混同禁止が要請される。"},
 {"id":"2-15","rank":"B","q":"継続性の原則が要請される理由を２つ簡潔に述べなさい。","a":"①会計方針を毎期継続適用することで、財務諸表の期間比較可能性を確保するため。②会計方針をみだりに変更することを禁止することで、経営者の恣意的な利益操作を排除するため。"},
 {"id":"2-16","rank":"B","q":"保守主義の原則を説明するとともに、保守主義の原則が適用される場面を２つ簡潔に述べなさい。","a":"保守主義の原則とは、企業の財務健全性を確保する観点から、収益と資産の計上は控えめに行う一方で、費用と負債の計上は積極的に行うことによって、期間利益を少なめにおさえるべきとする思考をいう。\n適用場面：①同一の会計事実に対して複数の代替的な会計処理方法が認められている場合 ②会計上の見積りや判断に一定の幅がある場合。"}
]},
{ch:3, title:"収益と費用", items:[
 {"id":"3-1","rank":"B","q":"期間利益が備えるべき特質を２つ挙げ、これと財務会計の機能との関係について述べなさい。","a":"期間利益が備えるべき特質は、①分配可能性（貨幣的裏付けのある分配可能な利益であること）と②業績表示性（企業の業績を的確に表示する利益であること）の２つ。利害調整機能の観点からは分配可能性が、情報提供機能の観点からは業績表示性が求められる。"},
 {"id":"3-2","rank":"D","q":"発生主義会計の長所及び短所を説明しなさい。","a":"長所：収益・費用の期間帰属が経済的価値の増加・減少事実の発生により合理的に決定され、企業の経済活動に即した正しい業績利益の計算が可能となる。\n短所：収益の認識と測定について客観性と確実性に欠ける。また利益に貨幣的裏付けがなく分配可能性が確保されない。"},
 {"id":"3-3","rank":"B","q":"実現主義の意義を述べるとともに、企業会計原則において、原則として発生主義ではなく実現主義により収益を認識するものとされる理由を説明しなさい。","a":"実現主義とは、①企業外部の第三者に対する財貨の引渡または役務の提供、②その対価としての現金または現金等価物（貨幣性資産）の受領、の２要件が満たされた時点で収益を認識する基準をいう。\n理由：実現主義による収益認識は外部の第三者との取引事実に基づくため確実性・客観性が具備され、対価として現金等を受領するため貨幣的裏付けのある収益が計上される。これにより発生主義では不可能だった分配可能性のある利益計算が可能となる。"},
 {"id":"3-4","rank":"B","q":"費用収益対応の原則は期間損益の算定においてどのように機能するか、説明しなさい。","a":"収益は実現主義、費用は発生主義によりそれぞれ認識されるため、両者には必ずしも対応関係があるわけではない。そこで、発生費用のうち成果たる実現収益に対応する部分だけが、費用収益対応の原則によって選び出されて期間費用とされる。すなわち、適正な期間損益計算のために期間費用を決定する原則として機能する。"},
 {"id":"3-5","rank":"C","q":"収益及び費用の測定に収支額基準が採用される理由及び収支額基準と損益計算の関係を説明しなさい。","a":"収支額基準では収益・費用が取引当事者の合意に基づいた金額で測定されるため、数値の客観性と確実性が高く信頼性が付与される。これにより費用は投下資本の金額、収益は回収資本の金額に基づき計上されるため、期間利益として投下資本を上回って回収された金額（＝投下資本の回収余剰たる分配可能利益）が計算される。"}
]},
{ch:4, title:"資産と負債", items:[
 {"id":"4-1","rank":"B","q":"費用性資産について、期間損益計算との関係から説明しなさい。","a":"費用性資産とは、企業の資本投下過程にあり、将来、営業活動を通じて投下資本の回収が図られた際に、収益に対応する費用として損益計算に含められる資産をいう。"},
 {"id":"4-2","rank":"B","q":"費用性資産の評価に取得原価主義が採用される論拠を説明しなさい。","a":"①評価額は外部の第三者との実際の支出額を基礎とするため、経営者の恣意性が介入せず客観性・検証可能性を確保できる。②保有中に時価が上昇しても評価益を計上しないため、実現主義と表裏一体となって未実現利益の計上を排除でき、分配可能利益の算定に資する。"},
 {"id":"4-3","rank":"D","q":"取得原価主義の短所を説明しなさい。","a":"①物価変動時、貸借対照表価額が時価と乖離し、期末時点における企業の経済的実態を適切に表さない。②現在の価格水準を反映する収益に、過去の価格水準を反映する取得原価に基づく費用が対応させられるため、収益と費用が同一価格水準で対応せず、利益額に操業損益のほか保有損益が混入する。"},
 {"id":"4-4","rank":"C","q":"費用配分の原則の意義を述べるとともに、その具体的適用について棚卸資産と償却性資産に分けて説明しなさい。","a":"費用配分の原則とは、費用性資産の取得原価が決定された後、これを当期の費用額（発生費用）と次期以降の費用額（資産）に配分することを要請する基本的な考え方。\n棚卸資産は費消部分を物量的な減少事実に即して直接把握できるため、消費量を配分基準とする。償却性資産は直接把握できないため、期間または利用量を配分基準とする。"},
 {"id":"4-5","rank":"B","q":"自家建設により取得した固定資産について、借入資本利子を取得原価に算入することが容認されている。この算入の要件と理由を説明しなさい。","a":"要件：①建設に要する借入資本の利子で②稼働前の期間に属するもの。\n理由：自家建設中の固定資産はまだ収益獲得に貢献していないため、費用のみを先に計上すると収益と費用が対応しない。そこで借入資本利子を取得原価に算入し、減価償却による費用化を通じて将来の収益との対応を図ることができるため容認されている。"},
 {"id":"4-6","rank":"B","q":"自己所有の固定資産と交換に固定資産を取得した場合、取得原価はどう決定されるか、理由とともに説明しなさい。","a":"交換に供された自己資産の適正な簿価をもって取得原価とする。理由：同一種類・同一用途の固定資産間の交換では、譲渡資産と取得資産との間に投資の継続性が認められ、会計上両者を同一視でき、実質的に取引がなかったものと考えられるため。"},
 {"id":"4-7","rank":"B","q":"自己所有の有価証券と交換に固定資産を取得した場合、取得原価はどう決定されるか、理由とともに説明しなさい。","a":"交換に供された有価証券の時価（不明な場合は適正な簿価）をもって取得原価とする。理由：異種資産の交換では投資の継続性は存在せず、譲渡資産をいったん時価で売却し、その代価で取得資産を購入したと考えられるため。"},
 {"id":"4-8","rank":"B","q":"無償で固定資産を取得した場合、取得原価をゼロとする方法の論拠及び理論的な問題点を説明しなさい。","a":"論拠：資産の取得原価は取引事実を忠実に表現するべきものであり、支払対価がゼロならばゼロで評価すべき。\n問題点：経済的便益を有する資産が簿外処理されるため適正な財政状態を示さず、また資産の利用により収益獲得に貢献しても減価償却による費用配分が行われないため適正な期間損益計算ができない。これにより同種の固定資産を使用する他社との比較が困難になる。"},
 {"id":"4-9","rank":"B","q":"減価償却の目的を述べ、この目的を果たすために必要とされる点を説明しなさい。","a":"減価償却は、適正な費用配分を行うことによって期間損益を適正に算定することを目的とする。有形固定資産は経済的価値の減少を客観的・物量的に把握することが通常できないため、適正な期間損益計算のためには、消費パターンを仮定し恣意性を排除すべく、計画的・規則的に費用配分を行う必要がある。"},
 {"id":"4-10","rank":"C","q":"減価償却の資金留保効果について説明しなさい。","a":"減価償却費が非現金支出費用であることから、貨幣性資産の流入を伴う収益のうち、減価償却費に相当する部分が資金として企業内部に留保される効果をいう。これは、費用配分により適正な期間損益計算を行うという減価償却の目的を達成する上で、副次的に得られる効果である。"},
 {"id":"4-11","rank":"D","q":"生産高比例法の特徴と適用要件を説明しなさい。","a":"利用量を配分基準とするため、生産高（収益）とそのコスト（費用）が合理的に対応するという特徴を有する。適用資産は限定され、総利用可能量が物理的に確定でき、かつ減価が主として資産の利用に比例して発生する資産についてのみ適用できる。"},
 {"id":"4-12","rank":"C","q":"減耗性資産に適用される減耗償却は、減価償却とどのような点で異なるか説明しなさい。","a":"減価償却は、全体としての用役をもって経営活動に役立つ、取替更新が可能な資産の価値的な減少に着目して償却計算を行う。これに対し減耗償却は、採取されるに応じて実体が部分的に製品化される、取替更新が不能な資産の物量的な減少に着目して償却計算を行う点で異なる。"},
 {"id":"4-13","rank":"C","q":"取替資産に適用される取替法は、減価償却とどのような点で異なるか説明しなさい。","a":"減価償却は取得に係る過去の支出（取得原価）を各期間に費用配分するため過去の投下資本額が費用とされ、名目資本が維持される。取替法は取替費用に係る支出を支出した年度の費用とするため現在の投下資本額が費用とされ、実体資本が維持される点で異なる。"},
 {"id":"4-14","rank":"B","q":"繰延資産の計上の根拠を説明しなさい。","a":"繰延資産は、適正な期間損益計算（収益と費用の合理的な対応）を図る見地から計上される。当期に発生した費用でも将来の収益獲得に貢献すると期待されるものは、対応関係を重視して将来の費用とするために資産として繰延べる必要があり、これにより計上されるのが繰延資産である。"},
 {"id":"4-15","rank":"B","q":"株式分割、無償交付等に係る費用を繰延資産に計上することはできるか、理由とともに説明しなさい。","a":"できない。繰延資産に計上できる株式交付費は、企業規模の拡大のためにする資金調達などの財務活動に係る費用として、支出の効果が将来に及ぶものに限定されるため、これに該当しない株式分割・無償交付等に係る費用は繰延資産に計上できない。"},
 {"id":"4-16","rank":"B","q":"制度会計上、株式交付費は資本から直接控除する方法ではなく費用として処理する方法が採用されている。その理由を説明しなさい。","a":"①株式交付費は株主との資本取引に伴って発生するが、その対価は株主に支払われたものではないため、支出自体は資本取引ではない。②社債発行費と同様、資金調達に要する支出額であり財務費用としての性格が強い。③資金調達の方法は会社の意思決定によるものであり、その結果発生する費用を会社の業績に反映させることが投資家への有用な情報提供になる。"},
 {"id":"4-17","rank":"B","q":"「企業会計原則注解」注18に基づく負債性引当金と、概念フレームワークにおける負債の定義との関係を説明しなさい。また発生の可能性の低い偶発事象に引当金を計上できるか説明しなさい。","a":"企業会計原則注解の要件は①将来の特定の費用または損失であること②当期以前の事象に起因すること③発生の可能性が高いこと④金額を合理的に見積れることの４つで、概念フレームワークの負債の定義（義務またはその同等物）は要件とされていない。そのため負債の定義を満たさないものが引当金として計上される可能性がある。発生可能性の低い偶発事象については、要件③を満たさないため引当金を計上できない。"},
 {"id":"4-18","rank":"B","q":"引当金の計上根拠について、費用性引当金と損失性引当金に分けて説明しなさい。","a":"費用性引当金：将来の特定の費用に対応する収益が当期に実現したならば、財貨・役務の費消が生じていなくても可能性が高い限り、適正な期間損益計算の観点から費用収益対応の原則により引当金繰入額を当期費用として認識する。\n損失性引当金：将来の特定の損失は当期の収益との対応関係が認められず、費用収益対応による適正な期間損益計算の観点から根拠づけられないため、財務健全性確保のための保守主義の原則に計上根拠が求められる。"},
 {"id":"4-19","rank":"B","q":"将来の修繕に係る支出を引当金に計上する方法の論拠と問題点、解消方法を説明しなさい。","a":"論拠：費用収益対応の原則（将来の修繕費用を当期の実現収益に対応させる）。\n問題点：法的な債務性がなく負債の定義を満たさない。\n解消方法：修繕支出をそれまでの減価の回復とみて資産計上し、次回修繕までの期間にわたり減価償却により支出後の期間に配分する方法を採用することで解消される。"}
]},
{ch:5, title:"概念フレームワーク", items:[
 {"id":"5-1","rank":"A","q":"討議資料「財務会計の概念フレームワーク」において示されている財務報告の目的について説明しなさい。","a":"財務報告の目的は、投資家による企業成果の予測と企業価値の評価に役立つような、企業の財務状況の開示である。具体的には、投資家の意思決定に資するディスクロージャー制度の一環として、自己の責任で将来を予測し投資判断をする人々のために、企業の投資のポジションとその成果を測定して開示することである。"},
 {"id":"5-2","rank":"A","q":"財務報告において提供される情報の中で、特に重要とされるものは何か、理由とともに説明しなさい。","a":"特に重要とされるのは投資の成果を示す利益情報である。理由：利益情報は基本的に過去の成果を表すが、企業価値評価の基礎となる将来キャッシュ・フローの予測に広く用いられているから。"},
 {"id":"5-3","rank":"A","q":"会計情報に期待される役割について、企業価値との関係から説明しなさい。","a":"会計情報は企業価値の推定に資することが期待されているが、企業価値を主体的に見積るのは投資家自身であり、会計情報には企業価値それ自体を表現することではなく、その見積りに必要な、予想形成に役立つ基礎を提供する役割だけが期待されている。"},
 {"id":"5-4","rank":"A","q":"ディスクロージャー制度の主たる当事者のうち投資家と経営者の役割について、両者の関係を示しつつ説明しなさい。","a":"投資家の役割は、開示された情報を利用して自己の責任で将来の企業成果を予想し、現在の企業価値を評価することである。経営者には、投資家がその役割を果たすのに必要な情報を開示することが期待される。予測は投資家の自己責任で行われるべきであり、経営者が負うべき責任は基本的には事実の開示である。"},
 {"id":"5-5","rank":"D","q":"利害調整機能と情報提供機能は、概念フレームワークにおいてどのように位置付けられているか、説明しなさい。","a":"情報提供機能を果たすことが財務報告の目的として位置付けられており、利害調整機能は提供された会計情報の副次的な利用の側面として位置付けられている。"},
 {"id":"5-6","rank":"C","q":"会計情報に求められる最も基本的な特性について、財務報告の目的の観点から説明しなさい。","a":"最も基本的な特性は意思決定有用性である。財務報告の目的は投資家による企業成果の予測と企業価値の評価に役立つ財務状況の開示であり、この目的の達成にあたり、会計情報には投資家が企業の不確実な成果を予測するのに有用であることが期待されているからである。"},
 {"id":"5-7","rank":"C","q":"意思決定との関連性、信頼性、内的整合性及び比較可能性のそれぞれについて、意思決定有用性とどのような関係にあるかを説明しなさい。","a":"意思決定との関連性と信頼性は、意思決定有用性を直接支える特性であり、有用か否かを直接判定する規準として機能する。内的整合性と比較可能性は、会計情報が有用であるために必要な最低限の基礎的条件であり、これらで意思決定有用性が直接判断されるわけではないが、しばしば関連性や信頼性が満たされているかを間接的に推定する際に利用される。"},
 {"id":"5-8","rank":"B","q":"「セグメント情報等の開示に関する会計基準」がマネジメント・アプローチの採用理由として言及する２つの特性を示すとともに、その優劣関係を説明しなさい。","a":"２つの特性は、意思決定との関連性と比較可能性である。意思決定との関連性は信頼性とともに意思決定有用性を直接支える特性で、有用か否かを直接判定する規準として機能する。比較可能性は有用であるために必要な最低限の基礎的条件であり、これによって意思決定有用性が直接判断されるわけではない。したがって、意思決定との関連性は比較可能性に優先する。"},
 {"id":"5-9","rank":"B","q":"セグメント情報の開示にあたりマネジメント・アプローチを採用することのメリットとデメリットを、概念フレームワークの考え方を踏まえて説明しなさい。","a":"メリット：財務諸表利用者が経営者の視点で企業を見ることで経営者の行動を予測し、その予測を将来キャッシュ・フローの評価に反映できるため、意思決定との関連性の観点からメリットがある。\nデメリット：企業の組織構造に基づく情報であるため、企業間の比較が困難になり、同一企業の年度間の比較も困難になるため、比較可能性の観点からデメリットがある。"},
 {"id":"5-10","rank":"A","q":"自己創設のれんを計上することは認められるか、財務報告の目的の観点から説明しなさい。","a":"認められない。財務報告の目的は投資家による企業成果の予測と企業価値評価に役立つ財務状況の開示であり、経営者が負うべき責任は基本的には事実の開示である。自己創設のれんの計上は経営者による企業価値の自己評価・自己申告を意味し、事実の開示に該当しないため、財務報告の目的に反する。"},
 {"id":"5-11","rank":"A","q":"概念フレームワークにおける資産の定義を述べるとともに、支配及び経済的資源の意味について説明しなさい。","a":"資産は、過去の取引または事象の結果として、報告主体が支配している経済的資源と定義される。支配とは、所有権の有無にかかわらず、報告主体が経済的資源を利用し、そこから生み出される便益を享受できる状態をいい、経済的資源とは、キャッシュの獲得に貢献する便益の源泉をいう。"},
 {"id":"5-12","rank":"A","q":"概念フレームワークにおける負債の定義を述べなさい。","a":"負債は、過去の取引または事象の結果として、報告主体が支配している経済的資源を放棄もしくは引き渡す義務、またはその同等物と定義される。"},
 {"id":"5-13","rank":"A","q":"繰延税金資産には資産性があるか、資産の定義に照らして説明しなさい。","a":"繰延税金資産は、過去に生じた将来減算一時差異等について、将来の解消期間における法人税等の支払額の減額を意味し、法人税等の前払額に相当する。これは資産の定義（過去の取引等の結果、支配している経済的資源）に合致するため、資産性がある。"},
 {"id":"5-14","rank":"B","q":"繰延資産には資産性があるか、概念フレームワークにおける資産の定義に照らして説明しなさい。","a":"繰延資産は既に役務の提供を受けているためそれ自体に換金能力はないが、将来の便益が得られると期待できるのであれば、過去の取引または事象の結果として報告主体が支配している経済的資源という資産の定義に必ずしも反していない。したがって、将来の便益が得られると期待できる繰延資産には資産性がある。"},
 {"id":"5-15","rank":"B","q":"製品保証引当金は概念フレームワークにおける負債の定義を充足するか、説明しなさい。","a":"充足する。製品保証引当金は、過去に行った保証付き販売に基づき、将来発生が予想される保証費の未払額であるため、過去の取引または事象の結果として、報告主体が支配している経済的資源を放棄もしくは引き渡す義務またはその同等物という負債の定義を充足する。"},
 {"id":"5-16","rank":"A","q":"修繕引当金は概念フレームワークにおける負債の定義を充足するか、説明しなさい。","a":"充足しない。修繕引当金は、操業停止や設備の廃棄をした場合には修繕が不要となるため、過去の取引等の結果、経済的資源を放棄・引渡す義務またはその同等物という負債の定義を充足しない。"},
 {"id":"5-17","rank":"A","q":"概念フレームワークにおいて株主資本はどのように定義されているか述べなさい。","a":"株主資本は、純資産のうち報告主体の所有者である株主（連結財務諸表の場合には親会社株主）に帰属する部分と定義される。"},
 {"id":"5-18","rank":"B","q":"株主資本が報告主体の所有者である株主に帰属する部分に限定される理由を説明しなさい。","a":"投資の成果を表す利益の情報は、企業価値評価の基礎となる将来キャッシュ・フローの予測に広く用いられている。利益情報の主要な利用者・受益者は、報告主体の企業価値に関心を持つ当該報告主体の（現在及び将来の）所有者である。そのため、純利益に対応する株主資本は、報告主体の所有者である株主に帰属するものと位置付けられる。"},
 {"id":"5-19","rank":"D","q":"投資のリスクとは何か、また投資のリスクからの解放とはどのようなことを意味するか、それぞれ説明しなさい。","a":"投資のリスクとは、投資の成果の不確定性のことである。投資のリスクからの解放とは、投資にあたって期待された成果が事実として確定することを意味する。"},
 {"id":"5-20","rank":"A","q":"概念フレームワークにおける、利益の測定にとっての基本的な制約について説明しなさい（純利益・包括利益との関係にも言及）。","a":"企業の投資の成果は、最終的には投下した資金と回収した資金の差額にあたるネット・キャッシュフローであり、各期の利益の合計がその額に等しくなることが利益測定にとっての基本的な制約になる。包括利益と純利益はともにこの制約を満たす。"},
 {"id":"5-21","rank":"D","q":"概念フレームワークにおける、純利益と包括利益の関係について説明しなさい。","a":"包括利益のうち、(1)投資のリスクから解放されていない部分を除き、(2)過年度に計上された包括利益のうち期中に投資のリスクから解放された部分を加え、(3)非支配株主に帰属する純利益を控除すると、（親会社株主に帰属する）純利益が求められる。"},
 {"id":"5-22","rank":"A","q":"その他の包括利益のリサイクリングについて、①しない方法と②する方法の意義を述べ、特徴を純利益の性質、クリーン・サープラス関係、一致の原則の成否、包括利益の二重計上の観点から説明しなさい。","a":"①リサイクリングしない方法：過去のその他の包括利益項目を当期純利益に含めず、実現時に利益剰余金へ直接加減する。「純利益＝実現利益」の関係、クリーン・サープラス関係、一致の原則はいずれも成立しないが、包括利益の二重計上は回避される。\n②する方法：実現時に当期純利益を通じて利益剰余金を増減させる。上記３関係はいずれも成立し、その他の包括利益から控除する処理により二重計上も回避される。"},
 {"id":"5-23","rank":"A","q":"財務諸表の構成要素の定義を充足した項目が財務諸表上の認識対象となるための２つの制約条件とその理由を説明しなさい。","a":"制約条件：①基礎となる契約の原則として少なくとも一方の履行があること ②将来事象が一定水準以上の確からしさで生じると見積られること。\n理由：履行の見込みが不確実な契約から構成要素を認識したり、発生可能性が極めて乏しい構成要素を認識したりすると、誤解を招く情報が生み出されてしまうため。"},
 {"id":"5-24","rank":"B","q":"未償却原価による測定値の意味を説明しなさい。","a":"未償却原価による測定値は、継続利用している資産について将来に回収されるべき投資の残高を表す。この測定は、資産の価値の測定方法としてよりも、資産の利用に伴う費用を測定する上で重要な意味を持つ。"},
 {"id":"5-25","rank":"A","q":"有形固定資産は原価評価されるのに対し、売買目的有価証券は時価評価される。評価基準が異なる理由を説明しなさい。","a":"有形固定資産は事業投資であり、その利用により将来回収されるべき投資の残高たる取得原価が投資家にとって有用な情報を表す。売買目的有価証券は金融投資であり、処分によって得られる資金の額たる時価が投資家にとって有用な情報を表す。投資家にとって有用な情報が異なるため評価基準が異なる。"},
 {"id":"5-26","rank":"B","q":"負債の測定値のうち、リスクを調整した割引率による割引価値の意味を説明するとともに、この測定値で負債を測定する場合の問題点を説明しなさい。","a":"意味：負債の市場価格を推定する際に意味を持つことがある測定値。\n問題点：報告主体の信用リスクが増大した場合に負債が減少し収益が計上されることになるため、会計情報が投資家による企業成果の予測と企業価値の評価に役立たなくなる。"},
 {"id":"5-27","rank":"B","q":"投資のリスクからの解放概念に基づく投資の成果の認識時点について、事業投資と金融投資に分けて説明しなさい。","a":"事業投資：事業のリスクに拘束されない独立の資産を獲得したとみなせるときに投資のリスクから解放されると考えられるため、当該資産の獲得時点で投資の成果が認識される。\n金融投資：事業の目的に拘束されず時価の変動によって利益を獲得することを目的とするため、価値の変動はそのまま期待に見合う事実としてリスクから解放された成果に該当し、価値の変動時点で投資の成果が認識される。"},
 {"id":"5-28","rank":"C","q":"投資のリスクからの解放の考え方によると、期末に売買目的有価証券の時価評価差額を収益として認識することは適切といえるか、説明しなさい。","a":"適切といえる。売買目的有価証券は時価の変動によって利益を獲得することを目的とし、売却に事業遂行上の制約がないため、時価の変動が生じた時点で投資にあたって期待された成果が事実として確定したと考えることができる。"},
 {"id":"5-29","rank":"C","q":"投資のリスクからの解放の考え方によると、期末にその他有価証券の時価評価差額を収益として認識することは適切といえるか、説明しなさい。","a":"適切とはいえない。その他有価証券は保有目的が明確に認められず、事業遂行上等の必要性から直ちに売買・換金を行うことには制約を伴う要素もあるため、時価の変動が生じた時点では期待された成果が事実として確定したと考えることはできない。"}
]},
{ch:6, title:"純資産", items:[
 {"id":"6-1","rank":"B","q":"貸借対照表の区分が「資本の部」から「純資産の部」に変更された。従来の「資本の部」と変更後の「純資産の部」の特徴を述べるとともに、変更により期待される効果を説明しなさい。","a":"従来の「資本の部」は報告主体の所有者（株主）に帰属するものという特徴があり、これが差額としての純資産となるように資産・負債が取扱われてきた。変更後の「純資産の部」は、まず資産性・負債性をもつものを資産の部・負債の部に記載し、それらに該当しないものを資産と負債との差額として記載するため、差額概念という特徴を有する。この変更により、貸借対照表において報告主体の支払能力などの財政状態をより適切に表示することが可能となる。"},
 {"id":"6-2","rank":"B","q":"「資本の部」という表記を「純資産の部」に代えた理由を説明しなさい。","a":"資産や負債を明確にしても、これらの差額がそのまま資本となる保証はない。このため、報告主体の所有者に帰属する資本とは必ずしも同じとはならない資産と負債との単なる差額を適切に示すように、「資本の部」の表記を「純資産の部」に代えた。"},
 {"id":"6-3","rank":"A","q":"「貸借対照表の純資産の部の表示に関する会計基準」により表示区分が純資産の部に変更された項目を３つ挙げ、変更前後の理由を説明しなさい。","a":"①繰延ヘッジ損益：変更前は資産・負債として繰延処理→資産性・負債性を有しないため変更。\n②新株予約権：変更前は仮勘定として負債の部に計上→返済義務のある負債ではないため変更。\n③非支配株主持分：変更前は負債と資本の中間区分に表示→返済義務のある負債ではなく、中間区分を設けることに問題があるため変更。"},
 {"id":"6-4","rank":"B","q":"純資産の部はいかなる観点から株主資本と株主資本以外の各項目に区分されるか、「株主資本」という名称を用いた理由に触れつつ説明しなさい。","a":"帰属の観点から区分される。純資産のうち報告主体の所有者たる株主に帰属する部分について「株主資本」という名称を用いることで、株主に帰属するものであることをより強調し、株主に帰属しない部分と明確に区分している。"},
 {"id":"6-5","rank":"A","q":"純資産の部を株主資本と株主資本以外の各項目に区分する理由を説明しなさい。","a":"報告主体の所有者に帰属する利益は将来キャッシュ・フローの予測に広く用いられ特に重要と考えられる。当該情報の主要な利用者・受益者は株主であるため、当期純利益とこれを生み出す株主資本が重視される。また純資産と株主資本が同義でないことを明示するため、株主資本を他の項目から区分することとされている。"},
 {"id":"6-6","rank":"A","q":"純資産の部を株主資本と株主資本以外の各項目に区分した結果、損益計算書と貸借対照表の関係はどうなったか説明しなさい。","a":"損益計算書における当期純利益の額と、貸借対照表における株主資本の資本取引を除く当期変動額とが一致することとなり、資本と利益の連繋（クリーン・サープラス関係）が確保されることとなった。"},
 {"id":"6-7","rank":"C","q":"貸借対照表において株主資本を資本金・資本剰余金・利益剰余金に区分する理由を説明しなさい。","a":"債権者保護の観点から資本金・法定準備金・剰余金に区分してきた会社法の考え方と、払込資本と留保利益に区分する企業会計の考え方との調整による。株主が拠出した払込資本と利益の留保部分である留保利益を分けることは分配制限を離れた情報開示の面でも強い要請があるため、これを区別するために資本金・資本剰余金・利益剰余金に区分する。"},
 {"id":"6-8","rank":"C","q":"株主がその他資本剰余金の処分による配当を受けた場合の会計処理とその理由を説明しなさい（売買目的有価証券ではない）。","a":"原則として配当受領額を配当の対象である有価証券の帳簿価額から減額する。その他資本剰余金は払込資本の一項目であるため、その処分による配当は基本的には投資の払戻しの性格を持つことが理由。"},
 {"id":"6-9","rank":"C","q":"株主がその他資本剰余金の処分による配当を受けた場合の会計処理とその理由を説明しなさい（売買目的有価証券）。","a":"配当受領額を受取配当金として営業外収益に計上する。期末に時価評価され評価差額が損益計算書に計上されている売買目的有価証券の場合、配当に伴う価値の低下が期末時価に反映されているため、配当の原資にかかわらず収益計上することが適切。"},
 {"id":"6-10","rank":"A","q":"貸借対照表において評価・換算差額等を純資産の部に株主資本とは区別して記載する理由について説明しなさい。","a":"評価・換算差額等は資産性・負債性を有しないため純資産の部に記載する。また株主資本に含めると当期純利益が資本取引を除く株主資本の変動をもたらすという関係が成立しなくなるため、株主資本とは区別して記載する。"},
 {"id":"6-11","rank":"A","q":"評価・換算差額等を株主資本とは区別して記載する理由について、株主資本を構成する項目の特徴を踏まえて説明しなさい。","a":"株主資本は払込資本と留保利益から構成される。評価・換算差額等は払込資本ではなく、かつ未だ当期純利益に含められていないため留保利益にも該当しない。したがって株主資本には該当せず、株主資本とは区別して記載する。"},
 {"id":"6-12","rank":"A","q":"貸借対照表において新株予約権を純資産の部に株主資本とは区別して記載する理由を説明しなさい。","a":"新株予約権は返済義務のある負債ではないため純資産の部に記載する。また株主とは異なる新株予約権者との直接的な取引によるものであり、株主に帰属するものではないため株主資本とは区別して記載する。"},
 {"id":"6-13","rank":"C","q":"新株予約権を株主資本に含めて記載するべきとする見解の論拠を説明しなさい。","a":"新株予約権は、将来権利行使されれば払込資本となり、失効すれば利益になるが、いずれにしても株主資本を構成し、報告主体の所有者である株主に帰属することになるため。"},
 {"id":"6-14","rank":"B","q":"連結貸借対照表において非支配株主持分を純資産の部に株主資本とは区別して記載する理由を説明しなさい。","a":"非支配株主持分は返済義務のある負債ではなく、中間区分を設けることには問題があるため純資産の部に記載する。また子会社の資本のうち親会社に帰属していない部分であり親会社株主に帰属するものではないため、株主資本とは区別して記載する。この取扱いは親会社株主に帰属する当期純利益と株主資本との連繋にも配慮したもの。"},
 {"id":"6-15","rank":"B","q":"連結貸借対照表上、株主資本以外の項目は３つに区分される。これらの区分はどのような観点から行われているか、説明しなさい。","a":"帰属の観点から行われている。①投資のリスクから解放されておらずいずれにも帰属しないその他の包括利益累計額、②報告主体の将来の所有者となり得るオプションの所有者に帰属する新株予約権、③子会社の資本のうち非支配株主に帰属する非支配株主持分、の３つに区分される。"},
 {"id":"6-16","rank":"C","q":"土地再評価法に基づき再評価した土地を売却した場合の土地再評価差額金の取扱いを説明するとともに、この取扱いの問題点を指摘しなさい。","a":"当該土地について計上された土地再評価差額金は、損益計算書を経由せずにその他利益剰余金に繰入れられる。リサイクリングが行われないため、当期純利益の額と株主資本の資本取引を除く当期変動額が一致せず、資本と利益の連繋が阻害されるという問題がある。"},
 {"id":"6-17","rank":"C","q":"資本金及び資本準備金の額の減少によって生ずる剰余金をその他資本剰余金とする理由を説明しなさい。","a":"いずれも減額前の資本金及び資本準備金の持っていた払込資本という会計上の性格が変わるわけではなく、資本性の剰余金の性格を有すると考えられるため。"},
 {"id":"6-18","rank":"C","q":"利益準備金の額の減少によって生ずる剰余金をその他利益剰余金とする理由を説明しなさい。","a":"利益準備金はもともと留保利益を原資とするものであり、利益性の剰余金の性格を有するため、その減少によって生ずる剰余金はその他利益剰余金の増額項目とすることが適切と考えられるため。"},
 {"id":"6-19","rank":"A","q":"資本剰余金の各項目と利益剰余金の各項目を混同してはならない理由を説明しなさい。","a":"資本金・資本準備金減少による剰余金を利益剰余金へ振替えることを無制限に認めると、払込資本と払込資本を利用して得た成果を区分することが困難になり、その他資本剰余金に区分する意味がなくなるため、混同は禁止される。"},
 {"id":"6-20","rank":"B","q":"利益剰余金が負の残高のときにその他資本剰余金で補てんする会計処理は資本剰余金と利益剰余金の混同に該当するか、理由とともに説明しなさい。","a":"該当しない。払込資本と留保利益の区分が問題になるのは、同じ時点で両者が正の値であるときに、両者間で残高を振り替えたり一方に負担させるべき分を他方に負担させたりするケースである。負の残高になった利益剰余金を将来の利益を待たずにその他資本剰余金で補うのは、払込資本に生じている毀損を事実として認識するものであるため、払込資本と留保利益の区分の問題にあたらない。"},
 {"id":"6-21","rank":"B","q":"その他資本剰余金による補てんの対象となる利益剰余金が、年度決算時の負の残高に限られる理由を説明しなさい。","a":"期中において発生した利益剰余金の負の値をその都度資本剰余金で補てんすることは、年度決算単位でみた場合、資本剰余金と利益剰余金の混同になることがあるため。"},
 {"id":"6-22","rank":"A","q":"自己株式の会計上の性格について、①資産として扱う考え方と②資本の控除として扱う考え方の論拠を説明しなさい。","a":"①自己株式を取得したのみでは株式は失効しておらず、他の有価証券と同様に換金性のある会社財産とみられることを論拠とする。\n②自己株式の取得は株主との間の資本取引であり、会社所有者に対する会社財産の払戻しの性格を有することを論拠とする。"},
 {"id":"6-23","rank":"A","q":"自己株式を無償取得した場合の①時価で測定する方法と②数のみの増加として処理する方法の論拠、及び制度上の採用理由を説明しなさい。","a":"①自己株式にも換金性があり、価値のあるものを受取っている以上、時価で測定し認識すべきという論拠。\n②無償取得しても資産は増加せず、贈与株主の持分が他の株主に移転するのみ（新旧株主間の富の移転）という論拠。\n制度上は②が採用されている。理由：自己株式取得を株主との資本取引・会社財産の払戻しと位置付ける考え方との整合性から、換金可能資産としての側面に着目する①は適切でないため。"},
 {"id":"6-24","rank":"B","q":"自己株式を株主資本の控除とする場合の会計処理について、①取得原価で一括して株主資本全体の控除項目とする方法と②株主資本の構成要素に配分して直接減額する方法の論拠及び背後の考え方を説明しなさい。","a":"①自己株式を取得したのみでは発行済株式総数が減少せず、取得後の処分もあり得る点に着目し、保有は処分または消却までの暫定的な状態であると考える。背後には自己株式の取得と処分を一連の取引とみる考え方がある。\n②自己株式の取得を自己株式の消却に類似する行為であると考える。背後には取得と処分を別個独立した取引とみる考え方がある。"},
 {"id":"6-25","rank":"A","q":"自己株式処分差益を資本剰余金として処理する理由を説明しなさい。","a":"自己株式の処分が新株の発行と同様の経済的実態を有する点を考慮すると、その処分差額も株主からの払込資本と同様の経済的実態を有すると考えられるため。"},
 {"id":"6-26","rank":"A","q":"自己株式処分差損の取扱いについて、２つの考え方と制度上採用されている考え方を、理由とともに説明しなさい。","a":"考え方：①資本剰余金の額の減少（払込資本の払戻しと同様の性格） ②利益剰余金の額の減少（利益配当と同様の性格）。\n制度上は①が採用される。理由：自己株式の処分は新株発行と同様の経済的実態を有するため、利益剰余金の額を増減させるべきではないから。"},
 {"id":"6-27","rank":"C","q":"自己株式の取得及び処分の認識時点について、①契約時に認識する方法と②取得は対価を支払うべき日、処分は払込期日に認識する方法の論拠を説明しなさい。","a":"①自己株式を資産として扱う考え方と整合的で、取得・処分が既発行株式の売買によって行われることを論拠とする。\n②自己株式を資本の控除として扱う考え方と整合的で、取得・処分が株主への資本の払戻し及び株主からの資本の払込みの性格を有することを論拠とする。"},
 {"id":"6-28","rank":"D","q":"自己株式の消却の会計処理を、取締役会等の意思決定の段階ではなく消却手続完了時に行う理由を説明しなさい。","a":"自己株式の消却を取締役会等で意思決定しただけでは、法的に発行済株式数が減少するわけではないため。"},
 {"id":"6-29","rank":"A","q":"自己株式の取得・処分・消却に関する付随費用の会計処理について、２つの考え方と制度上の採用理由を説明しなさい。","a":"①損益計算書に計上する考え方：付随費用は株主との資本取引ではなく会社の業績に関係する財務費用とみる。\n②取得費用は取得価額に含め、処分・消却費用は処分差額等の調整とする考え方：自己株式本体の取引と一体とみる。\n制度上は①が採用。理由：新株発行費用を株主資本から減額していない処理との整合性から。"},
 {"id":"6-30","rank":"B","q":"制度会計上、株式交付費は資本から直接控除する方法ではなく費用として処理する方法が採用されている。その理由を説明しなさい（論証4-16と同一）。","a":"①株式交付費は株主との資本取引に伴って発生するが、その対価は株主に支払われたものではないため、支出自体は資本取引ではない。②社債発行費と同様、資金調達に要する支出額であり財務費用としての性格が強い。③資金調達の方法は会社の意思決定によるものであり、その費用を会社の業績に反映させることが投資家への有用な情報提供になる。"},
 {"id":"6-31","rank":"B","q":"自己新株予約権の会計上の性格について、簡潔に説明しなさい。","a":"自己新株予約権の取引は、株主との資本取引ではなく新株予約権者との損益取引であるため、自己新株予約権は資産性を有する。"},
 {"id":"6-32","rank":"C","q":"自己新株予約権の取得は新株予約権者との損益取引であるが、取得時に損益を計上しない。その理由を説明しなさい。","a":"自己新株予約権の取得時には、その後に当該自己新株予約権を消却するか処分するかが必ずしも明らかではないため。"},
 {"id":"6-33","rank":"B","q":"貸借対照表において自己新株予約権を純資産の部の新株予約権から控除して表示する理由を説明しなさい。","a":"自己新株予約権は資産性を有するため資産の部と純資産の部に両建て表示する方法も考えられるが、取得する取引は自らが発行した新株予約権の買戻しであることから、純資産の部の新株予約権と相殺表示する方が実態に即していると考えられるため。"},
 {"id":"6-34","rank":"A","q":"制度会計上、その他資本剰余金の残高が負の値になった場合、零としその他利益剰余金から減額する理由を説明しなさい。","a":"その他資本剰余金は払込資本から資本金・資本準備金を控除した残額であり、払込資本の残高が負の値になることはあり得ない以上、払込資本の一項目として表示するその他資本剰余金について負の残高を認めることは適当ではないため。"},
 {"id":"6-35","rank":"B","q":"その他資本剰余金の残高が負の値になった場合のその他利益剰余金による補てんを、その都度ではなく会計期間末に行う理由を説明しなさい。","a":"その都度補てんしてその他資本剰余金の額を確定すると、その増減が同一会計期間内に反復的に起こった場合に、増加と減少の発生の順番が異なると結果が異なり、不合理であるため。"},
 {"id":"6-36","rank":"B","q":"その他資本剰余金の負の値をその他利益剰余金から減額した期の翌期以後に自己株式処分差益が生じても、減額した範囲でその他利益剰余金を増額しない理由を説明しなさい。","a":"払込資本に生じた毀損を留保利益で埋め合わせるのはその期に完結する処理であり、そこで充当した留保利益を翌期以後の資本取引に基づく剰余金と入れ替えて元に戻すのは適切ではないため。"},
 {"id":"6-37","rank":"B","q":"連結子会社が保有する親会社株式を、純資産の部の株主資本に対する控除項目として表示する理由を説明しなさい。","a":"連結子会社が保有する親会社株式は、企業集団で考えた場合、親会社の保有する自己株式と同様の性格を有するため。"},
 {"id":"6-38","rank":"C","q":"連結子会社が自己株式を非支配株主から取得した段階で、親会社の持分比率の変動を認識する理由を２つ挙げなさい。","a":"①持分比率の変動を認識しなかった場合、実際に非支配株主が減少しているのに、減少に見合う非支配株主に帰属する当期純利益及び非支配株主持分の減少が認識されないことになる。②会社法では自己株式の保有目的を限定していないため、子会社による自己株式の保有が長期間継続することが想定される。"}
]},
{ch:7, title:"ストック・オプション等", items:[
 {"id":"7-1","rank":"B","q":"親会社が子会社の従業員等に親会社株式を原資産とした株式オプションを付与する取引について、親会社の個別財務諸表において費用を計上する理由を説明しなさい。","a":"追加的に提供されるサービスの直接の受領者は子会社であるが、親会社が自社株式オプションを付与するのは、子会社の従業員等に対し親会社自身の子会社に対する投資の価値を結果的に高めるようなサービス提供を期待しているためと考えられ、当該取引にも対価性を認めることができる。したがって親会社が子会社において享受したサービスの消費を、親会社の個別財務諸表において費用として計上する。"},
 {"id":"7-2","rank":"C","q":"親会社が子会社の従業員等に親会社株式オプションを付与する取引について、どのような場合に子会社の個別財務諸表においても費用を計上する必要があるか、会計処理に触れつつ説明しなさい。","a":"付与が子会社の報酬体系に組み入れられている等、子会社においても自社の従業員等に対する報酬として位置付けられている場合。その付与と引換えに提供されたサービスの消費を子会社の個別財務諸表でも費用として計上し、同時に、報酬の負担を免れたことによる利益を特別利益として計上する。"},
 {"id":"7-3","rank":"C","q":"敵対的買収防止策として付与される自社株式オプションについて費用認識は行われるか、理由とともに説明しなさい。","a":"行われない。費用認識の対象となるのは、企業が財貨またはサービスの取得において対価として自社株式オプションを付与する取引であるが、敵対的買収防止策として付与されるものは財貨またはサービスを取得する対価として付与されているわけではないため。"},
 {"id":"7-4","rank":"A","q":"制度会計上、ストック・オプションを付与する取引について費用認識が行われる根拠を説明しなさい。","a":"従業員等に付与されたストック・オプションを対価として、これと引換えに企業に追加的にサービスが提供され、企業に帰属することとなったサービスを消費したことに費用認識の根拠がある。企業に帰属する財貨を消費した場合に費用認識が必要である以上、企業に帰属するサービスを消費した場合にも費用を認識するのが整合的である。"},
 {"id":"7-5","rank":"B","q":"企業が従業員等に自社株式オプションを付与した場合、基本的に報酬性を有すると考えられる論拠を述べなさい。","a":"合理的な経済活動を営んでいる企業が見返りも無く自社株式オプションを付与しているとは考えにくく、企業は従業員等に付与した場合に、量または質の面で追加的なサービスの提供（インセンティブ効果）を期待していると考えられるため。"},
 {"id":"7-6","rank":"B","q":"「ストック・オプションの付与によっても新旧株主間で富の移転が生じるに過ぎないから、費用認識には根拠がない」という指摘に対する反論を示しなさい。","a":"ストック・オプションは対価として付与されるものであり、この取引の結果企業に帰属することとなったサービスを消費することにより費用を生じる取引としての性格を有する。新旧株主間の富の移転を生ずる取引であっても、従業員等へのストック・オプション付与のように対価として利用されている取引と、時価未満発行のように発行価額の払込み以外に対価関係にある給付の受入れを伴わない取引とは異なる種類の取引であり、富の移転を生じさせたからといって費用認識が否定されるわけではない。"},
 {"id":"7-7","rank":"B","q":"「ストック・オプションを付与しても会社財産の流出が生じないため、費用認識に根拠がない」という指摘に対する反論を示しなさい。","a":"確かに会社財産の流出はないが、ストック・オプションを対価として提供されたサービスの消費の事実に着目すれば、企業にとっての費用と考えられる。償却資産の現物出資や贈与を受けた場合には、対価としての会社財産の流出はないが減価償却費は認識されており、会社財産の流出は費用認識の必要条件ではない。"},
 {"id":"7-8","rank":"B","q":"費用計上額をストック・オプションの公正な評価額に基づき算定する理由を説明しなさい。","a":"付与したストック・オプションとこれに応じて提供されたサービスは、契約成立時点で等価交換されていると考えられる。相互に対価関係にある財貨やサービスの間では、より高い信頼性をもって測定可能な評価額で他方の価値を算定することとなるが、取得するものが従業員等から提供される追加的なサービスである場合には信頼性をもって測定できないため、その価値を、付与されたストック・オプションの価値で算定する。"},
 {"id":"7-9","rank":"B","q":"ストック・オプションの公正な評価単価の算定の基準日を付与日とする理由を説明しなさい。","a":"ストック・オプションを用いた取引も等価交換が前提と考えられるが、この等価性の判断において前提となるストック・オプションの価値は、条件付の契約が締結されたといえる付与日における価値であると考えるのが合理的であるため。"},
 {"id":"7-10","rank":"B","q":"ストック・オプションの公正な評価単価を付与日以後見直さない理由を説明しなさい。","a":"付与日以後の公正な評価単価の変動は、原資産である株式の時価の変動等により起こるものであり、サービスの価値とは直接的な関係を有しないため。"},
 {"id":"7-11","rank":"B","q":"ストック・オプション数の算定にあたり、権利不確定による失効の見積数を控除する理由を説明しなさい。","a":"権利確定条件を満たすサービスが提供されてはじめて権利が確定することから、権利が確定するか否かが未定の間は、権利が確定する部分の見積り計算によらざるを得ないため。"},
 {"id":"7-12","rank":"A","q":"ストック・オプションの権利不行使による失効部分について、費用の取消が行われない理由を説明しなさい。","a":"権利確定後、権利行使されないままストック・オプションが失効した場合でも、これと引換えに提供されたサービスは既に消費されている以上、過去における費用の認識自体は否定されないため。"},
 {"id":"7-13","rank":"A","q":"ストック・オプションの権利不行使による失効部分を利益に計上する理由を説明しなさい。","a":"ストック・オプションは自社株式をあらかじめ決められた価格で引渡す可能性にすぎないから、行使されずに失効すれば会社は株式を時価未満で引渡す義務を免れる。結果が確定した時点で振り返れば無償で提供されたサービスを消費したと考えられ、新株予約権を付与したことに伴う純資産の増加が株主との直接的な取引によらないこととなった場合は、それを利益に計上した上で株主資本に算入することが適切である。"},
 {"id":"7-14","rank":"A","q":"ストック・オプションの公正な評価単価を変動させる条件変更が行われた場合に、追加的に費用計上する理由を説明しなさい。","a":"公正な評価単価の算定は付与日現在の価値で行いその後見直さないが、行使価格の引下げ等の条件変更が行われた場合には、等価交換の前提とされたストック・オプションの公正な評価単価についての修正が行われたと考えられるため。"},
 {"id":"7-15","rank":"A","q":"条件変更後の公正な評価単価が付与日の評価単価を下回る場合に、条件変更前からの費用計上を継続する理由を説明しなさい。","a":"下回る場合にも上回る場合と同様の会計処理を求めると、ストック・オプションの条件を従業員等にとってより価値あるものとすることで、かえって費用を減額させるというパラドックスが生じてしまうため、これを回避するため。"},
 {"id":"7-16","rank":"A","q":"権利不確定による失効見積数の重要な変動と、ストック・オプション数を変動させる条件変更の会計処理の違いを、理由とともに説明しなさい。","a":"失効見積数の重要な変動は環境変化等の企業が意図しない変動であるため、その影響額を見直した期の損益として計上する。企業の意図による条件変更の結果生じた数の変動は、将来にわたる効果を期待して行われたものと考えられるため、その影響額は条件変更後、残存期間にわたって反映させる。"},
 {"id":"7-17","rank":"A","q":"ストック・オプション数を変動させる条件変更が行われた場合に、影響額を残存期間にわたって計上する理由を説明しなさい。","a":"企業の意図による条件変更の結果、ストック・オプション数に変動が生じた場合には、将来にわたる効果を期待して条件変更を行ったものと考えられるため。"},
 {"id":"7-18","rank":"C","q":"未公開企業において、公正な評価単価に代え単位当たりの本源的価値の見積りに基づく会計処理が認められる理由を２つ挙げなさい。","a":"①株式に市場価格がないため、公正な評価額を損益計算に反映させるに足りるだけの信頼性をもって見積ることが困難な場合が多い。②一般投資家がいないため、本源的価値の見積りによることへの許容性がある。"},
 {"id":"7-19","rank":"C","q":"未公開企業において認められる、単位当たりの本源的価値の見積りに基づく会計処理の問題点を指摘しなさい。","a":"本源的価値によった場合、自社株式の評価額が行使価格を上回る状態で付与された場合を除き価値がゼロとなる結果、事実上費用が計上されず、サービス消費の事実を財務諸表に反映させることができないという問題がある。"}
]},
{ch:8, title:"退職給付", items:[
 {"id":"8-1","rank":"B","q":"退職給付の費用認識に関する基本的な考え方を説明しなさい。","a":"退職給付の性格は労働の対価として支払われる賃金の後払いであり、基本的に勤務期間を通じた労働の提供に伴って発生するものである。そうであるならば、支給方法や積立方法に関わらず、退職給付はその発生した期間に費用として認識する。"},
 {"id":"8-2","rank":"B","q":"退職給付債務の概念としての予測給付債務の意義、採用理由及び問題点を説明しなさい。","a":"予測給付債務とは、受給権未取得者を含む全従業員について、認識時点までの勤務期間と将来の昇給による給付の増加を見込んで算定した将来退職給付額の現在価値をいう。\n採用理由：実際の支払いは退職時の額に基づくため、現在時点の支払額のみで将来額を見積ると実態を適切に反映しないと考えられるため。\n問題点：将来の昇給を考慮するため現在の義務に該当せず、負債の定義を満たさないのではとの指摘がある。"},
 {"id":"8-3","rank":"C","q":"一時的に支払われる早期割増退職金を退職給付見込額の見積りに含めない理由を説明しなさい。","a":"一時的に支払われる早期割増退職金は、勤務期間を通じた労働の提供に伴って発生した退職給付という性格を有しておらず、むしろ将来の勤務を放棄する代償、失業期間中の補償等の性格を有するものと捉えることが妥当であるため。"},
 {"id":"8-4","rank":"A","q":"退職給付見込額の期間帰属方法について期間定額基準が選択適用として認められている理由を説明しなさい。","a":"直接観察できない労働サービスの費消態様に合理的な仮定を置かざるを得ないことを踏まえれば、労働サービスに係る費用配分の方法は一義的に決まらず、勤務期間を基礎とする費用配分の方法（期間定額基準）についてもこれを否定する根拠は乏しいため。"},
 {"id":"8-5","rank":"A","q":"退職給付見込額の期間帰属方法としての給付算定式基準の長所を、期間定額基準と対比しつつ説明しなさい。","a":"勤続年数の増加に応じた労働サービスの向上を踏まえれば、毎期の費用を定額とする期間定額基準よりも、給付算定式に従って費用が増加するという取扱いの方が実態をより表す。"},
 {"id":"8-6","rank":"A","q":"退職給付見込額の期間帰属方法としての期間定額基準の問題点を２つ挙げなさい。","a":"①勤続年数の増加に応じた労働サービスの向上を踏まえれば実態を表しているとはいえない。②定年直前に給付が頭打ちになる場合等、勤務をしても給付が増加されない状況でも費用を認識する場合がある点で妥当ではない。"},
 {"id":"8-7","rank":"D","q":"平成10年の「退職給付に係る会計基準」で、割引率を一定期間の債券利回りの変動を考慮して決定することが認められていた理由を説明しなさい。","a":"相当長期間にわたって割り引かれる性質を持つ退職給付債務に関して、期末一時点の市場利回りで割り引くことが必ずしも適切とはいえない場合があるため。"},
 {"id":"8-8","rank":"B","q":"退職給付債務の計算における割引率を安全性の高い債券の利回りを基礎として決定する理由を説明しなさい。","a":"割引率は貸借対照表日現在の退職給付債務を求めるために用いるものであるから、金銭的時間価値のみを反映させるべきであるため。"},
 {"id":"8-9","rank":"A","q":"退職給付引当金の計上にあたって、年金資産の額を退職給付債務から控除する理由を説明しなさい。","a":"年金資産は退職給付の支払のためのみに使用されることが制度的に担保されていることなどから、これを収益獲得のために保有する一般の資産と同様に企業の貸借対照表に計上すると、かえって財務諸表の利用者に誤解を与えるおそれがあるため。"},
 {"id":"8-10","rank":"A","q":"利息費用と期待運用収益の費用処理額を営業損益として表示する方法の論拠を説明しなさい。","a":"①最終的に外部の運用機関に拠出する金額こそが企業が負担するべき労務費であると考えれば、勤務費用のほか利息費用及び期待運用収益も労務費として営業損益に含めるべき。②利息費用は実際の資金調達活動による費用とは異なり、財務損益として認識すべきものではない。"},
 {"id":"8-11","rank":"A","q":"数理計算上の差異を一時の費用として認識せず遅延認識する理由を説明しなさい。","a":"数理計算上の差異には予測と実績の乖離のみならず予測数値の修正も反映されることから、各期に生じる差異を直ちに費用として計上することが退職給付に係る債務の状態を忠実に表現するとは言えない面があり、一時の費用とすべきものとして一義的に決定づけることは難しいため。"},
 {"id":"8-12","rank":"A","q":"過去勤務費用を一時の費用として認識せず遅延認識する理由を説明しなさい。","a":"過去勤務費用の発生要因である給付水準の改訂等は、従業員の勤労意欲が将来にわたって向上するとの期待のもとに行われる面があり、その性格を一時の費用とすべきものとして一義的に決定づけることは難しいため。"},
 {"id":"8-13","rank":"C","q":"退職従業員に係る過去勤務費用を、他の過去勤務費用と区分して発生時に全額費用処理することが認められている理由を説明しなさい。","a":"退職従業員は給付水準の改訂により将来の勤務意欲の向上という効果が期待できないため。"},
 {"id":"8-14","rank":"A","q":"数理計算上の差異の取扱いに関する重要性基準と回廊アプローチの意義・共通の目的、制度上の採用理由を説明しなさい。","a":"重要性基準：計算基礎に重要な変動が生じない場合は変更しない等、決定にあたり重要性による判断を認める方法。回廊アプローチ：数理計算差異に一定の許容範囲（回廊）を設ける方法。共通目的：基礎率の変動が財務諸表に与える影響を緩和すること。制度上は重要性基準が採用される。理由：退職給付費用は長期的な見積計算であることから、重要性による判断を認めることが適切と考えられるため。"},
 {"id":"8-15","rank":"B","q":"制度会計上、重要性基準と回廊アプローチの併用は行われていない。その理由を説明しなさい。","a":"計算基礎に重要性による判断を認めた上で回廊を設けることとする場合、実質的な許容範囲の幅が極めて大きくなるため。"},
 {"id":"8-16","rank":"B","q":"平均残存勤務期間が10年から８年に短縮された場合の、①平均残存勤務期間を費用処理年数としていたため10年→８年に変更するケース、②９年を費用処理年数としていたが７年に変更するケース、③６年を５年に変更するケースの会計上の取扱いを説明しなさい。","a":"①会計事実の変更に伴う会計上の見積りの変更として取扱う。\n②再検討された平均残存勤務期間が費用処理年数より短くなったことを原因とした変更は、会計事実の変更に伴う費用処理年数の変更であるため、会計上の見積りの変更として取扱う。\n③費用処理年数は毎期継続適用しないと期間比較可能性が確保されないため、変更には合理的な理由が必要。合理的な理由があると認められた場合には、会計方針の変更として取扱う。"},
 {"id":"8-17","rank":"A","q":"連結貸借対照表において、積立状況を示す額を負債または資産に計上する理由を説明しなさい。","a":"未認識差異を除いた額を計上すると、積立超過のときに負債が計上されたり積立不足のときに資産が計上されたりするなど財務諸表利用者の理解を妨げるが、積立状況を示す額をそのまま負債または資産に計上することで、企業の財政状態を忠実に表現でき、明瞭で理解しやすい金額が表示されるため。"},
 {"id":"8-18","rank":"A","q":"数理計算上の差異について、その他の包括利益を通じて利益剰余金に計上するのみの方法が我が国で採用されていない理由、及び我が国の採用方法を説明しなさい。","a":"当該方法は数理計算上の差異が損益計算書に計上されることなく利益剰余金に計上されるため、我が国が重視する当期純利益と株主資本との連繋（クリーン・サープラス関係）が確保されないから採用されていない。我が国では、未認識数理計算上の差異をその他の包括利益を通じて純資産の部に計上し、平均残存勤務期間以内の一定の年数にわたって費用処理する方法を採用している。"},
 {"id":"8-19","rank":"B","q":"確定拠出制度においては要拠出額をもって費用処理するのみで、資産または負債の計上は行われない。その理由を説明しなさい。","a":"確定拠出制度では、企業は掛金以外に退職給付に係る追加的な拠出義務を負わず、資金の運用リスクを負担しないことから、積立過不足が生じる余地がなく、負債または資産を計上する必要がないため。"}
]},
{ch:9, title:"金融商品", items:[
 {"id":"9-1","rank":"B","q":"金融資産または金融負債自体を対象とする取引について、契約締結時にその発生を認識する理由を説明しなさい。","a":"金融資産または金融負債自体を対象とする取引については、当該取引の契約時から当該金融資産または金融負債の時価の変動リスクや契約の相手方の財政状態等に基づく信用リスクが契約当事者に生じるため。"},
 {"id":"9-2","rank":"C","q":"貸付金及び借入金については、契約日ではなく資金の貸借日にその発生を認識する。その理由を説明しなさい。","a":"貸付金及び借入金は時価評価せず、市場リスク及び信用リスクを反映しないため、契約日と現金の受渡日との評価額は同一となる。また継続的な取引を行っている場合、金銭消費貸借の契約日と現金の受渡日は通常同一である。したがって、契約日ではなく資金の貸借日にその発生を認識する。"},
 {"id":"9-3","rank":"B","q":"有価証券の売買契約における買手と売手の会計処理を、約定日から受渡日までの期間が通常の期間である場合と通常の期間よりも長い場合に分けて説明しなさい。","a":"通常の期間である場合：売買約定日に買手は有価証券の発生を認識し、売手は有価証券の消滅の認識を行う。\n通常の期間よりも長い場合：売買契約を買手も売手も先渡契約として約定日に認識し、決算日における未決済の先渡契約をデリバティブ取引として時価評価し、評価差額を当期の純損益として計上する。"},
 {"id":"9-4","rank":"A","q":"条件付きの金融資産の譲渡について①リスク・経済価値アプローチと②財務構成要素アプローチの意義、及び制度上の採用理由を説明しなさい。","a":"①金融資産のリスクと経済価値のほとんどすべてが他に移転した場合に消滅を認識する方法。②金融資産を構成する財務的要素（財務構成要素）に対する支配が他に移転した場合に当該要素の消滅を認識し、留保される要素の存続を認識する方法。\n制度上は②が採用。理由：譲渡人が回収サービス業務を引受ける等、金融資産を財務構成要素に分解して取引することが多くなると、①では分解して支配の移転を認識できず、取引の実質的な経済効果が反映されないため。"},
 {"id":"9-5","rank":"B","q":"現先取引は法形式上は債券の売買取引であるが、金融取引として処理することが求められる。その理由を説明しなさい。","a":"買戻すことにより取引を完結することがあらかじめ合意されている現先取引は、金融資産の契約上の権利に対する支配が他に移転しているとは認められない。したがって、その約定が売買契約であっても売買取引として処理することは認められず、金融取引として処理することとなる。"},
 {"id":"9-6","rank":"C","q":"『金融商品に関する会計基準』の原則的な考え方によれば、ローン・パーティシペーションは金融資産の消滅の認識要件を充たさない。その理由を説明しなさい。","a":"ローン・パーティシペーションは債権譲渡の第三者対抗要件を備えておらず、対象債権の原債権者と原債務者の権利義務関係に変化がないことから、譲渡された金融資産に対する譲受人の契約上の権利が譲渡人及びその債権者から法的に保全されているとはいえない。このように、金融資産の契約上の権利に対する支配の移転の要件を充たさないため、消滅の認識要件を充たさない。"},
 {"id":"9-7","rank":"C","q":"『金融商品に関する会計基準』の原則的な考え方によれば、デット・アサンプションは金融負債の消滅の認識要件を充たさない。その理由を説明しなさい。","a":"デット・アサンプションは社債発行会社と社債権者の法的関係に影響を与えるものではなく、社債発行会社は第一次債務者の地位から免責されたわけではないため、金融負債の消滅の認識要件を充たさない。"},
 {"id":"9-8","rank":"C","q":"「金融商品に関する会計基準」では、金融資産については時価評価を行うことが基本的な考え方とされている。その理由を説明しなさい。","a":"金融資産は、一般的には市場が存在すること等により客観的な価額として時価を把握でき、当該価額により換金・決済等を行うことが可能である。そこで、客観的な時価の測定可能性が認められないものを除き、時価による自由な換金・決済等が可能な金融資産については、投資情報としても、企業の財務認識としても、さらに国際的調和化の観点からも、これを時価評価し適切に財務諸表に反映することが必要と考えられるため。"},
 {"id":"9-9","rank":"C","q":"「金融商品に関する会計基準」では、金融負債については時価評価を行わないことが基本的な考え方とされている。その理由を説明しなさい。","a":"金融負債は、借入金のように一般的には市場がないか、社債のように市場があっても、自己の発行した社債を時価により自由に清算するには事業遂行上等の制約があると考えられるため。"},
 {"id":"9-10","rank":"C","q":"金銭債権を時価評価しない理由を説明しなさい。","a":"一般的に金銭債権については活発な市場がない場合が多い。このうち受取手形や売掛金は通常短期的に決済されることが予定されており、帳簿価額が時価に近似していると考えられ、貸付金等の債権は時価を容易に入手できない場合や売却を意図していない場合が少なくないと考えられるため、原則として時価評価は行わない。"},
 {"id":"9-11","rank":"B","q":"債権を債権金額より低い価額または高い価額で取得した場合に償却原価法を適用する理由を説明しなさい。","a":"債権の取得においては債権金額と取得価額とが異なる場合があり、この差異が金利の調整であると認められる場合には、金利相当額を適切に各期の財務諸表に反映させることが必要であるため。"},
 {"id":"9-12","rank":"B","q":"売買目的有価証券を時価評価する理由を説明しなさい。","a":"保有目的から、投資家にとっての有用な情報は有価証券の期末時点での時価に求められると考えられるため。"},
 {"id":"9-13","rank":"A","q":"売買目的有価証券の評価差額を当期の損益とする理由を説明しなさい。","a":"売買目的有価証券は、売却することについて事業遂行上等の制約がなく、時価の変動にあたる評価差額が企業にとっての財務活動の成果と考えられるため。"},
 {"id":"9-14","rank":"B","q":"①満期の定めのない永久債と②それまでその他有価証券に分類していた債券を満期保有目的の債券に分類することはできるか、それぞれ説明しなさい。","a":"①できない。満期保有目的の債券に分類するためには、あらかじめ償還日が定められており、かつ額面金額による償還が予定されていることを要するため、満期の定めのない永久債はその属性から分類できない。\n②できない。満期まで所有する意図は取得時点において判断すべきものであり、いったん他の保有目的で取得した債券について、その後保有目的を変更して満期保有目的の債券に振り替えることは認められない。"},
 {"id":"9-15","rank":"A","q":"満期保有目的の債券を時価評価しない理由を説明しなさい。","a":"満期保有目的の債券は、時価が算定できるものであっても、満期まで保有することによる約定利息及び元本の受取りを目的としており、満期までの間の金利変動による価格変動のリスクを認める必要がないため。"},
 {"id":"9-16","rank":"B","q":"子会社株式及び関連会社株式を時価評価しない理由を説明しなさい。","a":"子会社株式は事業投資と同じく時価の変動を財務活動の成果とは捉えない。関連会社株式は他企業への影響力の行使を目的として保有する株式であり、子会社株式の場合と同じく事実上の事業投資と同様の会計処理を行うことが適当であるため、いずれも時価評価は行わない。"},
 {"id":"9-17","rank":"B","q":"その他有価証券を時価評価する理由を説明しなさい。","a":"その他有価証券は、業務上の関係を有する企業の株式等から市場動向によっては売却を想定している有価証券まで多様な性格を有しており、一義的にその属性を定めることは困難と考えられることから、評価基準に関する基本的考え方に基づいて時価評価を行う。"},
 {"id":"9-18","rank":"A","q":"その他有価証券の評価差額を当期の損益としない理由を説明しなさい。","a":"その他有価証券は、事業遂行上等の必要性から直ちに売買・換金を行うことには制約を伴う要素もあり、評価差額を直ちに当期の損益として処理することは適切ではないため。"},
 {"id":"9-19","rank":"B","q":"その他有価証券の評価差額の会計処理方法として、部分純資産直入法が認められる理由を説明しなさい。","a":"保守主義の観点から、これまで低価法に基づく銘柄別の評価差額の損益計算書への計上が認められてきたことを考慮したため。"},
 {"id":"9-20","rank":"B","q":"A社社債及びB社社債をいずれも満期保有目的の債券に分類していたが、資金繰りの関係からA社社債のすべてを償還期限前に売却した。引き続き保有するB社社債について必要となる会計処理を説明しなさい（トレーディングは行っていない）。","a":"満期保有目的の債券に分類された債券について、その一部を売買目的有価証券またはその他有価証券に振替えたり、償還期限前に売却を行った場合は、満期保有目的の債券に分類された残りのすべての債券について、保有目的の変更があったものとして売買目的有価証券またはその他有価証券に振替えなければならない。トレーディングを行っていない当社では、B社社債を償却原価をもってその他有価証券に振替えなければならず、振替後は時価をもって貸借対照表価額とする。"},
 {"id":"9-21","rank":"B","q":"償却原価法を適用してきた債券について減損処理を行った場合、その後の会計期間において償却原価法は適用されるか、理由とともに説明しなさい。","a":"適用されない。減損処理を行った債券については、取得差額はもはや金利調整差額とは考えられないため。"},
 {"id":"9-22","rank":"B","q":"運用を目的とする金銭の信託の貸借対照表価額には、信託財産を構成する金融資産及び金融負債のうち時価評価が適切であるものについて、その時価を反映することが必要とされる。その理由を説明しなさい。","a":"運用を目的とする金銭の信託は、企業が当該金銭の信託に係る信託財産を構成する金融資産及び金融負債を運用目的で間接的に保有しているものと考えられ、加えて、信託契約の満了時に信託財産またはそれを時価により換金した現金により支払を受ける場合、投資家及び企業双方にとって意義を有するのは信託財産の時価であると考えられるため。"},
 {"id":"9-23","rank":"B","q":"運用を目的とする金銭の信託の評価差額を当期の損益とする理由を説明しなさい。","a":"運用を目的とする金銭の信託に係る信託財産については、委託者の事業遂行上等の観点からの売買・換金の制約がないため。"},
 {"id":"9-24","rank":"C","q":"デリバティブ取引により生じる正味の債権及び債務を時価評価する理由を説明しなさい。","a":"デリバティブ取引は、取引により生じる正味の債権または債務の時価の変動により保有者が利益を得または損失を被るものであり、投資家及び企業双方にとって意義を有する価値は当該正味の債権または債務の時価に求められると考えられるため。"},
 {"id":"9-25","rank":"C","q":"デリバティブ取引により生じる正味の債権及び債務の評価差額を当期の損益とする理由を説明しなさい。","a":"デリバティブ取引により生じる正味の債権及び債務の時価の変動は、企業にとって財務活動の成果であると考えられるため。"},
 {"id":"9-26","rank":"B","q":"貸倒懸念債権の貸倒見積高の算定方法であるキャッシュ・フロー見積法において、当初の約定利子率を用いる理由を説明しなさい。","a":"貸倒見積高の算定が、債権を時価で評価し直すために行われるのではなく、債権の取得価額のうち当初の見積キャッシュ・フローからの減損額を算定することを目的として行われるため（見積時点の改定約定利子率や市場利子率を用いない）。"},
 {"id":"9-27","rank":"A","q":"ヘッジ会計の必要性について、デリバティブ取引をヘッジ手段として用いるヘッジ取引にヘッジ会計を適用しない場合を例にとって説明しなさい。","a":"ヘッジ手段であるデリバティブ取引は原則的な処理方法によれば時価評価され損益が認識されるが、ヘッジ対象の資産に係る相場変動等が損益に反映されない場合には、両者の損益が期間的に合理的に対応しなくなり、ヘッジ対象の相場変動等による損失可能性がヘッジ手段によってカバーされているという経済的実態が財務諸表に反映されない。このため、ヘッジ対象及びヘッジ手段に係る損益を同一の会計期間に認識し、ヘッジの効果を財務諸表に反映させるヘッジ会計が必要となる。"},
 {"id":"9-28","rank":"B","q":"満期保有目的の債券については、原則として金利変動リスクに関するヘッジ対象とすることは認められない。その理由を説明しなさい。","a":"満期保有目的の債券は、満期まで保有することによる約定利息及び元本の受取りを目的としており、満期までの間の金利変動による価格変動のリスクを認める必要がないため、時価評価が求められない。この取扱いの趣旨に鑑みると、満期保有目的の債券に対して金利変動による価格変動リスクをヘッジする取引に会計上特別なヘッジ会計を認めることは論理的に整合しない。したがって原則として、金利変動リスクに関するヘッジ対象とすることは認められない。"},
 {"id":"9-29","rank":"A","q":"ヘッジ会計の要件を充たすヘッジ取引に適用される２つの会計処理方法について説明しなさい。","a":"原則は繰延ヘッジ：時価評価されているヘッジ手段に係る損益または評価差額を、ヘッジ対象に係る損益が認識されるまで純資産の部において繰延べる方法。ヘッジ手段の損益認識時点をヘッジ対象の損益認識時点にあわせる。\n例外的に時価ヘッジ：ヘッジ対象である資産または負債に係る相場変動等を損益に反映させることにより、その損益とヘッジ手段に係る損益とを同一の会計期間に認識する方法。ヘッジ対象の損益認識時点をヘッジ手段の損益認識時点にあわせる。"},
 {"id":"9-30","rank":"B","q":"金利スワップの特例処理の考え方及びその会計処理を説明しなさい。","a":"金利スワップと金利変換の対象となる資産または負債を一体として、実質的に変換された条件による債権または債務と考える。そのため、金利スワップを時価評価せず、当該金利スワップに係る金銭の受払の純額等を当該資産または負債に係る利息に加減して処理する。"},
 {"id":"9-31","rank":"B","q":"転換社債型新株予約権付社債について一括法が認められる理由を説明しなさい。","a":"転換社債型新株予約権付社債については、社債と新株予約権がそれぞれ単独で存在し得ないことから、それぞれの部分を区分して処理する必要性は乏しいため。"},
 {"id":"9-32","rank":"B","q":"転換社債型新株予約権付社債以外の新株予約権付社債について区分法が採用される理由を説明しなさい。","a":"転換社債型新株予約権付社債以外の新株予約権付社債は、払込資本を増加させる可能性のある部分とそれ以外の部分が同時に各々存在し得ることから、その取引の実態を適切に表示するため、それぞれの部分を区分して処理することが必要であるため。"},
 {"id":"9-33","rank":"C","q":"払込資本を増加させる可能性のある部分を含まない複合金融商品については、原則として個々の金融資産・金融負債に区分せず一体として処理する。その理由を説明しなさい。","a":"その他の複合金融商品を構成する複数種類の金融資産または金融負債は、それぞれ独立して存在し得るが、複合金融商品からもたらされるキャッシュ・フローは正味で発生する。このため、資金の運用・調達の実態を財務諸表に適切に反映させるという観点から、原則として区分せず一体として処理する。"}
]},
{ch:10, title:"固定資産の減損", items:[
 {"id":"10-1","rank":"B","q":"事業用の固定資産は取得原価から減価償却累計額等を控除した金額で評価され、損益計算においてはそのような資産評価に基づく実現利益が計上される。その理由を説明しなさい。","a":"事業用の固定資産については、通常、市場平均を超える成果を期待して事業に使われているため、市場の平均的な期待で決まる時価が変動しても、企業にとっての投資の価値がそれに応じて変動するわけではない。また、投資の価値自体も、投資の成果であるキャッシュ・フローが得られるまでは実現したものではないため。"},
 {"id":"10-2","rank":"A","q":"固定資産の減損とは何か、その本質を説明しなさい。","a":"固定資産の減損とは、資産の収益性の低下により投資額の回収が見込めなくなった状態であり、減損処理とは、そのような場合に一定の条件の下で回収可能性を反映させるように帳簿価額を減額する会計処理をいう。その本質は、通常の販売目的で保有する棚卸資産の簿価切下げや固定資産の物理的な滅失による臨時損失などと同様に、事業用資産の過大な帳簿価額を減額し、将来に損失を繰延べないために行われる会計処理である。"},
 {"id":"10-3","rank":"A","q":"固定資産の減損処理は金融商品に適用されている時価評価と比較してどのような特徴を有しているか、説明しなさい。","a":"固定資産の減損処理は、資産価値の変動によって利益を測定することや、決算日における資産価値を貸借対照表に表示することを目的とするものではなく、取得原価基準の下で行われる帳簿価額の臨時的な減額であるという特徴を有している。"},
 {"id":"10-4","rank":"B","q":"固定資産の減損処理に関して、「期末の帳簿価額を将来の回収可能性に照らして見直すだけでは、収益性の低下による減損損失を正しく認識することはできない」との指摘の意味を説明しなさい。","a":"減損処理は、本来、投資期間全体を通じた投資額の回収可能性を評価し、投資額の回収が見込めなくなった時点で、将来に損失を繰り延べないために帳簿価額を減額する会計処理と考えられる。そのため、期末の帳簿価額を将来の回収可能性に照らして見直すだけでは、帳簿価額の回収が見込めない場合であっても、過年度の回収額を考慮すれば投資期間全体を通じて投資額の回収が見込める場合や、過年度の減価償却などを修正すれば修正後の帳簿価額の回収が見込める場合にも減損損失が認識されてしまい、収益性の低下による減損損失を正しく認識することはできない。"},
 {"id":"10-5","rank":"B","q":"減損処理と臨時償却の共通点と相違点を説明しなさい。","a":"共通点：いずれも取得原価基準の下で行われる帳簿価額の臨時的な減額であり、過大な帳簿価額を減額し、将来に損失を繰延べないために行われる会計処理である点。\n相違点：減損処理は資産の収益性の低下を帳簿価額に反映することを目的とし、計上される減損損失は臨時損失項目である。臨時償却は資産に生じた機能的減価に起因した耐用年数の短縮等に基づいて過年度の減価償却を修正することを目的とし、計上される臨時償却費は前期損益修正項目である。"},
 {"id":"10-6","rank":"B","q":"資産のグルーピングを、他の資産または資産グループのキャッシュ・フローから概ね独立したキャッシュ・フローを生み出す最小の単位で行う理由を説明しなさい。","a":"グルーピングの単位をより大きなものとした場合、減損が生じていない資産の将来キャッシュ・フローと通算されることによって減損損失が認識されない可能性があり、また減損損失の計上額も小さくなってしまうため。"},
 {"id":"10-7","rank":"B","q":"すべての資産または資産グループではなく、減損の兆候がある資産または資産グループについて減損損失を認識するかどうかの判定を行うこととした理由を説明しなさい。","a":"すべての資産または資産グループについて判定を行うことは、実務上、過大な負担となるおそれがあることを考慮したため。"},
 {"id":"10-8","rank":"A","q":"減損損失を認識するかどうかの判定にあたって、割引前将来キャッシュ・フローの総額と帳簿価額を比較する理由を説明しなさい。","a":"減損損失の測定は将来キャッシュ・フローの見積りに大きく依存するが、成果の不確定な事業用資産の減損は測定が主観的にならざるを得ず、減損の存在が相当程度に確実な場合に限って減損損失を認識することが適当であると考えられるため。"},
 {"id":"10-9","rank":"B","q":"制度会計上、減損損失を認識するかどうかを判定するために見積られる割引前将来キャッシュ・フローの見積期間が制限されている理由を説明しなさい。","a":"①土地のような非償却性資産は使用期間が無限になりうることから、その見積期間を制限する必要があるため。②一般的に、長期間にわたる将来キャッシュ・フローの見積りは不確実性が高くなるため。"},
 {"id":"10-10","rank":"A","q":"減損損失の測定にあたり、正味売却価額と使用価値のいずれか高い方を回収可能価額とする理由を説明しなさい。","a":"企業は資産または資産グループに対する投資を売却と使用のいずれかの手段によって回収するが、いずれか有利な方を選択すると考えられるため、売却による回収額（正味売却価額）と使用による回収額（使用価値）のいずれか高い方の金額が回収可能価額とされる。"},
 {"id":"10-11","rank":"B","q":"回収可能価額の算定にあたっては、必ずしも現在時点の正味売却価額を算定する必要はないとされている。その理由を説明しなさい。","a":"正味売却価額が使用価値より高い場合、企業は資産または資産グループを既に売却していると考えられることから、通常、使用価値は正味売却価額より高いと考えられるため。"},
 {"id":"10-12","rank":"B","q":"減損損失を認識すべきと判定された資産または資産グループについて、帳簿価額を時価まで減額すべきとする見解がある。この考え方を投資の継続性の観点から説明しなさい。","a":"この考え方は、資産の帳簿価額を回収できないときに減損した資産を売却せずに使用するという意思決定を、その資産への再投資という新たな経済的意思決定に相当するものとみる。したがって、投資の清算及び再投資が行われたものとみて、公正価値たる時価をもって新しい取得原価とすべきであると説明される。"},
 {"id":"10-13","rank":"B","q":"将来キャッシュ・フローを、企業に固有の事情を反映した合理的で説明可能な仮定及び予測に基づいて見積る理由を説明しなさい。","a":"将来キャッシュ・フローは、客観的な資産または資産グループの時価を算定するためではなく、企業にとって資産または資産グループの帳簿価額が回収可能かどうかを判定するため、あるいは企業にとって資産または資産グループがどれだけの経済的な価値を有しているかを算定するために見積るものであるため。"},
 {"id":"10-14","rank":"C","q":"将来キャッシュ・フローの見積りに際して、資産または資産グループの現在の使用状況及び合理的な使用計画等を考慮する理由を説明しなさい。","a":"将来キャッシュ・フローは、現時点における資産または資産グループの回収可能性を反映すべきであるため。"},
 {"id":"10-15","rank":"C","q":"将来キャッシュ・フローには、利息の支払額ならびに法人税等の支払額及び還付額を含めない理由を説明しなさい。","a":"利息の支払額ならびに法人税等の支払額及び還付額は、通常、固定資産の使用または処分から直接的に生ずる項目ではないため。"},
 {"id":"10-16","rank":"B","q":"資産除去債務が負債に計上されている場合には、将来キャッシュ・フローの見積りに除去費用部分を含めない理由を説明しなさい。","a":"除去費用部分の影響を二重に認識しないようにするため。"},
 {"id":"10-17","rank":"C","q":"減損損失を認識するかどうかを判定する際に用いる割引前将来キャッシュ・フローの算定において、将来キャッシュ・フローがその見積値から乖離するリスクを反映させるかどうか、理由とともに説明しなさい。","a":"反映させるか否かで異なる結果が導かれることになるため、将来キャッシュ・フローが見積値から乖離するリスクを反映させない方法で統一される。"},
 {"id":"10-18","rank":"C","q":"のれんを認識した取引において取得された事業の単位が複数である場合に、のれんの帳簿価額を合理的な基準に基づき分割する理由を説明しなさい。","a":"のれんが認識される取引において、取得の対価が概ね独立して決定され、取得後も内部管理上独立した業績評価が行われる複数の事業が取得される場合には、複数の事業に係るのれんを一括して減損処理することは適当ではないため。"},
 {"id":"10-19","rank":"C","q":"共用資産及びのれんの取扱いについて、より大きな単位でグルーピングを行う方法が原則とされている理由を、共用資産及びのれんのそれぞれについて説明しなさい。","a":"共用資産：帳簿価額を合理的な基準で各資産または資産グループに配分することが困難であると考えられるため。\nのれん：のれんはそれ自体では独立したキャッシュ・フローを生まないため。"},
 {"id":"10-20","rank":"B","q":"より大きな単位でグルーピングを行う方法を採用した場合、のれんを加えることによる減損損失の増加額を原則としてのれんに配分する理由を説明しなさい。","a":"減損損失を認識することとなった場合には、当該判定単位の超過収益力がもはや失われていると考えられるため。"},
 {"id":"10-21","rank":"B","q":"制度会計上、減損処理を行った資産についても、減損損失控除後の帳簿価額に基づき減価償却を行う理由を説明しなさい。","a":"減損処理は資産の取得原価を回収可能な部分と回収不能な部分に配分する手続として、取得原価基準の下で行われる帳簿価額の臨時的な減額である以上、減損処理後も原価配分手続を継続する必要があるため。"},
 {"id":"10-22","rank":"A","q":"制度会計上、減損損失の戻入は行われない。その理由を２つ挙げなさい。","a":"①制度会計は減損損失の認識の判定について蓋然性基準によっており、減損の存在が相当程度に確実な場合に限って認識・測定されるものとしているため。②減損損失の戻入れを行う場合、一度計上した資産に関する回収可能価額の見積りの変更を常に把握しなければならず、事務的負担を増大させるおそれがあるため。"}
]},
{ch:11, title:"棚卸資産", items:[
 {"id":"11-1","rank":"D","q":"事務用消耗品が棚卸資産の範囲に含まれる理由を説明しなさい。","a":"事務用消耗品等の販売活動及び一般管理活動において短期間に消費されるべき財貨は、売却されないことから収益との個別的対応計算が行われるものではないが、短期的に消費される点や実務上の便宜が考慮され、また一般に重要性が乏しいと考えられるため、棚卸資産の範囲に含まれる。"},
 {"id":"11-2","rank":"A","q":"仕入割引の会計処理について、①営業外収益とする方法と②送状価額から控除する方法の論拠及び背後の考え方を説明しなさい。","a":"①仕入割引は代金の早期決済という財務活動の成果であり、利息相当分の減免額であるから財務収益としての性格を有することを論拠とする（仕入取引と代金決済取引を独立した別個の取引とみる考え方）。\n②仕入割引は仕入代金の一部免除という点で値引・割戻と同じであり、送状価額から控除することで最終的な現金支払額をもって取得原価を計上できることを論拠とする（仕入取引と代金決済取引を連続した１つの取引とみる考え方）。"},
 {"id":"11-3","rank":"D","q":"個別法の短所を説明しなさい。","a":"①同一種類の棚卸資産を扱っている場合、払出品の恣意的な選択による利益操作が可能となる。②棚卸資産を大量に保有する場合に個別法を用いることは、事務的に大変煩雑である。"},
 {"id":"11-4","rank":"C","q":"先入先出法の長所及び短所をそれぞれ説明しなさい。","a":"長所：①一般的に、原価の流れの仮定が棚卸資産の実際の流れを忠実に表現しているといえる。②棚卸資産の貸借対照表価額が最近の価格水準を反映した金額となる（B/S面での長所）。\n短所：収益と費用が同一の価格水準で対応しないため、棚卸資産の購入から販売までの保有期間における市況の変動により生じる保有損益を期間損益から排除できない（P/L面での短所）。"},
 {"id":"11-5","rank":"D","q":"売価還元法の長所及び短所をそれぞれ説明しなさい。","a":"長所：品種ごとの単価を個別に把握する必要がなく事務的に簡便な方法であり、取扱品種の極めて多い業種における棚卸資産の評価に適している。\n短所：①棚卸資産のグルーピングや原価率の決定に恣意性が介入する。②計算の正確性に欠ける。"},
 {"id":"11-6","rank":"C","q":"「棚卸資産の評価に関する会計基準」では、最終仕入原価法は棚卸資産の評価方法として定められていない。その理由を説明しなさい。","a":"最終仕入原価法によれば、期末棚卸資産の一部だけが実際取得原価で評価されるものの、その他の部分は時価に近い価額で評価されることとなる場合が多いと考えられ、無条件に取得原価基準に属する方法として適用を認めることは適当ではないため。"},
 {"id":"11-7","rank":"B","q":"後入先出法の長所及び短所をそれぞれ説明しなさい。","a":"長所：収益と費用が同一の価格水準で対応するため、保有期間における市況変動により生じる保有損益を期間損益から排除できる。\n短所：①原価の流れの仮定が実際の流れを忠実に表現しているとはいえない。②貸借対照表価額が最近の価格水準と大幅に乖離する。"},
 {"id":"11-8","rank":"B","q":"「棚卸資産の評価に関する会計基準」において後入先出法が認められなくなった理由を、損益計算の側面から説明しなさい。","a":"後入先出法の長所（保有利益の排除）は、特定の時点で計上されることになる利益を単に繰延べているに過ぎない。棚卸資産の期末数量が期首数量を下回り食い込みが生じた場合には、累積した保有利益がまとめて計上される問題があり、また企業が購入量を調整することで保有損益を意図的に当期損益に計上できるという指摘もある。以上より適切な期間損益の計算に資するとは必ずしもいえないため、認められなくなった。"},
 {"id":"11-9","rank":"A","q":"「棚卸資産の評価に関する会計基準」公表前は原価法が原則的な評価基準とされ低価法が例外的とされていた。①原価法が原則とされた理由及び②低価法の容認理由を説明しなさい。","a":"①適正な期間損益計算を行うためには棚卸資産の原価を当期の実現収益に対応させることが必要であり、当期の損益が期末時価の変動等によって歪められてはならないという考えから原価法が原則的な方法とされていた。\n②低価法は期間損益計算の見地からすると合理性をもたないが、保守主義に基づく評価基準であり、実務慣行として定着していたため。"},
 {"id":"11-10","rank":"A","q":"通常の販売目的で保有する棚卸資産の収益性が低下した場合における簿価切下げの考え方を説明しなさい。","a":"収益性が低下した場合における簿価切下げは、取得原価基準の下で回収可能性を反映させるように、過大な帳簿価額を減額し、将来に損失を繰延べないために行われる会計処理である。"},
 {"id":"11-11","rank":"A","q":"通常の販売目的で保有する棚卸資産について、正味売却価額が取得原価より下落している場合の①取得原価を貸借対照表価額とする見解と②正味売却価額を貸借対照表価額とする見解は、取得原価基準の本質をどうみているか述べなさい。","a":"①取得原価基準の本質を、名目上の取得原価で据え置くこととみている。\n②取得原価基準の本質を、回収可能な原価だけを繰り越すこととみている。"},
 {"id":"11-12","rank":"A","q":"通常の販売目的で保有する棚卸資産について、収益性の低下の判断基準が正味売却価額と帳簿価額との比較とされる理由を説明しなさい。","a":"棚卸資産は、固定資産のように使用を通じて、また債権のように契約を通じて投下資金の回収を図ることは想定されておらず、通常、販売によってのみ資金の回収を図る。評価時点における資金回収額を示す棚卸資産の正味売却価額が帳簿価額を下回っているときには、収益性が低下しているとみることができるため。"},
 {"id":"11-13","rank":"B","q":"制度会計上、品質低下・陳腐化に起因する簿価切下げとそれ以外に起因する簿価切下げで取扱いに差異を設けていない理由を説明しなさい。","a":"発生原因は相違するものの、正味売却価額が下落することにより収益性が低下しているという点からみれば、会計処理上、それぞれの区分に相違を設ける意義は乏しいと考えられるため。また経済的な劣化による収益性の低下と市場の需給変化に基づく下落を、実務上明確に区分できないため。"},
 {"id":"11-14","rank":"B","q":"制度会計上「期末における正味売却価額」に「将来販売時点の正味売却価額」と「期末時点の正味売却価額」のいずれも含まれる理由を説明しなさい。","a":"通常の販売目的で保有する棚卸資産の最終的な投資の成果の確定は将来の販売時点であることから、本来は将来販売時点の売価に基づく正味売却価額によることが望ましい。しかし入手や合理的な見積りが困難な場合が多いため、合理的に算定された価額として期末前後の販売実績に基づく価額も用いられる。"},
 {"id":"11-15","rank":"B","q":"前期に計上した簿価切下額の戻入れに関し、①洗替え法と②切放し法それぞれの論拠を説明しなさい。","a":"①固定資産の減損処理は蓋然性を要件とするが、棚卸資産は正味売却価額が帳簿価額を下回るかどうかで判断し蓋然性を要件としない。よって戻入れを行う洗替え法の方が正味売却価額の回復という事実を反映し整合的である。\n②収益性の低下に基づき過大な帳簿価額を切下げ将来に損失を繰延べないために行われる会計処理において、いったん費用処理した金額を戻入れることは、固定資産の減損処理と同様に適切ではない。"},
 {"id":"11-16","rank":"C","q":"トレーディング目的で保有する棚卸資産を時価評価する理由を説明しなさい。","a":"トレーディング目的で保有する棚卸資産については、投資家にとっての有用な情報は、棚卸資産の期末時点の市場価格に求められると考えられるため。"},
 {"id":"11-17","rank":"C","q":"トレーディング目的で保有する棚卸資産の評価差額を当期の損益とする理由を説明しなさい。","a":"トレーディング目的で保有する棚卸資産は、売買・換金に対して事業遂行上等の制約がなく、市場価格の変動にあたる評価差額が企業にとっての投資活動の成果と考えられるため。"}
]},
{ch:12, title:"資産除去債務", items:[
 {"id":"12-1","rank":"C","q":"有形固定資産の使用期間中に実施する環境修復や修繕が資産除去債務の対象とはならない理由を説明しなさい。","a":"修繕引当金は、収益との対応を図るために当期の負担に属する金額を計上するための貸方項目であり、債務ではない引当金と整理されている場合が多いことや、操業停止や対象設備の廃棄をした場合には不要となるという点で資産除去債務と異なる面があることから、資産除去債務の対象とはならない。"},
 {"id":"12-2","rank":"A","q":"制度会計上、資産除去債務の会計処理として引当金処理ではなく資産負債の両建処理が採用されている理由を２つ挙げなさい。","a":"①引当金処理の場合、有形固定資産の除去に必要な金額が貸借対照表に計上されず、資産除去債務の負債計上が不十分になるが、資産負債の両建処理の場合には除去サービスの債務の全額が負債として適切に反映される。②資産負債の両建処理は取得原価に含められた除去費用が減価償却を通じて各期に費用配分されるため、引当金処理を包摂する。"},
 {"id":"12-3","rank":"B","q":"資産除去債務の負債計上に否定的な見解について、概念フレームワークの認識規準にしたがって説明しなさい。","a":"概念フレームワークでは構成要素の認識にあたり基礎となる契約の原則として少なくとも一方の履行を求めている。有形固定資産の除去などの将来履行される用役について、その支払いも将来において履行される場合、当該債務は通常、双務未履行であるため、資産除去債務を負債として認識することは合理性に欠ける。"},
 {"id":"12-4","rank":"B","q":"資産除去債務の測定値として自己の支出見積りを用いる理由を２つ挙げなさい。","a":"①自己の支出見積りと市場の評価を反映した金額との相違は、現実には市場の想定支出額が客観的に明らかでないことが多いため、実務的には大きな相違とならないことが多い。②仮に市場想定額より自ら処理する場合の支出見積額が低い場合でも、企業の投資上、資産の除去は通常、有形固定資産の投資プロジェクトの一環として行われるため、耐用年数にわたりその効率性を反映させていく方が妥当である。"},
 {"id":"12-5","rank":"A","q":"資産除去債務の算定に際し無リスクの割引率を用いる理由を３つ挙げなさい。","a":"①退職給付債務の算定においても無リスクの割引率が使用されている。②同一の内容の債務について信用リスクの高い企業の方が高い割引率を用いることで負債計上額が少なくなるという結果は、財政状態を適切に示さないと考えられる。③資産除去債務の性格上、自らの不履行の可能性を前提とする会計処理は適当ではない。"},
 {"id":"12-6","rank":"C","q":"資産除去債務に対応する除去費用を資産計上する方法のうち、関連する有形固定資産とは区別して把握し別の資産として計上する方法の論拠を２つ挙げなさい。","a":"①資産除去債務に対応する除去費用の資産計上額が、有形固定資産の稼動等にとって必要な除去サービスの享受等に関する何らかの権利に相当する。②将来提供される除去サービスの前払い（長期前払費用）としての性格を有する。"},
 {"id":"12-7","rank":"B","q":"制度会計上、資産除去債務に対応する除去費用を、関連する有形固定資産とは区別して把握し別の資産として計上する方法が採用されなかった理由を説明しなさい。","a":"資産除去債務に対応する除去費用は、法律上の権利ではなく財産的価値もないこと、また独立して収益獲得に貢献するものではないことから、別の資産として計上する方法は適切ではないと考えられるため。"},
 {"id":"12-8","rank":"B","q":"資産除去債務に対応する除去費用の資産計上について、関連する有形固定資産の帳簿価額を増加させる方法が採用されている理由を説明しなさい。","a":"資産除去債務に対応する除去費用は、有形固定資産の稼動にとって不可欠なものであり、有形固定資産の取得に関する付随費用と同様に処理すべきであると考えられるため。"},
 {"id":"12-9","rank":"C","q":"資産除去債務が使用の都度発生する場合、除去費用をいったん資産に計上し、当該計上時期と同一の期間に資産計上額と同一の金額を費用処理する方法が認められている理由を説明しなさい。","a":"除去費用を各期においてそれぞれ資産計上し、関連する有形固定資産の残存耐用年数にわたり各期に費用配分する原則的な方法によると、除去費用に係る費用配分が有形固定資産の使用期間の後半に著しく偏ることとなり合理性を欠く場合があるため。"},
 {"id":"12-10","rank":"C","q":"賃借契約において敷金を支出している場合、『資産除去債務に関する会計基準』の原則的な考え方に従い資産除去債務を計上すると生ずる問題を指摘しなさい。","a":"賃借建物等に関連する資産除去債務とこれに対応する除去費用を負債及び資産として両建処理すると、敷金と資産除去債務に対応する除去費用が二重に資産計上されるという問題が生ずる。"},
 {"id":"12-11","rank":"B","q":"時の経過による資産除去債務の調整額の割引率を、負債計上時の割引率に固定する理由を２つ挙げなさい。","a":"①割引率を毎期見直すとした場合、他の負債の取扱いとの整合性に問題がある。②負債計上時の割引率に固定する方法は、時の経過によって一定の利息相当額を配分するものであり、関連する有形固定資産について減価償却という費用配分が行われることとも整合的である。"},
 {"id":"12-12","rank":"A","q":"時の経過による資産除去債務の調整額について、①営業外費用とすべきとする見解と②有形固定資産の減価償却費と同じ区分に含めるべきとする見解の論拠を説明しなさい。","a":"①調整額は資産除去債務の履行に関する資金調達費用とみることができるため、財務費用として営業外費用に含めることが適切。\n②調整額は実際の資金調達活動による費用ではない。また同種の計算により費用を認識している退職給付会計の利息費用が退職給付費用の一部として営業費用に計上されている。"},
 {"id":"12-13","rank":"A","q":"資産除去債務の履行時に生じる決済差額について、除去費用に係る費用配分額と同じ区分に含めて計上する理由を説明しなさい。","a":"除去費用の総額が固定資産の利用期間にわたって配分され、将来キャッシュ・フローに重要な見積りの変更が生じた場合には資産除去債務の計上額が見直されることを前提とすれば、履行時に認識される差額についても、固定資産の取得原価に含められ減価償却を通じて費用処理された除去費用と異なる性格を有するものではないため。"}
]},
{ch:13, title:"リース", items:[
 {"id":"13-1","rank":"A","q":"「リース取引に関する会計基準」ではファイナンス・リース取引について通常の売買取引に係る方法に準じて会計処理を行う。この背景にある考え方を説明しなさい。","a":"リース取引の法的形式は賃貸借取引であるが、解約不能とフルペイアウトの要件を満たすファイナンス・リース取引は、資産を割賦売買する場合と同様の経済的実態を有する。したがって、実質優先思考に基づき、その経済的実態を財務諸表に的確に反映するために、賃貸借取引ではなく売買取引として会計処理を行う。"},
 {"id":"13-2","rank":"A","q":"「リース取引に関する会計基準」の２区分の会計処理モデルと「リースに関する会計基準」の単一の会計処理モデルの考え方を対比しつつ、借手の会計処理を説明しなさい。","a":"２区分の会計処理モデルは、資産の所有に伴うリスクと経済的便益の実質的な移転の観点から、リースをファイナンス・リースとオペレーティング・リースに分類し異なる会計処理を適用する。単一の会計処理モデルは、使用権の移転の観点から、あらゆるリースは対価と交換に使用権を移転する取引として同じ経済的実態を有するとみて、すべてのリースについて使用権資産及びリース負債を計上する。"},
 {"id":"13-3","rank":"A","q":"２区分の会計処理モデルの問題点を指摘しなさい。","a":"①ファイナンス・リースとオペレーティング・リースの分類を数値基準に基づき行うため、意図的にファイナンス・リースの要件を満たさないよう仕組むことで資産・負債の計上を回避する機会を与え、経済的実態が財務諸表に的確に反映されなくなる。②重要なオペレーティング・リースについて通常の賃貸借取引に準じて処理すると、借手において重要な負債が財務諸表本表に計上されない。"},
 {"id":"13-4","rank":"A","q":"単一の会計処理モデルの長所を挙げなさい。","a":"①あらゆるリースから生じる資産と負債が貸借対照表上に反映されるため、比較可能性の向上につながり、取引を仕組む機会を減少させることが可能となる。②使用権資産及びリース負債は概念フレームワークにおける資産及び負債の定義と整合する。"},
 {"id":"13-5","rank":"C","q":"借手の変動リース料のうち、①指数またはレートに応じて決まるリース料はリース負債の計上額に含められるが、②原資産から得られる借手の業績に連動するリース料及び③原資産の使用に連動するリース料は含められない。それぞれの理由を説明しなさい。","a":"①のリース料は借手の将来の活動に左右されないものであり、金額に不確実性があっても借手はリース料を支払う義務を回避することができず、負債の定義を満たすため、リース負債の計上額に含められる。\n②及び③のリース料は、借手の将来の活動を通じてリース料を支払う義務を回避することができ、負債の定義を満たさないとの考え方もあるため、リース負債の計上額に含められない。"},
 {"id":"13-6","rank":"B","q":"所有権移転外ファイナンス・リースの借手のリース資産・リース債務の計上額が、リース料総額の割引現在価値と貸手の購入価額（借手の見積現金購入価額）を基礎とする理由をそれぞれ説明しなさい。","a":"リース債務の評価の側面を考えると、リース料総額の割引現在価値が、取得よりもリースを選択した借手の行動を反映する。リース資産の評価の側面を考えると、リース物件の価値である貸手の購入価額による方法が考えられる。"},
 {"id":"13-7","rank":"A","q":"リースの借手において計上する資産及び負債の測定にあたり、「リース取引に関する会計基準」では貸手の購入価額（または借手の見積現金購入価額）を考慮するが、「リースに関する会計基準」では考慮しない。それぞれの理由を説明しなさい。","a":"「リース取引に関する会計基準」：リスクと経済的便益の実質的な移転の観点からファイナンス・リースとオペレーティング・リースに分類し、資産の割賦売買と同じ経済的実態を有するファイナンス・リースのみをオンバランスの対象とする。取得よりもリースを選択した借手の行動をリース債務の評価に反映させるためリース料総額の割引現在価値を基礎とするが、資産の取得との整合性を図り、リース物件の価値をリース資産の評価に反映させるため、貸手の購入価額等も同時に考慮する。\n「リースに関する会計基準」：リースを原資産を使用する権利を対価と交換に移転する契約と定義し、使用する権利とリース料を支払う義務に着目してすべてのリースをオンバランスの対象とする。資産の売買と同じ経済的実態を有するかどうかが判断基準ではない以上、原資産の価値を使用権資産の評価に反映させる必要はないため、貸手の購入価額等を考慮しない。"},
 {"id":"13-8","rank":"B","q":"所有権移転外ファイナンス・リースの借手において、リース資産及びリース債務の計上額にリース物件の価値の側面を考慮することの問題点を指摘しなさい。","a":"リース物件の返還が行われる所有権移転外ファイナンス・リースでは、リース物件の耐用年数とリース期間が異なる場合が多く、物件そのものの売買というよりは使用する権利の売買の性格を有する。そのため、リース物件の価値に基づきリース資産及びリース債務を計上すると、資産が残存価額分過大に計上されるという問題点が指摘される。"},
 {"id":"13-9","rank":"B","q":"「リース取引に関する会計基準」と「リースに関する会計基準」それぞれについて、借手のリースの費用配分がどのように行われるか説明しなさい。","a":"「リース取引に関する会計基準」：ファイナンス・リースはリース資産の減価償却費とリース債務の利息相当額を別個に認識し、オペレーティング・リースは定額の支払リース料に基づく単一の費用を認識する。\n「リースに関する会計基準」：すべてのリースについて使用権資産の減価償却費とリース負債の利息相当額を別個に認識する。"},
 {"id":"13-10","rank":"B","q":"土地のリースは、所有権移転外ファイナンス・リースに該当することはない。その理由を説明しなさい。","a":"土地の経済的耐用年数は無限であるため、所有権移転ファイナンス・リースに該当する所有権移転条項付リースまたは行使が確実に予想される割安購入選択権付リースの場合を除き、フルペイアウトのリースに該当しないと考えられる。そのため、土地のリースは所有権移転ファイナンス・リースまたはオペレーティング・リースのいずれかとなり、所有権移転外ファイナンス・リースには該当しない。"},
 {"id":"13-11","rank":"C","q":"現在価値基準（貸手のリース料の現在価値が原資産の現金購入価額の概ね90％以上）を満たすリースがフルペイアウトの要件を満たす理由を説明しなさい。","a":"現在価値基準を満たすリースでは、借手は当該原資産の取得価額相当額、維持管理等の費用等のほとんどすべてのコストを負担することになり、したがって、ほとんどすべての経済的利益を享受するものと推定できるため。"},
 {"id":"13-12","rank":"B","q":"ファイナンス・リースの貸手において計上される資産の性格が、所有権移転ファイナンス・リース（リース債権）と所有権移転外ファイナンス・リース（リース投資資産）で異なる理由を説明しなさい。","a":"所有権移転ファイナンス・リースの場合、貸手は借手からのリース料と割安購入選択権の行使価額で（全額借手から）回収する。所有権移転外ファイナンス・リースの場合は、リース料と見積残存価額の価値により回収を図る点で差異があるため。"},
 {"id":"13-13","rank":"B","q":"貸手の会計処理における①リース取引開始日に売上高と売上原価を計上する方法と②リース料受取時に売上高と売上原価を計上する方法が、「収益認識に関する会計基準」と整合していない点をそれぞれ説明しなさい。","a":"①リース料に含まれている利息相当額を控除せず、これを含めた金額で収益を認識する。この点が、重要な金融要素が含まれる場合に利息相当額を控除した金額で収益を認識することを求める収益認識基準と整合しない。\n②資産を使用する権利が借手に移転した時点では収益を認識せず、リース料の回収時に収益を認識する。この点が、一時点で充足される履行義務について資産に対する支配を顧客に移転した時に収益を認識することを求める収益認識基準と整合しない。"},
 {"id":"13-14","rank":"A","q":"セール・アンド・リースバック取引について①金融取引として会計処理する方法と②資産の譲渡とリースに分けて会計処理する方法の考え方と適合するケースを説明しなさい。","a":"①資産の譲渡とリースバックを一体の取引とみるものであり、資産の譲渡に売却の実態がない場合やリースバックがフルペイアウトを満たす場合など、取引前後で経済的実態が変化していないケースに適合する。\n②資産の譲渡とリースバックをそれぞれ独立した別個の取引とみるものであり、リースバックがフルペイアウトを満たさない場合など、取引前後で経済的実態が変化したケースに適合する。"},
 {"id":"13-15","rank":"A","q":"セール・アンド・リースバック取引でリースがファイナンス・リースに該当する場合、売手である借手が物件の売却に伴う損益を繰延処理する理由を説明しなさい。","a":"形式的には固定資産を売却しているが、当該固定資産を使用しているという状況は売却の前後で変わらないことから、売却時に当該固定資産の売却損益を認識することには、実現性の観点から問題があるため。"}
]},
{ch:14, title:"研究開発とソフトウェア", items:[
 {"id":"14-1","rank":"B","q":"研究開発費をすべて発生時に費用処理する理由を３つ挙げなさい。","a":"①費用処理・資産計上を任意とする従来の処理は、企業間の比較可能性が担保されず適当ではない。②研究開発費は発生時には将来の収益を獲得できるか不明であり、計画が進行し獲得期待が高まったとしても依然として確実であるとはいえない。③一定要件を満たすものの資産計上を強制する場合、実務上客観的に判断可能な要件を規定することは困難であり、企業間の比較可能性が損なわれるおそれがある。"},
 {"id":"14-2","rank":"B","q":"社内開発費について一定要件を満たす場合には資産計上を求めるべきという見解の論拠を説明しなさい。","a":"開発に関する支出の中には、経済的便益をもたらす蓋然性が高いものが含まれており、その内容にかかわらず一律にすべての研究開発費を費用として処理することは適当ではなく、一定の開発費については資産として計上すべきである。"},
 {"id":"14-3","rank":"C","q":"市場販売目的のソフトウェアの制作過程で、最初に製品化された製品マスターの完成までの費用が研究開発費とされる理由を説明しなさい。","a":"市場販売目的のソフトウェアの製品マスターの完成は、工業製品の研究開発における量産品の設計完了に相当するものと考えられるため。"},
 {"id":"14-4","rank":"C","q":"市場販売目的のソフトウェアに関する製品マスターの取得原価を無形固定資産に計上する理由を４つ挙げなさい。","a":"①製品マスター自体が販売の対象物ではないこと。②機械装置等と同様にこれを利用（複写）して製品を作成すること。③法的権利（著作権）を有していること。④適正な原価計算により取得原価を明確化できること。"},
 {"id":"14-5","rank":"C","q":"市場販売目的のソフトウェアについて、見込販売数量ではなく見込販売収益に基づく償却方法を採用することが合理的であると考えられる場合を指摘しなさい。","a":"販売期間の経過に伴い著しく販売価格が下落する性格を有するソフトウェアの場合。"},
 {"id":"14-6","rank":"C","q":"市場販売目的のソフトウェアについて、減価償却額が残存有効期間に基づく均等配分額を下回ってはならないこととされている理由を説明しなさい。","a":"見込販売数量または見込販売収益の見積りの困難性から、償却期間が長期化することを防止するために、毎期の償却額の下限を設定したことが理由である。"},
 {"id":"14-7","rank":"C","q":"研究開発費の総額を財務諸表に注記する理由を説明しなさい。","a":"研究開発費の費用処理方法には、一般管理費とする方法のほかに当期製造費用とする方法もあるため、研究開発費の総額は損益計算書の研究開発費と一致するとは限らない。そこで、研究開発の規模について企業間の比較可能性を担保するため、当該年度の研究開発費の総額を注記する。"}
]},
{ch:15, title:"収益認識", items:[
 {"id":"15-1","rank":"A","q":"「収益認識に関する会計基準」の基本となる原則を示しなさい。","a":"約束した財またはサービスの顧客への移転を、当該財またはサービスと交換に企業が権利を得ると見込む対価の額で描写するように、収益を認識すること。（５つのステップ：①契約の識別②履行義務の識別③取引価格の算定④取引価格の配分⑤履行義務の充足に応じた収益の認識）"},
 {"id":"15-2","rank":"B","q":"製造業を営む当社は，製品Ｘを毎月初めに300個ずつ12か月にわたり合計3,600個を引渡す契約を顧客と締結した。製品Ｘは通常，１個当たり80千円で販売しているため，総額288,000千円を契約上の対価とした。しかし，８か月が経過し2,400個を引渡した時点で，期間を６か月延長し1,800個の製品Ｘを追加で引渡すことを顧客から依頼されたため，これを受諾し契約変更を行った。この際，追加の1,800個については独立販売価格よりも低い１個当たり50千円で販売することとしたため，契約上の対価を378,000千円に変更した。当社はこの契約変更をどのように会計処理すべきか説明しなさい。","a":"この契約変更は，別個の財の追加により契約の範囲が拡大されるものであるが，変更される契約の価格が，追加的に約束した財に対する独立販売価格とは異なるため，契約変更を独立した契約として処理しない。また，未だ移転していない財が契約変更日以前に移転した財と別個のものであるため，契約変更を既存の契約を解約して新しい契約を締結したものと仮定して処理する。\nしたがって，残りの1,200個に係る契約を解約し，新たに10か月にわたり合計3,000個を総額186,000千円で販売する契約を締結したものと仮定して，毎月18,600千円の収益を認識すべきである。","cm":"＜Comment from K.Watanabe︓基準集を参照しながら当てはめることができるか確認する＞"},
 {"id":"15-3","rank":"A","q":"製品保証のうち延長保証（保証サービス）を製品と別個の収益認識単位とする理由を説明しなさい。","a":"保証サービスに該当する延長保証は履行義務であり、製品とは別個の収益認識単位となる。財（製品）と保証サービスは顧客への移転の時期が異なるため、収益を認識すべき時点が異なるから。"},
 {"id":"15-4","rank":"A","q":"契約を締結しなければ受取れない重要な権利を顧客に提供するポイント制度について、なぜ商品販売時に取引価格の全額を収益計上できないか説明しなさい。","a":"ポイントは契約を締結しなければ受取れない重要な権利を顧客に提供するものであるため、顧客へのポイント付与により履行義務が生じる。取引価格を商品とポイントの独立販売価格の比で按分し、ポイントに配分された金額は履行義務が充足されていないため負債（契約負債）に計上しなければならない。"},
 {"id":"15-5","rank":"A","q":"顧客への財またはサービスの提供に他の当事者が関与している場合、企業が代理人に該当する状況とその会計処理を説明しなさい。","a":"顧客との約束が、当該財またはサービスを当該他の当事者によって提供されるように企業が手配する履行義務であると判断されたとき、企業は代理人に該当する。この場合、他の当事者により提供されるように手配することと交換に企業が権利を得ると見込む報酬または手数料の金額（純額）を収益として認識する。"},
 {"id":"15-6","rank":"A","q":"小売業者が仕入先から商品を仕入れて店舗で販売する取引で、商品の在庫リスク・価格裁量権を有さない場合、企業は本人・代理人のいずれに該当するか、理由とともに説明しなさい。","a":"代理人に該当する。商品の法的所有権が顧客に移転する前に一時的に所有権を獲得しているものの、在庫リスクを負わず価格裁量権も有していないため、商品の提供に対して主たる責任を有していない。よって商品が顧客に提供される前に当該商品を支配していないと判断されるため、代理人に該当し、仕入先から受取る額を控除した純額を収益として認識する。"},
 {"id":"15-7","rank":"B","q":"建設業を営む当社は，顧客であるＡ社と，Ａ社の所有する土地上にＡ社のための建物を建設する契約を締結した。当社は，Ａ社が建設中の建物を支配しており，約束した財またはサービスの束を一定の期間にわたり充足される単一の履行義務として処理するものと判断した。当社の履行義務が一定の期間にわたり充足されるものであると判断した理由を説明しなさい。","a":"顧客が所有する土地上に建設を行う工事において，当社が顧客との契約における義務を履行することにより，資産が生じるまたは資産の価値が増加し，当該資産が生じるまたは当該資産の価値が増加するにつれて顧客が当該資産を支配すると判断したためである。","cm":"＜Comment from K.Watanabe︓収益認識は基準を写せばほぼ答案が完成するような問題も出題されうる＞"},
 {"id":"15-8","rank":"A","q":"建設業を営む当社は，顧客であるＡ社と，Ａ社の所有する土地上にＡ社のための建物を建設する契約を締結した。この契約は一定の期間にわたり充足される単一の履行義務に該当し，対価は500,000千円，工事期間は３年を予定しているが，当社が約束どおりに契約を履行できなかったこと以外の理由で，Ａ社が契約を解約する場合には，当社に生じた費用をＡ社が補償することが契約で定められている。当期に発生した原価は20,000千円であったが，契約締結後２ヶ月で到来した決算日の時点で工事仕様の細部が未定のまま工事が進行しているため，当社は履行義務の充足に係る進捗度を合理的に見積ることができないと判断し，収益の認識を行わなかった。この取扱いの妥当性を説明しなさい。","a":"当社は履行義務の充足に係る進捗度を合理的に見積ることができないが，当社に生じた費用を顧客が補償することが契約で定められており，当該履行義務を充足する際に発生する費用を回収することが見込まれる場合に該当する。この場合は，履行義務の充足に係る進捗度を合理的に見積ることができる時まで原価回収基準により処理するため，当期に発生した原価20,000千円をもって収益を計上する必要があり，収益の認識を行わなかった当社の取扱いは妥当とはいえない。","cm":"＜Comment from K.Watanabe︓覚える内容は⼀つもない，当てはめを⾏うだけ＞"},
 {"id":"15-9","rank":"A","q":"「収益認識に関する会計基準」では、商品の割賦販売について割賦基準（回収基準等）を適用して収益を認識することは認められるか、説明しなさい。","a":"認められない。企業は資産を顧客に移転することにより履行義務を充足した時に収益を認識するものとされ、商品の支配は通常、販売時点で顧客に移転するため、商品の割賦販売は一時点で充足される履行義務に該当する。したがって当該履行義務が充足される販売時に収益を認識しなければならない。"},
 {"id":"15-10","rank":"B","q":"製造業を営む当社は，製造した製品を消費者に販売するために，小売業者であるＡ社に製品を引き渡している。この取引では，Ａ社に製品を引き渡した時点でＡ社は当社へ対価を支払う義務はなく，Ａ社から当社への支払いはＡ社が製品を顧客へ販売した月の翌月に行われる。また，Ａ社に引き渡した製品を当社が第三者に販売するために，当社はＡ社に製品の返還を要求することができる。当社はＡ社に製品を引き渡した時点で収益を認識しているが，この会計処理の妥当性について説明しなさい。","a":"この取引は，Ａ社に製品を引き渡した時点でＡ社は当社へ対価を支払う義務はなく，また，当社はＡ社に製品の返還を要求することができるため，Ａ社は製品の引き渡しを受けても製品に対する支配を獲得しておらず，Ａ社は委託販売契約として当社の製品を保有しているに過ぎないと考えられる。したがって，Ａ社に製品を引き渡した時点で収益を認識している当社の会計処理は妥当とはいえない。","cm":"＜Comment from K.Watanabe︓問題⽂の表現を使いつつ知識を当てはめて記述するのが事例問題の鉄則＞"},
 {"id":"15-11","rank":"B","q":"建設業を営む当社は，顧客仕様の建物を建設する契約を顧客と締結した。約束された対価は100,000千円であるが，建物の完成がＸ２年３月31日より１日早まるごとに対価が2,000千円増額される。この場合，取引価格を決定する上で留意すべき点を説明しなさい。","a":"増額部分は変動対価に該当するため，企業が権利を得ることとなる対価の額を見積る必要がある。見積られた変動対価の額については，変動対価の額に関する不確実性が事後的に解消される際に，解消される時点までに計上された収益の著しい減額が発生しない可能性が高い部分に限り，取引価格に含める。","cm":"＜Comment from K.Watanabe︓ほぼ基準そのまま，規定の存在位置を確認しておく＞\nＱ：変動対価がある場合，一言でいえばどのように取引価格を決定するの？\nＡ：一旦計上した収益があとから大幅に減少することのないような範囲で決定する。"},
 {"id":"15-12","rank":"B","q":"建設業を営む当社は，顧客であるＡ社と，Ａ社の所有する土地上にＡ社のための建物を建設する契約を締結した。この契約は一定の期間にわたり充足される単一の履行義務に該当し，対価は500,000千円であるが，36か月以内に完成した場合には50,000千円の割増金がＡ社から追加で支払われることとなっている。この契約に基づく建設工事は天候や規制上の承認等の影響を受けやすいが，当社は類似した契約についての経験が少ない。当社はこの契約における割増金部分を取引価格に含めなかったが，この取扱いの妥当性について説明しなさい。","a":"割増金は変動対価に該当するが，この契約に基づく建設工事は天候や規制上の承認等の影響を受けやすいこと，そして類似した契約についての当社の経験が少ないことから，変動対価の額に関する不確実性が事後的に解消される時点までに，計上された収益の著しい減額が発生しない可能性が高いとは判断できない。したがって，割増金部分は取引価格に含めず，その受領が確実になった時点で収益として認識すべきであるため，当社の取扱いは妥当である。","cm":"＜Comment from K.Watanabe︓基準集を参照しながら当てはめができるか確認する＞"},
 {"id":"15-13","rank":"C","q":"建設業を営む当社は，顧客であるＡ社と，Ａ社の所有する土地上にＡ社のための建物を建設する契約を締結した。この契約は一定の期間にわたり充足される単一の履行義務に該当し，対価は500,000千円であるが，次の特約が付されているため，この契約における対価は変動対価である。① 建物の完成時に第三者による検査が行われ，契約で定められた方法に基づく評点が付けられる。建物に所定の評点が付いた場合には，当社は25,000千円の報奨金を受取る権利を得る。② 建物の完成が契約で定められた予定日より１日遅れるごとに対価が2,000千円減額され，予定日より１日早まるごとに対価が1,000千円増額される。当社は，取引価格を算定する際に，①に関連する変動対価については最頻値法を採用し，②に関連する変動対価については期待値法を採用したが，それぞれの方法を採用した根拠を説明しなさい。","a":"① 考え得る選択肢が25,000千円とゼロの２つのみであるため。\n② 考え得る結果が数多くあり，不確実性を考慮する必要があるため。","cm":"＜Comment from K.Watanabe︓細かいが単純な知識論点であるため覚えておくと安⼼感が増す＞"},
 {"id":"15-14","rank":"B","q":"分割払いの条件で商品を販売した場合、割賦販売価格の総受取額をそのまま売上収益に計上することは適切か、説明しなさい。","a":"適切ではない。長期の分割払いの条件により資産の顧客への移転に係る信用供与についての重要な便益が顧客に提供されているため、割賦販売価格には重要な金融要素が含まれる。取引価格の算定にあたっては金利相当分の影響を調整し、現金販売価格をもって売上収益を計上するのが適切である。"},
 {"id":"15-15","rank":"B","q":"小売業を営む当社は顧客に対し商品を現金販売しているが，この取引は返品条件付販売であり，顧客からの申し出があれば当初の売価により無条件で商品を引き取ることになっている。この取引について，商品の販売時に当社が行うべき会計処理を説明しなさい。なお，商品の回収コストには重要性がないと見積られており，また，返品された商品は利益が生じるように原価以上の販売価格で再販売可能である。","a":"収益は，財またはサービスの顧客への移転と交換に企業が権利を得ると見込む対価の額である取引価格に基づき認識するが，返品条件付販売の場合，企業が権利を得ると見込む対価の額は変動対価に該当する。そのため，返品されると見込まれる商品については収益を認識せず，これを除いた権利を得ると見込む対価の額で収益を認識する。その際，返品されると見込まれる商品について受取ったまたは受取る対価の額で返金負債を認識するとともに，返金負債の決済時に顧客から商品または製品を回収する権利について資産を認識する。","cm":"＜Comment from K.Watanabe︓変動対価の⼀論点であることを理解し，ある程度このまま書けるようにしておく＞"},
 {"id":"15-16","rank":"B","q":"工事契約について工事損失引当金を計上する会計処理の背景にある考え方を説明しなさい。","a":"正常な利益を獲得することを目的とする企業行動において、投資額を回収できないような事態が生じた場合には、有用な情報を提供するために将来に損失を繰延べないための会計処理が求められる。工事損失引当金の計上は、工事契約において損失が見込まれる場合に当該損失を見込まれた期の損失として計上する会計処理であり、有価証券や固定資産の減損処理、棚卸資産の簿価切下げと同様に、将来に損失を繰延べないために行われる会計処理である。"},
 {"id":"15-17","rank":"B","q":"有償支給取引の原則的な会計処理について、支給品を買い戻す義務を負っている場合と負っていない場合に分けて説明しなさい。","a":"買い戻す義務を負っている場合：支給先は支給品に対する支配を獲得していないため、支給品の譲渡に係る収益を認識せず、当該支給品の消滅も認識しない。\n負っていない場合：支給品の消滅を認識するが、譲渡に係る収益と最終製品の販売に係る収益が二重に計上されることを回避するため、当該支給品の譲渡に係る収益は認識しない。"}
]},
{ch:16, title:"連結財務諸表", items:[
 {"id":"16-1","rank":"A","q":"連結基礎概念における①親会社説と②経済的単一体説の考え方を説明しなさい。","a":"①親会社説：連結財務諸表を親会社の財務諸表の延長線上に位置付け、主として親会社の株主の立場から連結財務諸表が作成されるとみる考え方。\n②経済的単一体説：連結財務諸表を親会社とは区別される企業集団全体の財務諸表と位置付け、非支配株主も含む企業集団全体の株主の立場から作成されるとみる考え方。"},
 {"id":"16-2","rank":"A","q":"連結貸借対照表における非支配株主持分の表示区分について、①親会社説と②経済的単一体説のそれぞれの立場から説明しなさい。","a":"①親会社説：親会社の株主の持分のみが株主資本に反映されるため、非支配株主持分は株主資本以外の区分に表示すべき。\n②経済的単一体説：企業集団を構成する全ての会社の株主の持分が株主資本に反映されるため、非支配株主持分は株主資本に含めて表示すべき。"},
 {"id":"16-3","rank":"A","q":"連結損益計算書における非支配株主に帰属する当期純利益の表示方法について、①親会社説と②経済的単一体説のそれぞれの立場から説明しなさい。","a":"①親会社説：連結損益計算書の当期純利益には親会社の株主に帰属する部分のみを反映させるため、非支配株主に帰属する当期純利益は当期純利益の算定上控除する。\n②経済的単一体説：企業集団を構成する全ての会社の株主に帰属する部分を反映させるため、非支配株主に帰属する当期純利益を当期純利益の算定上含める。"},
 {"id":"16-4","rank":"B","q":"平成25年の改正前の「連結財務諸表に関する会計基準」が，親会社説の考え方によっていた理由を２つ挙げなさい。","a":"・連結財務諸表が提供する情報は，主として親会社の投資者を対象とするものであると考えられるため。\n・親会社説による処理方法が，企業集団の経営を巡る現実感覚をより適切に反映すると考えられるため。","cm":"＜Comment from K.Watanabe︓かつて問われたことがある内容，太字部分を簡潔に覚えておく＞"},
 {"id":"16-5","rank":"B","q":"平成25年の改正後の「連結財務諸表に関する会計基準」が，親会社株主に帰属する当期純利益を区分して内訳表示または付記することとした理由を２つ挙げなさい。","a":"・親会社株主と非支配株主とではリスク及びリターンは大きく異なることを考慮すれば，親会社株主に係る成果とそれを生み出す原資に関する情報は投資家の意思決定に引き続き有用であると考えられるため。\n・親会社株主に帰属する当期純利益と株主資本との連繋（クリ－ン・サープラス関係）に配慮すべきであるため。","cm":"＜Comment from K.Watanabe︓軽く挙げられるようにしておきたい＞"},
 {"id":"16-6","rank":"A","q":"平成25年改正後の会計基準が非支配株主持分を株主資本とは区別して表示することとした理由を説明しなさい。","a":"親会社株主に帰属する当期純利益と株主資本との連繋（クリーン・サープラス関係）に配慮した結果、親会社株主に帰属する株主資本のみを株主資本として表示することとしたため。"},
 {"id":"16-7","rank":"A","q":"子会社の判定基準としての①持株基準と②支配力基準の意義と特徴を説明しなさい。","a":"①持株基準：親会社が直接・間接に議決権の過半数を所有しているかどうかにより判定する方法。客観的だが恣意的な連結外しにより実態を正しく反映しないおそれがある。\n②支配力基準：実質的な支配関係の有無に基づいて判定する方法。主観的判断が介入するおそれがあるが企業集団の実態を正しく反映できる。"},
 {"id":"16-8","rank":"A","q":"制度会計上、子会社の判定基準として支配力基準が採用されている理由を説明しなさい。","a":"議決権の所有割合が50％以下であっても、役員派遣等によってその会社を事実上支配しているケースもあり、そのような被支配会社を連結の範囲に含まない連結財務諸表は、企業集団に係る情報としての有用性に欠けることになるため。"},
 {"id":"16-9","rank":"C","q":"連結貸借対照表において，「少数株主持分」から「非支配株主持分」へ表示が変わった理由を説明しなさい。","a":"支配力基準を前提とした場合，他の企業の議決権の過半数を所有していない株主であっても他の会社を支配し親会社となることがあり得るため，「少数株主」ではなく「非支配株主」がより正確な表現と考えられるからである。","cm":"＜Comment from K.Watanabe︓まぁ確かにそうですねということが理解できればOK＞"},
 {"id":"16-10","rank":"B","q":"Ｐ社はＡ社の議決権の45％を所有しているが，Ｐ社Ａ社間で取引は行われておらず，財務及び営業または事業の方針に影響を及ぼす契約等も存在しない。Ａ社がＰ社の子会社であると判定されるとすればどのような理由が考えられるか，２つ例を挙げなさい。","a":"・Ｐ社が自己の計算において所有している議決権と，自己と出資，人事，資金，技術，取引等において緊密な関係があることにより自己の意思と同一の内容の議決権を行使すると認められる者及び自己の意思と同一の内容の議決権を行使することに同意している者が所有している議決権とを合わせて，Ａ社の議決権の過半数を占めている。\n・Ｐ社の役員若しくは使用人である者，またはこれらであった者で自己が他の企業の財務及び営業または事業の方針の決定に関して影響を与えることができる者が，Ａ社の取締役会その他これに準ずる機関の構成員の過半数を占めている。","cm":"＜Comment from K.Watanabe︓基準の表現が使えるため，当てはめができるかどうかだけがポイント＞\nＱ：議決権だけで子会社と判定されるケースにはどのようなものがあるか？\nＡ：①議決権の過半数所有，②議決権の40％以上50％以下所有＋緊密者等と合わせて議決権の過半数所有"},
 {"id":"16-11","rank":"B","q":"制度会計上，共同支配の実態にある合弁会社に対し比例連結を採用することは認められるか，理由とともに説明しなさい。","a":"混然一体となっている合弁会社の資産，負債等を一律に持分比率で按分して連結財務諸表に計上することは不適切であると考えられるため，比例連結を採用することは認められない。","cm":"＜Comment from K.Watanabe︓定型文である太字部分をこのまま覚える＞"},
 {"id":"16-12","rank":"B","q":"親会社及び子会社が採用する会計方針は，同一環境下で行われた同一の性質の取引等について，原則として統一するものとされている。その理由を説明しなさい。","a":"同一の環境下にあるにもかかわらず，同一の性質の取引等について連結会社間で会計方針が異なっている場合には，その個別財務諸表を基礎とした連結財務諸表が企業集団の財政状態，経営成績及びキャッシュ・フローの状況の適切な表示を損なうため。","cm":"＜Comment from K.Watanabe︓太字部分を覚えておく，特に最初が重要＞"},
 {"id":"16-13","rank":"B","q":"同一環境下で行われた同一の性質の取引等について，親会社及び子会社が採用する会計方針は，原則として統一するものとされており，親会社と各子会社の会計方針を画一的に統一することは求められていない。その理由を説明しなさい。","a":"親会社と各子会社は，それぞれの置かれた環境の下で経営活動を行っているため，親会社と各子会社の会計方針を画一的に統一することは，かえって連結財務諸表が企業集団の財政状態，経営成績及びキャッシュ・フローの状況を適切に表示しなくなることが理由である。","cm":"＜Comment from K.Watanabe︓太字部分を覚えておく，特に最初が重要＞"},
 {"id":"16-14","rank":"A","q":"在外子会社の財務諸表がIFRSまたは米国会計基準に準拠している場合、一部項目について会計処理の修正が求められる理由を説明しなさい。","a":"一部の項目については各会計基準に準拠した会計処理が我が国の会計基準に共通する考え方と乖離するものであり、一般に当該差異に重要性があるため、修正なしに連結財務諸表に反映することは合理的でなく、その修正に実務上の支障は少ない。財務報告において特に重要とされる当期純利益が適切に計上されるように、会計処理を修正することが求められる。"},
 {"id":"16-15","rank":"A","q":"在外子会社の財務諸表が国際財務報告基準（ＩＦＲＳ）または米国会計基準に準拠して作成されている場合，それを連結決算手続上利用することができるものの，一部の項目については各会計基準に準拠した会計処理が，「我が国の会計基準に共通する考え方と乖離する」ものであることから，在外子会社の会計処理を修正することが求められている。この我が国の会計基準に共通する考え方とは何か，例示しなさい。","a":"我が国の会計基準に共通する考え方としては，当期純利益を測定する上での費用配分，当期純利益と株主資本との連繋及び投資の性格に応じた資産及び負債の評価などが挙げられる。","cm":"＜Comment from K.Watanabe︓この３つを挙げられるのは当然として，意味を説明できるようにするのが理想＞"},
 {"id":"16-16","rank":"A","q":"子会社の資産・負債の評価方法である①部分時価評価法と②全面時価評価法の考え方と整合する連結基礎概念を説明しなさい。","a":"①部分時価評価法：親会社が投資を行った際の親会社の持分を重視する考え方が基礎にあり、親会社持分に相当する部分のみ取得日ごとの時価で評価する。親会社説と整合的。\n②全面時価評価法：子会社を支配した結果、子会社が企業集団に含まれることになった事実を重視する考え方が基礎にあり、資産及び負債のすべてを支配獲得日の時価で評価する。経済的単一体説と整合的。"},
 {"id":"16-17","rank":"A","q":"子会社株式の取得が複数の取引により達成された場合、投資の金額を①個々の取引ごとの原価の合計額とする方法と②支配獲得日の時価とする方法の論拠を、投資の継続性の観点から説明しなさい。","a":"①一連の取得取引は当該投資先に対する継続した投資であると考えるならば、個々の交換取引はあくまでその時点での等価交換取引であり、取得原価は個々の交換取引ごとに算定した原価の合計額とすることが経済的実態を適切に反映する。\n②支配獲得により過去に所有していた投資の実態が変化し、支配獲得時にいったん投資が清算され改めて投資を行ったものと考えるならば、支配獲得日における時価を新たな投資原価とすることが経済的実態を適切に反映する。"},
 {"id":"16-18","rank":"B","q":"子会社の資本の範囲については，①新株予約権を子会社の資本に含めるとする考え方と②新株予約権を子会社の資本に含めないとする考え方がある。それぞれの論拠を説明しなさい。","a":"① 新株予約権は，権利行使されれば払込資本となり，失効すれば利益となるものであるため，いずれの場合でも株主資本を構成し，報告主体の所有者である株主に帰属する部分となる。\n②・新株予約権者は株主とは異なり，報告主体の所有者ではない。\n・親会社以外が子会社の新株予約権を保有している場合，権利行使されれば非支配株主持分を増加させるが，失効すれば持分比率に応じて親会社持分及び非支配株主持分を増加させるため，権利未行使の段階では帰属先が未確定である。","cm":"＜Comment from K.Watanabe︓含める方法のロジックが押さえられていればOK＞"},
 {"id":"16-19","rank":"B","q":"連結財務諸表におけるのれんの計上範囲について①購入（買入）のれん方式と②全部のれん方式の論拠を説明しなさい。","a":"①のれんの計上は有償取得の場合に限られるべきだが、非支配株主持分に相当するのれんは自己創設のれんにほかならず、これを禁止する現行制度と整合しない。また非支配株主持分を親会社持分から推定測定するのは客観性を欠く。\n②のれんは資産の定義を満たすため、全部連結の観点からは他の資産と同様に総額で表示することが有用な情報を提供する。経済的単一体説の立場からは親会社株主と非支配株主は同等であるため、非支配株主持分に相当する部分についても計上すべき。"},
 {"id":"16-20","rank":"B","q":"子会社に欠損が生じている場合の会計処理について，連結基礎概念と関連させて説明しなさい。","a":"親会社説では非支配株主に配分する子会社の欠損を非支配株主が負担すべき額に限定する。これは，非支配株主を企業集団の外部者とみる親会社説では，非支配株主には子会社の欠損を負担させないことを理由とする。\n経済的単一体説では子会社の欠損を親会社と非支配株主の持分割合に応じてそれぞれに配分する。これは，非支配株主も企業集団の内部者とみる経済的単一体説では，非支配株主にも子会社の欠損を負担させることを理由とする。","cm":"＜Comment from K.Watanabe︓着眼点（内部者or外部者）を外さなければ⾃分の⾔葉で⼗分説明可能＞"},
 {"id":"16-21","rank":"A","q":"子会社株式の追加取得及び一部売却の会計処理について、連結基礎概念と関連させて説明しなさい。","a":"親会社説（非支配株主を外部者とみる）：追加取得・一部売却は外部者との取引として損益取引で処理する。追加取得の差額はのれんまたは負ののれん、一部売却の差額は子会社株式の売却損益とする。\n経済的単一体説（非支配株主を内部者とみる）：内部者との取引として資本取引で処理する。のれんや売却損益は計上されず、差額を資本剰余金とする。"},
 {"id":"16-22","rank":"B","q":"子会社株式を一部売却した場合（支配は継続しているものとする）ののれんの取扱いについては，①のれんを減額する方法と②のれんを減額しない方法がある。それぞれの論拠を説明しなさい。","a":"①・のれんの未償却額を減額しない場合には，一部売却した親会社持分相当額に対応するのれんの償却費が次期以降にも認識され，「親会社株主に帰属する当期純利益」が適切ではなくなる。\n・購入のれん方式を採用している以上，のれんは投資原価の一部であり，子会社株式を一部売却した場合には売却割合だけ投資原価を減額するべきである。\n・のれんは親会社持分相当額しか計上されていないという特殊性があるため，他の資産や負債とは異なる会計処理が許容される。\n②・支配獲得後の追加取得時にはのれんが追加計上されない一方，一部売却時にのれんを減額すると，追加取得時の会計処理と整合した取扱いにはならない。\n・支配獲得後は支配が継続している限り，償却や減損を除き，のれんを減額すべきではない。","cm":"＜Comment from K.Watanabe︓減額しない場合の問題点を中⼼に覚える＞"},
 {"id":"16-23","rank":"B","q":"支配を喪失して連結範囲から除外された場合，過去の子会社株式の追加取得及び一部売却等によって計上された資本剰余金はどのように取扱われるか，理由とともに説明しなさい。","a":"支配を喪失して連結範囲から除外する場合でも，子会社株式の追加取得及び一部売却等によって生じた資本剰余金は，引き続き，連結財務諸表上，資本剰余金として計上する。これは，支配継続中の追加取得及び一部売却等の取引は，親会社と子会社の非支配株主との間の取引であり，当該取引によって生じた資本剰余金は子会社に帰属するものではないことが理由である。","cm":"＜Comment from K.Watanabe︓結論は計算とともに押さえる，論拠は太字部分を簡潔に覚える＞"},
 {"id":"16-24","rank":"A","q":"アップ・ストリームによる未実現損益の消去方式について、①親会社説と②経済的単一体説のそれぞれの立場から説明しなさい。","a":"①親会社説：非支配株主を外部者とみるため、内部取引の損益のうち非支配株主持分相当額は実現しているものとされ、親会社持分相当額のみが未実現損益として消去される（部分消去・親会社負担方式）。\n②経済的単一体説：非支配株主を内部者とみるため、内部取引の損益はすべて未実現とされ、親会社持分相当額と非支配株主持分相当額の全額が未実現損益として消去される（全額消去・持分按分負担方式）。"},
