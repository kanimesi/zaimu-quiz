 {"id":"16-25","rank":"B","q":"次の①～④について，連結と持分法（関連会社を前提とする）のそれぞれの会計処理を簡潔に説明しなさい。① 資産及び負債の時価評価の範囲② 段階取得の場合の会計処理③ 付随費用の会計処理④ 追加取得及び一部売却の会計処理","a":"①連 結：親会社の持分に相当する部分のみならず，非支配株主持分に相当する部分を含めて，全てを支配獲得日の時価により評価する (全面時価評価法)。\n持分法：投資会社の持分に相当する部分に限定する方法により，原則として，投資日ごとに当該日における時価によって評価する（部分時価評価法）。\n②連 結：支配獲得日に一括して投資と資本を相殺消去するため，投資の支配獲得日における時価とこれに対応する子会社の資本との差額を，のれんまたは負ののれんとして処理する。\nなお，支配獲得日における時価と支配を獲得するに至った個々の取引ごとの原価の合計額との差額は，当期の段階取得に係る損益として処理する。\n持分法：持分法適用関連会社に対する投資が段階的に行われている場合であっても，原則として，投資日ごとの原価とこれに対応する被投資会社の資本との差額を，のれんまたは負ののれんとして処理する。\n③連 結：発生した連結会計年度の費用として処理する。\n持分法：投資原価に含める。\n④連 結：追加取得持分と追加取得額との差額または売却（減少）持分と売却価額（払込額）との差額は，資本剰余金とされる。\n持分法：追加取得持分と追加取得額との差額または売却（減少）持分と売却価額（払込額）との差額は，のれんもしくは負ののれんまたは売却損益とされる。","cm":"＜Comment from K.Watanabe︓計算を確実にマスターし，それを⾔葉で説明できるようにするという順序が大事＞\nＱ：制度会計上，連結と持分法の会計処理に上記のような差異が生ずる根本的な理由は？\nＡ：連結対象の子会社は支配を獲得しているが，持分法対象の関連会社は支配を獲得していない点。"},
 {"id":"16-26","rank":"B","q":"非連結子会社と関連会社では，持分法を適用する際の資産及び負債の評価方法が異なる。これについて，理由とともに説明しなさい。","a":"非連結子会社の場合には当該非連結子会社を支配しており，連結子会社の場合との整合性を図るため全面時価評価法によるが，関連会社の場合には影響力を有しているものの，関連会社を支配しているわけではないため部分時価評価法による。","cm":"＜Comment from K.Watanabe︓それぞれの時価評価方法の背景を知っていれば当然の話＞"},
 {"id":"16-27","rank":"B","q":"投資会社が持分法適用関連会社に資産を売却したことに伴う未実現損益の消去方式について，理由とともに説明しなさい。","a":"未実現損益のうち第三者の持分部分については，連結財務諸表上，実現したものと考えられるため，売手側である投資会社に生じた未実現損益のうち，原則として関連会社に対する投資会社の持分相当額を消去する持分相当額消去方式による。","cm":"＜Comment from K.Watanabe︓計算問題を解く上でも必要な知識であり，太字部分は必ず覚える＞"}
]},
{ch:17, title:"法人税等", items:[
 {"id":"17-1","rank":"A","q":"税効果会計を適用しない場合の問題点について、損益計算書及び貸借対照表の観点から説明しなさい。","a":"課税所得を基礎として計算された法人税等の額が税金費用として計上される結果、会計上の利益と課税所得との間に差異があるとき、損益計算書上、法人税等の額が税引前当期純利益と期間的に対応せず、また貸借対照表上、将来の法人税等の支払額に対する影響が表示されないという問題点が指摘される。"},
 {"id":"17-2","rank":"A","q":"税効果会計の方法としての①繰延法と②資産負債法の意義を述べなさい。","a":"①繰延法：会計上の収益・費用と税務上の益金・損金の額との間に生じた差異のうち、損益の期間帰属の相違に基づくもの（期間差異）について、差異が生じた年度に納付額または軽減額を差異が解消する年度まで繰延税金資産または繰延税金負債として計上する方法。\n②資産負債法：会計上の資産・負債の額と課税所得計算上の資産・負債の額との差異（一時差異）が解消する時に課税所得を減額または増額する効果を有する場合、当該差異が生じた年度にそれに係る繰延税金資産または繰延税金負債を計上する方法。"},
 {"id":"17-3","rank":"A","q":"①繰延法と②資産負債法について、それぞれの考え方（税効果の意味、適用税率）を説明しなさい。","a":"①繰延法：差異発生年度の損益計算書上の対応を重視する。適用税率は発生年度の税率で、その後の税率変更があっても修正しない。\n②資産負債法：差異解消年度の税金支払額への影響を貸借対照表に示すことを重視する。適用税率は解消見込年度の税率で、税率変更があれば修正する。"},
 {"id":"17-4","rank":"A","q":"制度会計上、税効果会計の方法として資産負債法が採用されている理由を２つ挙げなさい。","a":"①資産負債法は税率変更に応じて繰延税金資産・負債の金額を修正するため、将来の法人税等の支払額を減額・増額する効果をより適切に示すことができる。②資産負債法では資産の評価差額に対する税効果額を税効果会計の対象に含めることができる。"},
 {"id":"17-5","rank":"A","q":"期間差異と一時差異の意義と違い、及び一時差異が税効果会計の対象とされる理由を説明しなさい。","a":"期間差異：会計上と税務上の収益・費用の相違のうち損益の期間帰属の相違に基づく差異。一時差異：会計上の資産・負債の額と課税所得計算上の資産・負債の額との差額。違い：資産・負債の評価替えにより直接純資産の部に計上され課税所得計算に含まれない評価差額は、一時差異ではあるが期間差異ではない。理由：差異解消期間における税金支払額への影響額を貸借対照表に表示するには、期間差異のみならず評価・換算差額等にも税効果会計を適用する必要があるため。"},
 {"id":"17-6","rank":"A","q":"税効果会計の適用上、税務上の繰越欠損金はどのように取扱われるか説明しなさい。","a":"税務上の繰越欠損金は一時差異ではないが、繰越期間に課税所得が生じた場合には課税所得を減額でき、その結果納付すべき法人税等の額が軽減されるため、一時差異と同様の税効果を有する。したがって税効果会計の適用上、一時差異に準ずるものとして取扱う。"},
 {"id":"17-7","rank":"A","q":"資産負債法を採用した場合における繰延税金資産及び繰延税金負債の性格について説明しなさい。","a":"繰延税金資産：将来の法人税等の支払額を減額する効果を有し、一般的には法人税等の前払額に相当するため、資産としての性格を有する。\n繰延税金負債：将来の法人税等の支払額を増額する効果を有し、法人税等の未払額に相当するため、負債としての性格を有する。"},
 {"id":"17-8","rank":"A","q":"繰延税金資産について将来の回収可能性の検討が必要な理由と、判断要件を３つ挙げなさい。","a":"繰延税金資産は法人税等の前払額に相当するが、これは将来減算一時差異等を超える課税所得が計上されることを前提とする。そのため回収可能性の判断が必要となる。\n判断要件：①収益力に基づく一時差異等加減算前課税所得 ②タックス・プランニングに基づく一時差異等加減算前課税所得 ③将来加算一時差異。"},
 {"id":"17-9","rank":"A","q":"未実現利益の消去に係る税効果の会計処理について、①繰延税金資産の計上額、②適用税率及び税率変更時の取扱いを、理由とともに説明しなさい。","a":"①未実現利益が発生した連結会社と一時差異の対象資産を保有する連結会社が異なるという特殊性を考慮し、売却元が売却年度に納付した未実現利益に係る税金額を繰延税金資産として計上する。②売却元での課税関係は完了しており税金は確定した金額であるため、売却元に適用された税率を使用し、税率等の変更があっても修正しない。"},
 {"id":"17-10","rank":"A","q":"未実現損益の消去に係る一時差異の会計処理について，①繰延法と②資産負債法のそれぞれによった場合の損益計算に与える影響を説明しなさい。","a":"① 繰延法によれば，未実現利益を消去する時に当該利益に対して納付した税金相当額を繰延税金資産として計上し税金費用を消去することにより，実際に税金を納付した時点において利益と税金費用が対応する。\n② 資産負債法によれば，未実現利益が実現した時に当該利益に対して納付すると仮定した場合の税金相当額を税金費用として計上することにより，実際に資産が売却された時点において利益と税金費用が対応する。","cm":"＜Comment from K.Watanabe︓あくまで損益計算からの記述であり，いつ対応関係が生ずるかを必ず述べる＞"},
 {"id":"17-11","rank":"A","q":"子会社株式等の取得に伴い認識したのれんについて、一時差異に該当するが税効果を認識しない理由を説明しなさい。","a":"のれんは税務上の資産計上もその償却額の損金算入も認められず、子会社における個別貸借対照表上の簿価も存在しないため将来加算一時差異となる。しかし、のれんは投資額と子会社資産負債の時価評価純額の親会社持分額との差額（配分残余）としての性格を有しており、のれんに対して税効果を認識すればのれんが変動し、それに対してまた税効果を認識するという循環が生じることから、税効果は認識しない。"},
 {"id":"17-12","rank":"B","q":"繰延税金資産及び繰延税金負債の表示については，①流動・非流動区分を行う方法と②すべて非流動区分に表示する方法がある。それぞれの方法の論拠を説明しなさい。","a":"① 一時差異等に関連した資産及び負債と，その税金費用に関する資産及び負債（当該一時差異等に係る繰延税金資産及び繰延税金負債）が同時に取崩されるという特徴があるため，これらを同一の区分に表示することが適切である。\n② 繰延税金資産は換金性のある資産ではなく，また，決算日後に税金を納付する我が国においては，１年以内に解消される一時差異等について，１年以内にキャッシュ・フローは生じないため，すべてを非流動区分に表示することが適切である。","cm":"＜Comment from K.Watanabe︓太字部分を指摘できるようになっていれば十分＞"}
]},
{ch:18, title:"外貨換算", items:[
 {"id":"18-1","rank":"C","q":"外貨建資産・負債の換算方法としての流動・非流動法の論拠を説明しなさい。","a":"短期間のうちに現金化ないし決済される流動項目に関わる為替相場の変動の影響については，確定的な性格のものとみなして，それが生じた期に認識することが投資家に対する有益な情報となるため，決算時の為替相場による円換算額を付する。一方，現金化または決済されるまでの期間が長期にわたる非流動項目に関わる為替相場の変動の影響については，それが生じた時点では暫定的な性質のものにすぎず，為替相場変動の不確実性を考慮すれば，不確定な損益を認識することで投資家の判断を誤らせるおそれがあるため，取得時または取引発生時の為替相場による円換算額を付する。","cm":"＜Comment from K.Watanabe︓あえてここが問われるとは思わないが，損益の不確定性くらいは指摘したい＞"},
 {"id":"18-2","rank":"A","q":"外貨建資産・負債の換算方法としての貨幣・非貨幣法の論拠を説明しなさい。","a":"貨幣項目は法令または契約により金額が確定しており将来金銭の流出入があるため、決算時の為替相場による換算によって決算日現在の自国通貨による回収可能額・弁済額を表示すべきである。非貨幣項目は一般に取得時・取引発生時の支出額・収入額で測定されるため、取得時の為替相場による換算によって自国通貨による支出額・収入額を表示すべきである。"},
 {"id":"18-3","rank":"A","q":"外貨建資産・負債の換算方法としてのテンポラル法の論拠を説明しなさい。","a":"外貨によって既に測定されている項目の属性を変更しないように、測定時点と同じ時点における為替相場により換算するため、測定数値の属性を維持した換算を行うことができる。"},
 {"id":"18-4","rank":"B","q":"平成11年に外貨建取引等会計処理基準が改訂された際，外貨建金銭債権債務について流動・非流動法による区分を設けないこととした理由を説明しなさい。","a":"外貨建金銭債権債務については，外貨額では時価の変動リスクを負わず，したがって時価評価の対象とならないものであっても，円貨額では為替相場の変動リスクを負っていることを重視し，流動・非流動法による区分は設けずに決算時の為替相場により換算することとした。これは，金融商品に関する会計基準の考え方との整合性等を考慮し，為替相場の変動を財務諸表に反映させることをより重視する観点を重視したためである。","cm":"＜Comment from K.Watanabe︓このとおりに問われる場合でしか使われない説明だが，太字部分は覚えておきたい＞"},
 {"id":"18-5","rank":"A","q":"外貨建金銭債権債務について、決算時の為替相場による円換算額を付する理由を説明しなさい。","a":"外貨建金銭債権債務については、外貨額では時価の変動リスクを負わず時価評価の対象とならないものであっても、円貨額では為替相場の変動リスクを負っていることを重視したため。"},
 {"id":"18-6","rank":"B","q":"外貨建未収収益及び未払費用について，決算時の為替相場による円換算額を付する理由を説明しなさい。","a":"外貨建未収収益及び未払費用は，外貨建金銭債権債務を基礎とした経過勘定であり，期日が到来した時点で外貨建金銭債権債務となるため，外貨建金銭債権債務に準ずるものとして扱うことが適切であるため。","cm":"＜Comment from K.Watanabe︓外貨建⾦銭債権債務に準ずるものという表現が出てくればOK＞"},
 {"id":"18-7","rank":"C","q":"外貨建前渡金及び前受金について，金銭授受時の為替相場による円換算額を付する理由を説明しなさい。","a":"前渡金は将来，財またはサービスの提供を受ける費用性資産であり，また，前受金は将来，財またはサービスの提供を行う収益性負債であるから，いずれも外貨建金銭債権債務ではなく，将来の費用化額または収益化額は確定したものであるため。","cm":"＜Comment from K.Watanabe︓問われそうにはないが，計算をイメージしつつ理解はしておきたい＞"},
 {"id":"18-8","rank":"B","q":"外貨建満期保有目的の債券について，決算時の為替相場による円換算額を付する理由を説明しなさい。","a":"金銭債権との類似性を考慮し，外貨建金銭債権と同様に処理することとしたため。","cm":"＜Comment from K.Watanabe︓短いからこのまま覚える＞"},
 {"id":"18-9","rank":"A","q":"外貨建売買目的有価証券及び外貨建その他有価証券について、時価の算定に決算時の為替相場を用いる理由を説明しなさい。","a":"時価評価が行われる有価証券の換算は、その円貨額による時価評価額を求める過程としての換算であるため。"},
 {"id":"18-10","rank":"B","q":"市場価格のないその他有価証券のうち外貨建株式等は，決算時にいかなる為替相場を用いるか．理由とともに説明しなさい。","a":"そもそもその他有価証券には時価評価が求められているのであり，市場価格がないために取得原価による場合であっても，円貨額による時価評価額を求める過程としての換算という基本的な考え方に変わりはないため，決算時の為替相場を用いる。これは，時価評価の対象にならないものであっても，円貨額では為替相場の変動リスクを負っているものについて，為替相場の変動を財務諸表に反映させるものであるため，外貨建取引等会計処理基準の立場にも合致する。","cm":"＜Comment from K.Watanabe︓論証18-９の内容を吐き出せれば御の字，ときどき読んでおく＞"},
 {"id":"18-11","rank":"B","q":"外貨建子会社株式及び外貨建関連会社株式について，取得時の為替相場による円換算額を付する理由を説明しなさい。","a":"子会社株式及び関連会社株式への投資は事業投資としての性格を有し，外貨の属性が取得原価であるため。","cm":"＜Comment from K.Watanabe︓短いからこのまま覚える＞"},
 {"id":"18-12","rank":"C","q":"その他有価証券に属する債券については，外国通貨による時価を決算時の為替相場で換算した金額のうち，外国通貨による時価の変動に係る換算差額を評価差額とし，それ以外の換算差額については為替差損益として処理することができる。この会計処理の背景にある考え方を説明しなさい。","a":"その他有価証券に属する債券については，金銭債権債務の換算方法との整合性の観点から，価格変動リスクと為替変動リスクを分解して取扱い，外国通貨による取得原価に係る換算差額は当期の損益に計上すべきとする考え方が背景にある。","cm":"＜Comment from K.Watanabe︓リスクが異なる点が指摘できればOK＞"},
 {"id":"18-13","rank":"B","q":"外貨建新株予約権について，決算時の円貨への換算方法とその理由を説明しなさい。","a":"外貨建自社発行新株予約権の決算時の円貨への換算は，発行時の為替相場による。これは，新株予約権が将来株主資本または利益に振替えられる可能性のある仮勘定であり，返済義務のある負債ではないことを理由とする。","cm":"＜Comment from K.Watanabe結論は計算の知識，論拠は太字部分の説明がすべて＞"},
 {"id":"18-14","rank":"B","q":"外貨建転換社債型新株予約権付社債の権利行使時（新株を発行するものとする）の換算には，①新株の発行価額を権利行使時の為替相場により換算する方法と②新株の発行価額を社債発行時の為替相場により換算する方法がある。それぞれの方法の基礎にある考え方を説明しなさい。","a":"① 転換社債型新株予約権付社債の発行と権利行使による新株の発行をいったん切断して考え，転換社債型新株予約権付社債の権利行使による新株の発行を現物出資や相殺と解する考え方。\n② 転換社債型新株予約権付社債の発行を新株予約権の権利行使による新株の発行の一環として考え，転換社債型新株予約権付社債の発行を潜在的株式の発行と解する考え方。","cm":"＜Comment from K.Watanabe︓対⽐の軸を押さえる，⼀連か別個独⽴かの視点は様々な論点で登場するため重要＞"},
 {"id":"18-15","rank":"A","q":"外貨建取引の処理基準である一取引基準と二取引基準の意義及び会計処理について説明しなさい。","a":"一取引基準：外貨建取引と代金決済取引とを連続した一つの取引とみなす考え方。取引時から決済時までの為替相場の変動の影響を取引価額の修正により営業損益として処理し、円貨建取引価額は決済時の為替相場による金額で確定する。\n二取引基準：外貨建取引と代金決済取引とを独立した別個の取引とみなす考え方。円貨建取引価額は取引時の為替相場で確定し、為替相場の変動の影響は財務損益として処理される。"},
 {"id":"18-16","rank":"B","q":"一取引基準と二取引基準の論拠をそれぞれ説明しなさい。","a":"一取引基準：企業が為替相場の変動を考慮に入れ最終的な決済額を見込んで取引条件を決定しているならば、為替相場の変動の影響を営業損益に含めて処理することが実務感覚に合致している。\n二取引基準：為替相場の変動により発生した損益が財務活動としての為替対策の巧拙を示すものと考えるならば、独立に財務損益として処理することが企業内容開示の観点から適切である。"},
 {"id":"18-17","rank":"B","q":"外貨建金銭債権債務に係る為替相場の変動リスクをヘッジする目的で為替予約等を行う場合，特別な会計処理としてのヘッジ会計は不要となる。その理由を説明しなさい。","a":"この場合，ヘッジ対象である外貨建金銭債権債務には決算時の為替相場による円換算額が付され，換算差額が当期の為替差損益として処理される。一方，ヘッジ手段である為替予約等は時価をもって貸借対照表価額とされ，評価差額が当期の損益として処理される。このように，ヘッジ対象に係る換算差額とヘッジ手段に係る評価差額が同時に損益計算書に計上され，ヘッジの効果を自動的に反映させることができるため，ヘッジ対象に係る損益とヘッジ手段に係る損益を同一の会計期間に認識し，ヘッジの効果を会計に反映させるための特別な会計処理としてのヘッジ会計は不要となる。","cm":"＜Comment from K.Watanabe︓覚える論証ではない，損益ミスマッチが⽣じないことが説明できればOK＞"},
 {"id":"18-18","rank":"B","q":"その他有価証券に分類される外貨建有価証券に為替予約等の振当処理を行うことは可能か，理由とともに説明しなさい。","a":"振当処理の対象となる外貨建金銭債権債務等は，為替予約等が振当処理されることにより将来のキャッシュ・フローが固定されるものに限られる。この点，外貨建満期保有目的債券以外の外貨建有価証券については，その保有目的が多義的であることから売却時期が未確定であり，また，時価の変動により受取る外貨金額が変動することから，為替予約等によりキャッシュ・フローを固定することは困難であると考えられる。したがって，その他有価証券に分類される外貨建有価証券については，たとえヘッジ会計の要件を満たした場合でも，為替予約等の振当処理は認められない。","cm":"＜Comment from K.Watanabe︓振当処理の要件を当てはめているだけ，ロジックを理解する＞"},
 {"id":"18-19","rank":"A","q":"①本国主義と②現地主義について、考え方、在外事業体の財務諸表の位置付け、及び整合する換算方法を説明しなさい。","a":"①本国主義：在外事業体を従属的事業体と位置付け、本国の事業体の一部・延長とみる。あたかも本国の事業体が取引ごとに円貨で会計処理を行ったかのような換算結果が求められるため、テンポラル法が整合する。\n②現地主義：在外事業体を独立事業体と位置付け、本国から独立して活動しているとみる。財務諸表項目相互の比率を換算前後で保持することが求められるため、決算日レート法が整合する。"},
 {"id":"18-20","rank":"A","q":"外貨表示財務諸表項目の換算方法としてのテンポラル法について，その長所及び短所をそれぞれ説明しなさい。","a":"（長所）\n・測定時点と同じ時点における為替相場により換算するため，測定数値の属性を維持した換算を行うことができる。\n・在外事業体の取引を当初から本国の事業体が行っていたならば付されたはずの円貨額に換算することができる。\n（短所）\n・複数の為替相場を用いて換算を行うため，換算のパラドックスが生じることがある。\n・複数の為替相場を用いて換算を行うため，事務的に煩雑である。","cm":"＜Comment from K.Watanabe︓簡潔に挙げられる程度には覚えたい＞"},
 {"id":"18-21","rank":"A","q":"外貨表示財務諸表項目の換算方法としての決算日レート法について，その長所及び短所をそれぞれ説明しなさい。","a":"（長所）\n・決算日レート法によると，在外事業体の財務諸表項目相互の比率を換算前後で保持することができるため，換算のパラドックスが生じない。\n・単一の為替相場を用いて換算を行うため，実務的に簡便である。\n（短所）\n・外貨では過去の取引価額で測定されている項目についても決算時の為替相場により換算することで，測定数値の属性を変更してしまうことがある。","cm":"＜Comment from K.Watanabe︓簡潔に挙げられる程度には覚えたい＞"},
 {"id":"18-22","rank":"A","q":"在外支店の外貨表示財務諸表項目の換算に関する考え方と原則的な換算方法について説明しなさい。","a":"在外支店は本店の一部ないし延長とみる本国主義の考え方が採られている。在外支店の財務諸表の構成要素は個別財務諸表の構成要素となることから、本店の外貨建項目の換算基準と整合的であることが望ましく、あたかも本店がその取引ごとに円貨で会計処理を行ったかのような換算結果を得ることができるテンポラル法が原則的な換算方法とされる。"},
 {"id":"18-23","rank":"A","q":"在外子会社等の外貨表示財務諸表項目の換算に関する考え方と換算方法について説明しなさい。","a":"在外子会社等は本国の親会社とは独立したものとみる現地主義の考え方が採られている。外貨表示財務諸表自体が独立した財務諸表としての意味をもつと考えられるため、現地通貨による測定値そのものが重要視され、項目相互の比率を換算前後で保持できる決算日レート法が採用されている。"},
 {"id":"18-24","rank":"A","q":"在外子会社等の収益及び費用の換算には，①期中平均相場により換算する方法と②決算時の為替相場により換算する方法がある。それぞれの方法の論拠を説明しなさい。","a":"① 当期純利益は１期間にわたって計上されたものであることから，当期純利益を構成する収益および費用は期中平均相場によって換算することが望ましいため。\n② 当期純利益は決算時に確定されたものであることから，当期純利益を構成する収益および費用は決算時の為替相場によって換算することが望ましいため。","cm":"＜Comment from K.Watanabe︓太字部分を覚えておけば説明可能＞"},
 {"id":"18-25","rank":"B","q":"現行制度における外貨表示財務諸表項目の換算は，在外事業体の法的形態に基づき，在外支店はテンポラル法が，在外子会社は決算日レート法が，それぞれ適用されている。このように法的形態に基づいて在外事業体の外貨表示財務諸表項目の換算方法を使い分けることの問題点について説明しなさい。","a":"在外事業体の法的形態として支店と子会社のいずれを採用するかは，必ずしも事業の独立性の程度という経済的実態の相違のみを考慮して決定されるものではないため，現実には事業の独立性の程度が高い在外支店や，事業の独立性の低い在外子会社等が存在する。このため，在外事業体の法的形態に基づき外貨建財務諸表項目の換算方法を使い分けると，事業の独立性の程度が同一であり経済的実態に大差がない場合でも，支店と子会社等との間で異なる換算方法が採用されたり，事業の独立性の程度が異なり経済的実態が全く異なる場合でも，支店間または子会社等間で同一の換算方法が採用されたりするため，財務諸表が経済的実態を示さなくなるという問題が生じる。","cm":"＜Comment from K.Watanabe︓覚える論証ではない，問題の所在を理解し問われたときに何か書けるようにする＞"},
 {"id":"18-26","rank":"A","q":"為替換算調整勘定を資産または負債としない理由を説明しなさい。","a":"為替換算調整勘定は在外子会社等の貸借対照表項目の円貨への換算手続の結果発生する項目であり、資産性または負債性を有していないため。"},
 {"id":"18-27","rank":"A","q":"為替換算調整勘定を当期の損益としない理由を説明しなさい。","a":"為替換算調整勘定は在外子会社等の貸借対照表項目の円貨への換算手続の結果発生し、在外子会社等の経営成績とは無関係に発生するものであるため。"},
 {"id":"18-28","rank":"B","q":"在外子会社ののれんの換算について、①発生時の為替相場で換算する方法と②決算時の為替相場で換算する方法の論拠を説明しなさい。","a":"①のれんは親会社の投資と子会社の資本の相殺消去の結果生じる親会社による取得原価の一部であり、親会社に帰属する資産と考えると、発生時の為替相場により換算すべき。\n②のれんは子会社に存在する超過収益力であり、子会社に帰属する資産と考えると、現地通貨で発生したものであるため、子会社の他の資産と同様に各期の為替相場の変動を反映させるべき。"}
]},
{ch:19, title:"財務諸表", items:[
 {"id":"19-1","rank":"B","q":"株主資本等変動計算書が導入された理由を、会社法の計算規定と関連させて説明しなさい。","a":"会社法では株式会社は株主総会・取締役会の決議により剰余金の配当をいつでも決定でき、株主資本の計数もいつでも変動させることができるため、貸借対照表及び損益計算書だけでは資本金・準備金・剰余金の数値の連続性を把握することが困難である。そのため、主として株主資本の各項目の変動事由を報告するために導入された。"},
 {"id":"19-2","rank":"B","q":"株主資本等変動計算書の記載範囲については，①純資産の部のすべての項目とする考え方と②純資産の部のうち株主資本のみとする考え方がある。それぞれの論拠を２つずつ挙げなさい。","a":"①・資産と負債の差額である純資産について，国際的な会計基準では，株主資本以外の項目についても，一会計期間の変動を開示する考え方であるため，国際的な会計基準との調和を重視すべきである。\n・評価・換算差額等の残高が大きい場合には，その変動が将来の株主資本の変動に大きな影響を与える可能性があり，その変動事由を示すことも財務諸表利用者にとって有用な場合がある。\n②・財務報告における情報開示の中で，財務諸表利用者にとって特に重要な情報は投資の成果を表す利益の情報であり，当該情報の主要な利用者であり受益者である株主に対して，当期純利益とこれを生み出す株主資本との関係を示すことが重要である。\n・包括利益は当期純利益を超える有用性が確認されていないといわれることから，評価・換算差額等については変動事由ごとに表示することが必ずしも必要とはいえない。","cm":"＜Comment from K.Watanabe︓それぞれ太字となっている論拠の⽅を説明できるようにしておく＞"},
 {"id":"19-3","rank":"B","q":"制度会計上，株主資本等変動計算書の表示方法は，株主資本とそれ以外の項目とで差異が設けられている。その理由を説明しなさい。","a":"表示方法に差異が設けられたのは，株主資本とそれ以外の項目とでは一会計期間における変動事由ごとの金額に関する情報の有用性が異なること，また，株主資本以外の各項目を変動事由ごとに表示することに対する事務負担の増大などを考慮したためである。","cm":"＜Comment from K.Watanabe︓単純だから簡潔に覚えておく＞"},
 {"id":"19-4","rank":"B","q":"包括利益及びその他の包括利益の内訳を表示する目的と期待される効果を説明しなさい。","a":"目的：期中に認識された取引及び経済的事象（資本取引を除く）により生じた純資産の変動を報告し、その他の包括利益の内訳項目をより明瞭に開示すること。\n効果：財務諸表利用者が企業全体の事業活動を検討するのに役立ち、貸借対照表との連携（クリーン・サープラス関係）を明示することで理解可能性・比較可能性を高め、国際的な会計基準とのコンバージェンスにも資する。"},
 {"id":"19-5","rank":"B","q":"純利益の問題点を指摘することにより，包括利益の優位性を主張する見解がある。これについて説明しなさい。","a":"未実現の評価差額及び換算差額を，経営者の意思によっていつでも実現させて利益に算入することができる純利益は，恣意的に調整することができるため，利益の透明性を確保することができないという問題がある。これに対し，未実現の評価差額及び換算差額の変動額がその他の包括利益として利益に含められる包括利益は，恣意的な調整を行うことができないため，利益の透明性を確保できる点に優位性があるとされる。","cm":"＜Comment from K.Watanabe︓理解できていれば説明できる内容であるため，覚えるよりも理解したい＞"},
 {"id":"19-6","rank":"C","q":"連結財務諸表における包括利益の計算の表示方法には，①親会社株主に帰属する当期純利益から開始する方法と②当期純利益から開始する方法がある。それぞれの方法の利点を説明しなさい。","a":"①・親会社株主に帰属する当期純利益の計算との連携がより明確である。\n・連結株主資本等変動計算書や連結貸借対照表の数値との関連づけがしやすい。\n②・包括利益に至る計算過程が明瞭である。\n・その他の包括利益の内訳の表示について国際的な会計基準とのコンバージェンスを図ることができる。","cm":"＜Comment from K.Watanabe︓問われそうにはないが，①の２つは理解しておきたい＞"},
 {"id":"19-7","rank":"A","q":"その他の包括利益のリサイクリングについては，①リサイクリングをしない方法と②リサイクリングをする方法がある。それぞれの意義を述べるとともに，特徴を純利益の性質，クリーン・サープラス関係，一致の原則の成否及び包括利益の二重計上の観点から説明しなさい。","a":"① これは過去にその他の包括利益として認識された項目を，当期純利益を構成する項目として認識しない方法であり，その他の包括利益が実現した際に利益剰余金に直接加減する。そのため，「純利益＝リスクから解放された投資の成果（実現利益）」の関係，株主資本と純利益の間のクリーン・サープラス関係，純利益についての一致の原則はいずれも成立しない。また，この方法では，過去にその他の包括利益とされた金額を純利益の計算に含めないため，包括利益の二重計上が回避される。\n② これは過去にその他の包括利益として認識された項目を，当期純利益を構成する項目として再度認識する方法であり，その他の包括利益が実現した際に当期純利益を通じて利益剰余金が増減する。そのため，「純利益＝リスクから解放された投資の成果（実現利益）」の関係，株主資本と純利益の間のクリーン・サープラス関係，純利益についての一致の原則はいずれも成立する。また，この方法では，過去にその他の包括利益とされた金額が純利益の計算に含められるため，そのままでは包括利益が二重に計上されるが，その他の包括利益から控除する処理を行うことにより，包括利益の二重計上が回避される。","cm":"＜Comment from K.Watanabe︓対⽐ポイントについてそれぞれの結論を理解を伴って覚える＞\n※論証5-22と同内容"},
 {"id":"19-8","rank":"A","q":"リサイクリングの必要性を、企業価値評価の観点から説明しなさい。","a":"リサイクリングにより、純利益に確定した投資の成果という性格が備わるとともに、純利益情報の完全性がキャッシュ・フローとの整合性で裏付けられ、純利益が総合的な業績指標としての有用性を備える。また報告主体の所有者に帰属する純利益と資本取引を除く株主資本の増減額が一致するという関係が成立し、会計情報の信頼性を高められる。その結果、純利益が企業成果の予測を通じた企業価値評価に役立つものとなる。"},
 {"id":"19-9","rank":"B","q":"包括利益を表示する計算書の形式について，①２計算書方式と②１計算書方式のそれぞれの利点を説明しなさい。","a":"① 当期純利益と包括利益とが明確に区別され，当期純利益が強調されるため，当期純利益を重視するわが国の考え方と整合的である。\n② 当期純利益と包括利益をまとめて開示するため，一覧性・明瞭性・理解可能性等の点で利点がある。","cm":"＜Comment from K.Watanabe︓①を挙げられるようにしたい＞"},
 {"id":"19-10","rank":"C","q":"損益計算書における利益情報とキャッシュ・フロー計算書におけるキャッシュ・フロー情報について，会計情報の質的特性の観点から比較しなさい。","a":"利益計算はキャッシュの各会計期間への期間配分を通じて行われるため，一つの会計事実に対して複数の会計処理方法が認められている場合があり，また，経営者の主観的な判断や見積りが含まれる。そのため，利益情報には経営者の有する情報を反映させることが可能となり，意思決定との関連性を高めることができる。\nキャッシュ・フロー情報はキャッシュ・フローという事実に基づき作成されるため，代替的な会計処理が少なく，また，経営者の主観的な判断や見積りが含まれない。そのため，キャッシュ･フロー情報には経営者の恣意性が介入する余地が少なく，信頼性を高めることができる。","cm":"＜Comment from K.Watanabe︓書くことはなさそう，読んでなるほどと思えればOK＞"},
 {"id":"19-11","rank":"B","q":"市場性のある一時所有の株式等が「現金同等物」に含まれない理由を説明しなさい。","a":"一時所有の有価証券のうち、価値変動リスクを有する株式等の金融商品と短期の支払に充てることを目的とした現金及び現金同等物とは異なる投資意図及び内部統制手続の下に取引が行われるのが一般的であり、株式等への資金運用は短期間であっても投資活動としての性格を有すると考えられるため。"},
 {"id":"19-12","rank":"B","q":"「短期投資」に該当しない，運用期間が比較的長期の投資が「現金同等物」に含まれない理由を説明しなさい。","a":"運用期間が比較的長期のものについては，通常，短期の支払資金準備のためというよりは，資金管理上は異なる意図をもって運用されていると考えられるため。","cm":"＜Comment from K.Watanabe︓短期の⽀払資⾦準備がキーワード，キャッシュとは何かを理解していれば書ける＞\nＱ：キャッシュを一言で表現すると？\nＡ：短期の支払資金。"},
 {"id":"19-13","rank":"B","q":"「現金及び現金同等物」の内容が会計方針としての注記を求められる理由を説明しなさい。","a":"現金同等物として具体的に何を含めるかについては，各企業の資金管理活動により異なることが予想されるため，一律の基準を設けることは必ずしも適切ではない。したがって，現金同等物の範囲は経営者の判断に委ねることが適当と考えられるため，資金の範囲に含めた現金及び現金同等物の内容に関して，会計方針として注記する必要がある。","cm":"＜Comment from K.Watanabe︓型にはまった⾔い回しで説明できるようにしたい＞"},
 {"id":"19-14","rank":"B","q":"機械を割賦取引により取得した場合の割賦代金等の支払額は，キャッシュ・フロー計算書においてどの区分に記載するか，理由とともに説明しなさい。","a":"機械を割賦取引により取得した場合の割賦代金等の支払は，ファイナンスとしての性格が強いと考えられることから，その支払額は「財務活動によるキャッシュ・フロー」の区分に記載する。","cm":"＜Comment from K.Watanabe︓太字部分を答えられればOK＞"},
 {"id":"19-15","rank":"B","q":"法人税等に係るキャッシュ・フローを「営業活動によるキャッシュ・フロー」の区分に記載する理由を説明しなさい。","a":"法人税等に係るキャッシュ・フローは，営業活動，投資活動及び財務活動の結果として生じるものであることから，三つの区分のそれぞれに分けて記載する方法も考えられる。しかし，課税所得をそれぞれの活動に分割することは一般的には困難であると考えられるため，「営業活動によるキャッシュ・フロー」の区分に一括して記載する。","cm":"＜Comment from K.Watanabe︓太字部分を答えられればOK＞"},
 {"id":"19-16","rank":"B","q":"利息及び配当金に係るキャッシュ・フローの表示方法について、①受取利息等を営業活動、支払配当金を財務活動とする方法と②受取利息等を投資活動、支払利息・支払配当金を財務活動とする方法が、それぞれ重視している点を説明しなさい。","a":"①損益の算定に含まれるか否かに着目し、営業活動の区分で損益と収支のズレを把握できるように表示することを重視。\n②キャッシュ・フローの発生源泉に着目し、いかなる活動から生じたものかを各区分において明らかにすることを重視。"},
 {"id":"19-17","rank":"B","q":"資産除去債務に係るキャッシュ・フローを「投資活動によるキャッシュ・フロー」の区分に記載する理由を２つ挙げなさい。","a":"・現行制度上，資産除去債務に対応する除去費用を有形固定資産の取得に関する付随費用と同様に処理するものとしていることを考慮すると，固定資産の取得による支出と同様に投資活動に係る支出とみることが整合的と考えられるため。\n・固定資産の除去に伴う支出を固定資産の売却収入の控除項目と考えれば，投資活動によるキャッシュ・フローとみることができるため。","cm":"＜Comment from K.Watanabe︓⼀つ目が重要，このまま覚えたい＞"},
 {"id":"19-18","rank":"B","q":"連結範囲の変動を伴わない子会社株式の追加取得または一部売却に係るキャッシュ・フローは，連結キャッシュ・フロー計算書においてどの区分に記載するか，理由とともに説明しなさい。","a":"連結範囲の変動を伴わない子会社株式の追加取得または一部売却は，非支配株主との取引として，当該取引に伴う親会社の持分変動による差額が資本剰余金に計上されるため，この処理との整合を図る観点から，当該取引に係るキャッシュ・フローは「財務活動によるキャッシュ・フロー」の区分に記載する。","cm":"＜Comment from K.Watanabe︓ロジックが⼤事な論点であり，このまま覚えたほうが楽＞"},
 {"id":"19-19","rank":"C","q":"連結会社振出しの手形を他の連結会社が金融機関で割引いた場合の収入額は，連結キャッシュ・フロー計算書においてどの区分に記載するか，理由とともに説明しなさい。","a":"連結会社振出しの手形を他の連結会社が金融機関で割引いた場合，連結上は手形借入と同様の効果であるため，当該収入額は「財務活動によるキャッシュ・フロー」の区分に記載する。","cm":"＜Comment from K.Watanabe︓太字部分を答えられればOK＞"},
 {"id":"19-20","rank":"B","q":"「営業活動によるキャッシュ・フロー」の区分において小計欄が設けられる理由を説明しなさい。","a":"「営業活動によるキャッシュ・フロー」の区分には、投資活動及び財務活動以外の取引によるキャッシュ・フローも含まれるため、小計欄において本来の意味での営業活動によるキャッシュ・フローを明らかにするとともに、これと投資活動及び財務活動以外の取引によるキャッシュ・フローを区別するために設けられる。"},
 {"id":"19-21","rank":"B","q":"営業活動によるキャッシュ・フローの①直接法と②間接法の論拠を説明しなさい。","a":"①営業活動に係るキャッシュ・フローが総額で表示される点。\n②一部を除き基礎データを用意する必要がないため実務上簡便である点、また純利益と営業活動に係るキャッシュ・フローとの関係が明示される点。"},
 {"id":"19-22","rank":"B","q":"制度会計上，営業活動によるキャッシュ・フローに関する表示方法として，直接法と間接法が選択適用とされる理由を説明しなさい。","a":"直接法による表示方法は，営業活動に係るキャッシュ・フローが総額で表示される点に長所が認められるが，直接法により表示するためには親会社及び子会社において主要な取引ごとにキャッシュ・フローに関する基礎データを用意することが必要であり，実務上手数を要すると考えられる。一方，実務上簡便である間接法による表示方法にも，純利益と営業活動に係るキャッシュ・フローとの関係が明示される点に長所が認められる。このように，直接法と間接法はそれぞれ長所が認められるため，選択適用とされている。","cm":"＜Comment from K.Watanabe︓前の論証の内容を並べつつ，結論は「それぞれ⻑所がある」で締めるだけ＞"},
 {"id":"19-23","rank":"B","q":"間接法のキャッシュ・フロー計算書において，減価償却費，営業債権の貸倒損失及び棚卸資産の評価損は，税金等調整前当期純利益に加減して表示される非資金損益項目に含まれるか，説明しなさい。","a":"非資金損益項目とは，税金等調整前当期純利益の計算には反映されるが，キャッシュ・フローを伴わない項目をいい，減価償却費はこれに該当するため，税金等調整前当期純利益に加減算する非資金損益項目に含まれる。しかし，営業債権の貸倒損失及び棚卸資産の評価損のように，営業活動に係る資産及び負債に関連して発生した非資金損益項目については，税金等調整前当期純利益の計算に反映されるとともに，営業活動に係る資産及び負債の増減にも反映されていることから，税金等調整前当期純利益に加減算する非資金損益項目には含まれない。","cm":"＜Comment from K.Watanabe︓計算をイメージしながら説明の流れを押さえる＞"},
 {"id":"19-24","rank":"C","q":"「投資活動によるキャッシュ・フロー」及び「財務活動によるキャッシュ・フロー」の区分では，期間が短く，かつ，回転が速い項目に係るキャッシュ・フローについては，純額で表示することができるものとされている。これが認められる理由を，具体例を示しつつ説明しなさい。","a":"短期借入金の借換えが短期間に連続して行われるような場合などに，これらのキャッシュ・フローを総額表示すると，キャッシュ・フローの金額が大きくなり，かえってキャッシュ・フロー計算書の利用者の判断を誤らせるおそれがあるため。","cm":"＜Comment from K.Watanabe︓そりゃそうだという話＞"},
 {"id":"19-25","rank":"B","q":"キャッシュ・フロー計算書において、重要な非資金取引を注記する理由を説明しなさい。","a":"キャッシュ・フローを伴わない非資金取引の中には、翌期以降長期にわたりキャッシュ・フローに影響する取引があるため。"},
 {"id":"19-26","rank":"C","q":"①貸借対照表において投資不動産として区分されている不動産及び②将来の使用が見込まれていない遊休不動産が時価の開示対象に含まれる理由，ならびに③物品の製造や販売，サービスの提供，経営管理に使用されている不動産が時価の開示対象に含まれない理由をそれぞれ説明しなさい。","a":"① 投資不動産は，市場平均を超える成果を期待して保有されているものではなく，その時価そのものが企業にとっての価値を示すため。\n② 将来の使用が見込まれていない遊休不動産は，売却が予定されている不動産と同様に，処分によるキャッシュ・フローしか期待されていないため，時価が企業にとっての価値を示すため。\n③ 物品の製造や販売，サービスの提供，経営管理に使用されている不動産は，当該不動産から市場平均を超える成果を生み出すことを期待して使用されているため，保有する企業にとっての価値は，通常，市場の平均的な期待で決まる時価ではないため。","cm":"＜Comment from K.Watanabe︓このまま覚えるような内容ではないが，それぞれの理解は必須＞"},
 {"id":"19-27","rank":"B","q":"制度会計上、賃貸等不動産を時価評価しない理由を説明しなさい。","a":"単に賃貸収益を得ることを目的として不動産が保有される場合や、キャピタル・ゲイン目的で保有されていても、活発な取引が行われるよう整備された購買市場と売却市場とが区別されていない単一の市場が存在しない場合には、時価によって直ちに売買・換金を行うことには制約があるため、時価評価しその差額を損益とすることは適当ではないと考えられる。"},
 {"id":"19-28","rank":"D","q":"当期に株式併合または株式分割が行われた場合には，表示する財務諸表のうち，最も古い期間の期首に当該株式併合または株式分割が行われたと仮定して，１株当たり当期純利益及び潜在株式調整後１株当たり当期純利益を算定する。その理由を説明しなさい。","a":"・株式併合または株式分割は期末に行われても既存の普通株主に一律に影響するものであるため，普通株主に関する企業の成果を示すためには，普通株式の期中平均株式数及び普通株式増加数を，表示する財務諸表のうち，最も古い期間の期首に，当該株式併合または株式分割が行われたと仮定して算定することが適当であるため。\n・株式併合または株式分割の影響が，株価とともに１株当たり当期純利益にも反映されることによって，株価収益率が適切に算定されるため。","cm":"＜Comment from K.Watanabe︓そもそも論⽂でEPSが問われるのは想像しにくい＞"},
 {"id":"19-29","rank":"C","q":"①関連当事者との取引に関する開示及び②関連当事者の存在に関する開示が求められる理由を，それぞれ説明しなさい。","a":"① 会社と関連当事者との取引は，会社と役員等の個人との取引を含め，対等な立場で行われているとは限らず，会社の財政状態や経営成績に影響を及ぼすことがあるため。\n② 直接の取引がない場合においても，関連当事者の存在自体が，会社の財政状態や経営成績に影響を及ぼすことがあるため。","cm":"＜Comment from K.Watanabe︓問われそうにはないが，説明できるのが望ましい＞"},
 {"id":"19-30","rank":"B","q":"マネジメントアプローチの意義及び長所（３つ）・短所（２つ）を説明しなさい。","a":"意義：経営上の意思決定を行い業績を評価するために、経営者が企業を事業の構成単位に分別した方法を基礎としてセグメント情報を開示する方法。\n長所：①経営者の行動を予測でき将来キャッシュ・フローの評価に反映可能②追加的費用が比較的少ない③恣意性が入りにくい。\n短所：①企業間・年度間の比較が困難②内部情報の開示が事業活動の障害となる可能性。"},
 {"id":"19-31","rank":"B","q":"「セグメント情報等の開示に関する会計基準」では，マネジメント・アプローチの採用理由として，討議資料「財務会計の概念フレームワーク」における「会計情報の質的特性」に示される２つの特性間の優劣関係に言及している。そこで，この２つの特性を示すとともに，その優劣関係について説明しなさい。","a":"この２つの特性は，意思決定との関連性と比較可能性である。\n意思決定との関連性は，信頼性とともに，会計情報に求められる最も基本的な特性である意思決定有用性を直接支える特性であり，会計情報が利用者の意思決定にとって有用であるか否かを直接判定する規準として機能する。これに対して，比較可能性は，会計情報が有用であるために必要とされる最低限の基礎的な条件であり，この特性によって意思決定有用性が直接的に判断されるわけではない。したがって，この２つの特性間において，意思決定との関連性は比較可能性に優先するという関係にある。","cm":"＜Comment from K.Watanabe︓２つの特性の名称と両者の関係は説明できるようにしたい＞\n※論証5-8と同内容"},
 {"id":"19-32","rank":"B","q":"セグメント情報の開示にあたりマネジメント・アプローチを採用することについて，そのメリットとデメリットを，討議資料「財務会計の概念フレームワーク」の考え方を踏まえて説明しなさい。","a":"マネジメント・アプローチに基づくセグメント情報は，財務諸表利用者が経営者の視点で企業を見ることにより，経営者の行動を予測し，その予測を企業の将来キャッシュ・フローの評価に反映することが可能になるため，意思決定との関連性の観点からメリットがある。一方で，当該セグメント情報は，企業の組織構造に基づく情報であるため，企業間の比較を困難にし，また，同一企業の年度間の比較が困難になるため，比較可能性の観点からデメリットがある。","cm":"＜Comment from K.Watanabe︓知識問題であり，メリット・デメリットと理由を説明できるよう覚える＞\n※論証5-9と同内容"}
]},
{ch:20, title:"会計上の変更等", items:[
 {"id":"20-1","rank":"C","q":"「会計方針の開示，会計上の変更及び誤謬の訂正に関する会計基準」では，「会計上の変更」と「過去の誤謬の訂正」を区別して定義している。その理由を説明しなさい。","a":"遡及処理については，それが過去の誤謬の訂正に関して行われたものであるのか，それとも，会計方針の変更及び表示方法の変更のように専ら比較可能性を担保する会計情報を提供するために行われたものであるのかの区別が，開示制度等との関係で重要であると考えられるため。","cm":"＜Comment from K.Watanabe︓内容の理解は必要だが，これを答案に書く問題を想像することは難しい＞"},
 {"id":"20-2","rank":"B","q":"会計基準等の改正に伴う変更以外の会計方針の変更を行うために必要な「正当な理由」の要件を２つ挙げなさい。","a":"①会計方針の変更が企業の事業内容または企業内外の経営環境の変化に対応して行われるものであること。②会計方針の変更が会計事象等を財務諸表に、より適切に反映するために行われるものであること。"},
 {"id":"20-3","rank":"A","q":"会計方針の変更を行った場合に遡及適用を行う理由を２つ挙げなさい。","a":"①過去の財務諸表に新しい会計方針を遡及適用すれば、財務諸表全般についての比較可能性が高まるものと考えられるため。②当期の財務諸表との比較可能性を確保するために、過去の財務諸表を変更後の会計方針に基づき比較情報として提供することにより情報の有用性が高まることが期待されるため。"},
 {"id":"20-4","rank":"C","q":"会計方針の変更が当期の財務諸表に与えている影響を注記しない理由を説明しなさい。","a":"遡及適用に伴い比較情報としての過去の財務諸表及び当該過去の期間における影響額を開示することにより，期間比較可能性や会計方針の変更による影響額の情報が十分に提供し得ると考えられるため。","cm":"＜Comment from K.Watanabe︓説明になっていないがそういうものだと割り切って押さえる＞"},
 {"id":"20-5","rank":"C","q":"表示方法の変更を行った場合に財務諸表の組替えを行う理由を説明しなさい。","a":"表示方法の変更を行った場合に過去の財務諸表の組替えを求めることは，会計方針の変更について原則として遡及適用を求めることと同様に，財務諸表全般についての比較可能性が高まり，情報の有用性がより高まるなどの効果が期待できるため。","cm":"＜Comment from K.Watanabe︓会計方針の変更の論証を流⽤できる＞"},
 {"id":"20-6","rank":"A","q":"会計上の見積りの変更を行った場合に遡及処理しない理由を説明しなさい。","a":"会計上の見積りの変更は、新しい情報によってもたらされるものであるとの認識から、過去に遡って処理せず、その影響は将来に向けて認識するため。"},
 {"id":"20-7","rank":"A","q":"臨時償却（キャッチ・アップ方式）が廃止された理由を３つ挙げなさい。","a":"①キャッチ・アップ方式は実質的に過去の期間への遡及適用と同様の効果をもたらす処理となることから、新たな事実の発生に伴う見積りの変更に関する会計処理としては適切な方法ではない。②その方法が適切と思われる状況があっても、耐用年数の短縮に収益性の低下を伴うことが多く、減損処理の中で両方の影響を含めて処理できる。③臨時償却として処理される事例の多くが将来の除却損の前倒し的な意味合いが強く、本来の意味での臨時償却として行われる実務は多くない。"},
 {"id":"20-8","rank":"B","q":"固定資産の減価償却方法の変更について、①会計方針の変更に該当するという考え方と②会計上の見積りの変更に該当するという考え方の論拠を説明しなさい。","a":"①固定資産の経済的便益の消費パターンの見積りが取得時点では難しいからこそ計画的・規則的な償却を行うという考え方に立てば、減価償却方法の変更は当該計画的・規則的な償却方法の中での変更であり、見積りの要素とは直接的な関係を持たない。\n②減価償却方法を会計方針を適用する際の手法と位置付ければ、その手法の変更は会計方針の変更ではなく、資産に具現化された将来の経済的便益の予測消費パターンの見積りの変更を意味する。"},
 {"id":"20-9","rank":"B","q":"固定資産の減価償却方法の変更を会計上の見積りの変更として捉える場合の問題点を３つ挙げなさい。","a":"・減価償却方法の変更を会計上の見積りの変更の１つとして捉える場合には，経済的便益に関する消費のパターンに合致した減価償却方法が認められることが必要となるが，このような考え方は，現実に用いられている減価償却方法がいくつかの方法に限られている実態と整合していない。\n・より実態に即した減価償却方法が選択されることによる便益よりも，会計方針であれば必要とされる継続性の原則による牽制効果が期待できなくなることや，実質的には複数の会計処理の選択の余地を増やすことになる弊害の方が大きい。\n・会計上の見積りの変更と捉えれば，採用している減価償却方法が合理的な見積りを反映しているかどうか確認する必要があるが，その合理性を常時検証し続けるという対応は現実には不可能である。","cm":"＜Comment from K.Watanabe︓⼀つ目と⼆つ目を理解した上で説明できるようにする＞"},
 {"id":"20-10","rank":"B","q":"制度会計上、固定資産の減価償却方法の変更はどのように取扱うか、理由とともに説明しなさい。","a":"固定資産の減価償却方法の変更は計画的・規則的な償却方法の中での変更であることから、その変更は会計方針の変更ではあるものの、固定資産に関する経済的便益の消費パターンに関する見積りの変更を伴うものと考えられるため、会計方針の変更を会計上の見積りの変更と区別することが困難な場合に該当する。そのため、会計上の見積りの変更と同様に取扱い、遡及適用は行わない。"},
 {"id":"20-11","rank":"C","q":"過去の誤謬が発見された場合に修正再表示する理由を説明しなさい。","a":"我が国における従来の過去の誤謬の取扱いとしては，前期損益修正項目として当期の損益で修正する方法が示されており，修正再表示する方法は定められていなかったが，誤謬を修正再表示する考え方を導入することは，期間比較が可能な情報を開示するという観点からも有用であり，国際的な会計基準とのコンバージェンスを図るという観点からも望ましいと考えられるため。","cm":"＜Comment from K.Watanabe︓遡及処理全般の論拠と同じ＞"},
 {"id":"20-12","rank":"B","q":"「会計方針の開示、会計上の変更及び誤謬の訂正に関する会計基準」が「遡及適用」と「修正再表示」を区別した理由を説明しなさい。","a":"誤謬のある過去の財務諸表を修正再表示することは、会計方針の変更に関する遡及適用等とは性格が異なっており、比較可能性の確保や会計基準のコンバージェンスの促進という観点からではなく、当然の要請として会計基準に定めておくべきであるため。"},
 {"id":"20-13","rank":"C","q":"「会計方針の開示，会計上の変更及び誤謬の訂正に関する会計基準」において，過去の誤謬の修正再表示が実務上不可能な場合を想定した取扱いが定められていない理由を説明しなさい。","a":"過去の誤謬の修正再表示が実務上不可能という理由をもって過去の財務諸表を修正再表示しないこととする取扱いを会計基準として設けた場合，誤謬を含んだ財務諸表に関し，一般に公正妥当と認められる企業会計の基準への準拠性に問題があると考えられるため。","cm":"＜Comment from K.Watanabe︓読んで内容が理解できればOK＞"},
 {"id":"20-14","rank":"C","q":"未適用の会計基準等に関する注記が求められる理由を説明しなさい。","a":"未適用の会計基準等が企業に及ぼす影響が開示されていれば、財務諸表に関連した情報として、投資の意思決定に有用であると考えられるため。"}
]},
{ch:21, title:"期中財務諸表", items:[
 {"id":"21-1","rank":"A","q":"期中財務諸表の性格としての実績主義と予測主義について、それぞれ説明しなさい。","a":"実績主義：期中会計期間を年度と並ぶ一会計期間とみた上で、年度の財務諸表と同じ会計処理の原則及び手続を適用して作成することにより、当該期中会計期間に係る財政状態等の情報を提供するという考え方。\n予測主義：期中会計期間を年度の一構成部分と位置付けて、年度の財務諸表と部分的に異なる会計処理を適用して作成することにより、当該期中会計期間を含む年度の業績予測に資する情報を提供するという考え方。"},
 {"id":"21-2","rank":"A","q":"制度会計上、期中財務諸表について実績主義が採用されている理由を３つ挙げなさい。","a":"①期中財務諸表及び年度の財務諸表は、いずれも投資家に対して将来の業績予測に資する情報を提供するものと性格付けることが適当である。②予測主義による場合は恣意的な判断の介入の余地が実績主義よりも大きい。③実績主義によれば年度の財務諸表と同様の基準により作成でき、計算手続が明確であるため実行面で優れている。"},
 {"id":"21-3","rank":"B","q":"期中財務諸表の作成にあたり、収益及び費用の認識・測定について、迅速な対応を理由に年度の財務諸表と異なる会計処理を適用することは認められるか、理由とともに説明しなさい。","a":"認められない。収益及び費用の認識及び測定は、財務諸表の信頼性の根幹をなす重要なものであるため、年度の財務諸表と期中財務諸表とで同一の会計処理が適用されなければならないため。"},
 {"id":"21-4","rank":"C","q":"「四半期財務諸表に関する会計基準」において、原価差異の繰延処理が四半期特有の会計処理として認められた理由を説明しなさい。","a":"四半期財務諸表では中間財務諸表よりも売上原価が操業度等により大きく変動し、売上高と売上原価の対応関係が適切に表示されない可能性があることから、例外的に特有の会計処理を認めた方が、経済的実態をより適切に表し、将来の業績予測に資する情報を提供できるため。"}
]},
{ch:22, title:"企業結合", items:[
 {"id":"22-1","rank":"A","q":"①すべての結合当事企業の持分が継続している場合と②一方の結合当事企業の持分が非継続である場合、企業結合後の損益計算はどのように行われるか説明しなさい。","a":"①投資の清算と再投資は行われておらず投資は継続しているため、投資原価は企業結合前の帳簿価額となり、これを超えて回収できればその超過額が利益となる。\n②投資家はいったん投資を清算し改めて時価にて投資を行い取得企業に現物出資したと考えられるため、投資原価は企業結合時点での時価となり、これを超えて回収できればその超過額が利益となる。"},
 {"id":"22-2","rank":"A","q":"「取得」と判定された企業結合について、いかなる会計処理を適用すべきか、理由とともに説明しなさい。","a":"パーチェス法を適用すべきである。「取得」はある企業が他の企業の支配を獲得するという経済的実態を有し、実質的にはいずれかの結合当事企業による新規の投資と同じであり、交付する投資額を取得価額として受入れる資産・負債を評価することが、現行の一般的な会計処理と整合するため。"},
 {"id":"22-3","rank":"B","q":"「持分の結合」と判定された企業結合については，いかなる会計処理を適用すべきと考えられるか，理由とともに説明しなさい。","a":"「持分の結合」は，いずれの結合当事企業も他の結合当事企業に対する支配を獲得したとは合理的に判断できないという経済的実態を有する。このような企業結合は，いずれの結合当事企業の持分も継続が断たれておらず，いずれの結合当事企業も支配を獲得していないと判断される限り，企業結合によって投資のリスクが変質しても，その変質によっては個々の投資のリターンは実現していないとみるものであり，ある種の非貨幣財同士の交換の会計処理と整合するため，持分プーリング法を適用すべきと考えられる。","cm":"＜Comment from K.Watanabe︓純理論の問題でしか問われない内容，太字部分を中⼼に説明できるようにする＞"},
 {"id":"22-4","rank":"D","q":"フレッシュ・スタート法の意義，適合する経済的実態及びフレッシュ・スタート法が制度会計上採用されていない理由を説明しなさい。","a":"フレッシュ・スタート法とは，すべての結合当事企業の資産及び負債を企業結合時の時価に評価替えする方法をいう。フレッシュ・スタート法が適合するのは，新設合併のようにすべての結合当事企業がいったん解散し，すべての株主持分が清算された上で，新たに設立された企業へ拠出するという経済的実態を有する企業結合であるが，フレッシュ・スタート法を適用することが適切と考えられる事象やその根拠等が必ずしも明確ではない現況等を勘案し，制度会計上は採用されていない。","cm":"＜Comment from K.Watanabe︓ときどき読む程度＞"},
 {"id":"22-5","rank":"B","q":"取得原価を取得の対価となる財の時価で算定する理由を説明しなさい。","a":"取得とされた企業結合における取得原価の算定は，一般的な交換取引において資産の取得原価を算定する際に適用されている一般的な考え方によることが整合的であるが，一般的な交換取引においては，その交換のために支払った対価となる財の時価は，通常，受入れた資産の時価と等価であると考えられており，取得原価は対価の形態にかかわらず，支払対価となる財の時価で算定されるため。","cm":"＜Comment from K.Watanabe︓書く機会はないかも知れないが，内容⾃体はとても⼤切＞"},
 {"id":"22-6","rank":"B","q":"株式の交換による取得の場合において，市場価格のある取得企業等の株式が取得の対価として交付されるときの交付した株式の測定日については，①主要な条件が合意されて公表された時点での株価をもって取得原価を算定する方法と②実際に被取得企業の支配を獲得した日の株価をもって取得原価を算定する方法がある。それぞれの方法の論拠を説明しなさい。","a":"① 結合当事企業は，企業結合にあたりお互いの本来の事業価値等を適切に反映した結果として，企業結合の主要条件，とりわけ交換比率の合意に至っているのが通常であり，また，そのような合意内容が公表された後の株価変動には被取得企業の本来の事業価値とは必ずしも関係しない影響が混在している可能性もあると考えられる。\n②・株式以外の財産を引渡した場合は取引時点，すなわち企業結合日の時価で測定すると考えられるが，株式の交付の場合のみ合意公表日での株価で測定するのは整合的でない。\n・合意公表日と企業結合日との間に重要な変化があった場合には，合意公表日後においてその条件が見直される可能性も残されており，合意公表日では未だ取得原価は確定していないとも考えられる。","cm":"＜Comment from K.Watanabe︓①を説明できるようにしたいが，そのためには内容の理解が不可⽋＞"},
 {"id":"22-7","rank":"A","q":"段階取得の取得原価の算定方法について、①個々の取引ごとの原価の合計額とする方法と②支配獲得日における時価で算定する方法の論拠を説明しなさい。","a":"①当初の非支配株主としての投資から支配獲得に至る一連の取得取引は継続した投資であると考えられ、個々の交換取引はその時点での等価交換取引であるため、原価の合計額とすることが経済的実態を適切に反映する。\n②支配を獲得したことにより過去の投資の実態が変わったとみなし、支配獲得日にいったん投資が清算され改めて投資を行ったと考えられるため、支配獲得日の時価とすべき。"},
 {"id":"22-8","rank":"B","q":"「関連会社と企業結合した場合，取得原価は支配を獲得するに至った個々の取引すべての企業結合日における時価をもって算定すべきではない」という見解の論拠を説明しなさい。","a":"被取得企業が取得企業の関連会社であった場合には，その後支配を獲得するに至っても事業投資という性格は変わらず，当該被取得企業に対する投資は継続していると考えられることを論拠とする。これは，事業分離により分離先企業が関連会社となる場合，移転された事業に関する投資は継続しているとみるとする『事業分離等に関する会計基準』の考え方とも整合する。","cm":"＜Comment from K.Watanabe︓書く機会はないかも知れないが，内容⾃体はとても⼤切＞"},
 {"id":"22-9","rank":"B","q":"取得関連費用の会計処理について、①取得原価に含めて処理する方法と②発生時の費用として処理する方法の論拠を説明しなさい。","a":"①取得はあくまで等価交換取引であるとの考え方を重視し、支出額を個別に取得した資産の付随費用と同様に企業結合の一部と捉えて取得原価に含める。\n②当該支出は取得企業と被取得企業との等価交換取引の一部ではなく、サービス提供を受けるための別の取引に基づくものであり、企業結合日における取得企業の資産を構成しないと考えられる。"},
 {"id":"22-10","rank":"B","q":"条件付取得対価が特定の株式または社債の市場価格に依存する場合，条件付取得対価の交付により取得原価を追加的に認識しない理由を説明しなさい。","a":"特定の株式または社債の市場価格に依存する条件付取得対価は，当初合意した価額を維持するために交付されるものであるため，この交付により取得原価を追加的に認識するのは適切ではないため。","cm":"＜Comment from K.Watanabe︓太字部分を簡潔に覚えておく＞"},
 {"id":"22-11","rank":"C","q":"条件付取得対価が企業結合契約締結後の将来の業績に依存する場合において，対価の一部が返還されるときには，条件付取得対価の返還が確実となり，その時価が合理的に決定可能となった時点で会計処理が行われる。その理由を２つ挙げなさい。","a":"・我が国におけるこれまでの考え方と整合的であり，有用な会計情報を提供できるものと考えられるため。\n・これまでの偶発事象を資産として認識する場合の会計基準と整合的であるため。","cm":"＜Comment from K.Watanabe︓何が論点なのかは理解しておきたい＞"},
 {"id":"22-12","rank":"A","q":"企業結合に係る特定勘定を負債として認識する理由を説明しなさい。","a":"企業結合の条件交渉の過程で、被取得企業に関連して発生する可能性のある将来の費用または損失が取得の対価に反映されている場合には、被取得企業が企業結合日前に当該費用または損失を負担したと考えられることから、これらの費用等を企業結合日以後の取得企業の業績に反映させない方が、取得企業の投資原価の回収計算を適切に行うことができると考えられるため。"},
 {"id":"22-13","rank":"A","q":"企業結合により受入れた仕掛研究開発の取扱いについて、①費用処理する方法と②資産計上する方法の理由を説明しなさい。","a":"①仕掛研究開発の使途は取得企業における研究開発とみるため、特定の研究開発目的にのみ使用され他の目的に使用できない資産であり、「研究開発費等に係る会計基準」における社内の研究開発の会計処理と整合的に取扱うべき。\n②独立の当事者間で取引がなされた以上、取引価格はその蓋然性を織込んで決められていると考えられ、客観的な評価がなされていない社内の研究開発の成果とは異なるため、識別可能性の要件を満たす限り、他の資産と整合的に取扱うべき。"},
 {"id":"22-14","rank":"A","q":"制度会計上、のれんについて規則的な償却を行う方法が採用されている理由を３つ挙げなさい。","a":"①規則的な償却により、企業結合の成果たる収益と、投資消去差額の償却という費用の対応が可能になる。②のれんは投資原価の一部であり、規則的な償却は投資原価を超えて回収された超過額を利益とみる考え方と首尾一貫している。③企業結合により生じたのれんは時間の経過とともに自己創設のれんに入れ替わる可能性があるため、規則的な償却により非償却による自己創設のれんの実質的な資産計上を防ぐことができる。"},
 {"id":"22-15","rank":"A","q":"のれんの規則的な償却を行わず、価値が損なわれたときに減損処理を行う方法の論拠を説明しなさい。","a":"①のれんは繰延税金資産と同様に将来の収益力によって価値が変動する資産であり、規則的な償却ではなく収益性の低下による回収可能性で評価すべき。②すべてののれんの価値が減少するわけではなく、減価する場合でも毎期規則的に減少することは稀であり、耐用年数及び償却パターンの合理的な予測は困難であるため、恣意的な期間での定額償却は有用な情報を提供できない。"},
 {"id":"22-16","rank":"A","q":"のれんの規則的な償却を行わず減損処理のみを行う方法の問題点を指摘しなさい。","a":"①のれんは超過収益力を表すものであり、競争の進展によって通常はその価値が減価する費用性資産であるため、規則的な償却を行わないことは競争の進展に伴う価値の減価の過程を無視することになる。②のれんの価値がその後の企業努力により維持される場合でも、時間の経過とともに自己創設のれんに入れ替わる可能性があるため、規則的な償却を行わないことは自己創設のれんの実質的な資産計上につながる。"},
 {"id":"22-17","rank":"B","q":"負ののれんの会計処理として①規則的な償却②非流動資産への比例配分③発生時の利益計上、の３つの方法の論拠を説明しなさい。","a":"①負ののれんの発生原因を特定できない以上、正の値であるのれんの会計処理との対称性を重視すべき。\n②発生原因をパーチェス法適用時の識別可能資産の取得原価決定の不備によるものとみなし、測定を誤る可能性の高い資産から比例的に控除すべき。\n③識別可能資産の時価算定が適切であることを前提に、発生原因を認識不能な項目やバーゲン・パーチェスとみなし、異常かつ発生可能性が低いことから異常利益として処理すべき。"},
 {"id":"22-18","rank":"B","q":"制度会計上、負ののれんを利益計上する理由を説明しなさい。","a":"認識不能な項目を原因とする負ののれんは特定勘定の認識を求めることで対応でき、識別可能資産の取得原価決定の不備を原因とするものは時価を再度見直すことで対応できることから、それでもなお生じる負ののれんはそのほとんどがバーゲン・パーチェスを原因とするものと考えられ、異常利益としての性格を有する。また、のれんは資産の定義を満たすが、負ののれんは負債の定義を満たしていないと考えられるため。"},
 {"id":"22-19","rank":"B","q":"消滅会社が取得企業となる吸収合併では，存続会社の個別財務諸表において，当該取得企業（消滅会社）の資産及び負債を合併直前の適正な帳簿価額により計上するものとされている。その理由を説明しなさい。","a":"消滅会社である取得企業の資産及び負債の支配は合併の前後で変更がなく，取得企業に対する持分は継続しているため。","cm":"＜Comment from K.Watanabe︓覚えるのは簡単，計算を通じて理解も必要＞"},
 {"id":"22-20","rank":"B","q":"現物出資会社または吸収分割会社が取得企業となる現物出資または吸収分割では，取得企業の個別財務諸表において，移転した事業に係る株主資本相当額に基づいて，被取得企業株式（子会社株式）の取得原価を算定するものとされている。その理由を説明しなさい。","a":"被取得企業に移転された事業に対する取得企業の投資はその企業結合の前後で継続しているため。","cm":"＜Comment from K.Watanabe︓計算をイメージしながら覚える＞"},
 {"id":"22-21","rank":"C","q":"共通支配下の取引について，個別財務諸表上の会計処理の考え方を説明しなさい。","a":"共通支配下の取引は，親会社の立場からは企業集団内における純資産等の移転取引として内部取引と考えられる。このため，連結財務諸表と同様に，個別財務諸表の作成にあたっても，基本的には，企業結合の前後で当該純資産等の帳簿価額が相違することにならないよう，企業集団内における移転先の企業は移転元の適正な帳簿価額により計上する。","cm":"＜Comment from K.Watanabe︓計算をイメージしながらときどき読む程度＞"},
 {"id":"22-22","rank":"C","q":"共通支配下の取引により子会社が法律上消滅する場合に，親会社の個別財務諸表において計上される「抱合わせ株式消滅差益」の性格について説明しなさい。","a":"子会社の資本のうち親会社持分相当額とこれに対する投資原価である子会社株式の適正な帳簿価額との差額である抱合わせ株式消滅差益は，株主との資本取引から生じたものではなく，投資額を上回る回収額を表すものとして，子会社を通じた事業投資の成果を親会社の個別損益計算書に反映させる損益項目としての性格を有する。","cm":"＜Comment from K.Watanabe︓計算をイメージしながらときどき読む程度，ただし理解は必要＞"}
]},
{ch:23, title:"事業分離等", items:[
 {"id":"23-1","rank":"A","q":"①これまでの投資がそのまま継続しているとみる場合と②いったん投資を清算し改めて時価にて投資を行ったとみる場合、事業分離後の損益計算はどのように行われるか説明しなさい。","a":"①投資の清算・再投資は行われておらず投資が継続しているとみるため、移転直前の帳簿価額がそのまま投資原価となり、これを超えて回収できればその超過額が利益となる。\n②いったん投資を清算し改めて時価にて投資を行ったとみるため、事業分離時点での時価が新たな投資原価となり、これを超えて回収できればその超過額が利益となる。"},
 {"id":"23-2","rank":"A","q":"①投資が清算されたとみる事業分離と②投資が継続しているとみる事業分離について、具体例と分離元企業の会計処理を説明しなさい。","a":"①現金など移転した事業と明らかに異なる資産を対価として受取る場合。受取対価の時価と移転した事業に係る株主資本相当額との差額を移転損益として認識し、改めて当該受取対価の時価にて投資を行ったものとして処理する。\n②子会社株式や関連会社株式となる分離先企業の株式のみを対価として受取る場合。移転損益を認識せず、受取る資産の取得原価は移転した事業に係る株主資本相当額に基づいて算定する。"},
 {"id":"23-3","rank":"B","q":"現金を対価とする事業分離で、移転した事業に買戻し条件が付されている場合の分離元企業の会計処理を、理由とともに説明しなさい。","a":"買戻し条件が付されている場合は分離元企業の継続的関与がある場合に該当する。それが重要であることによって移転した事業に係る成果の変動性を従来と同様に負っている場合には、投資が清算されたとみなされず移転損益は認識されない。この場合は移転した事業を裏付けとする金融取引として会計処理する。"},
 {"id":"23-4","rank":"B","q":"現金等の財産のみを受取対価とする事業分離において，子会社へ事業分離する場合に移転損益を認識する理由を説明しなさい。","a":"子会社を分離先企業として行われる事業分離は共通支配下の取引に該当するため，分離元企業が受取った現金等の財産は移転前に付された適正な帳簿価額により計上するが，これが移転した事業に係る株主資本相当額と異なるときには，当該差額を移転損益として認識せざるを得ないため。","cm":"＜Comment from K.Watanabe︓計算をイメージして答えられるようにする＞"},
 {"id":"23-5","rank":"A","q":"分離先企業の株式のみを受取対価とする事業分離において、事業分離後の分離先企業との関係によって会計処理が異なる理由を説明しなさい。","a":"分離先企業の株式のみを受取対価とする事業分離は、現金等のみを対価とする場合と異なり、当該株式を通じて移転した事業と引続き関係を有することとなるため、投資の継続とみなされる可能性があるため。"},
 {"id":"23-6","rank":"A","q":"分離先企業が関連会社となる場合、①投資は清算されたとみる見解と②投資が継続しているとみる見解の論拠を説明しなさい。","a":"①分離元の事業の多くと分離先の事業の多くとが引き換えられるため、事前に期待していた投資の成果が事実に転化されたとみることができる。また分離先企業において取得と判断されるときに分離元で売却とすることは理解しやすい。\n②関連会社株式は関連会社への影響力の行使を目的として保有することから、子会社株式と同じく事実上の事業投資と同様に扱う。事業分離により支配は失われているが、影響力の行使を通じて移転した事業に関する事業投資を引き続き行っているとみることができるため、投資が継続していると考えられる。"}
]}
];

const progressCount = document.getElementById('progressCount');
const btnPrev = document.getElementById('btnPrev');
const btnNext = document.getElementById('btnNext');
const btnShuffle = document.getElementById('btnShuffle');
const selfCheck = document.getElementById('selfCheck');
const btnGot = document.getElementById('btnGot');
const btnRetry = document.getElementById('btnRetry');

let activeRanks = new Set(['A','B','C','D']);
let currentList = [];
let currentIndex = 0;
let showingAnswer = false;
let statusMap = {}; // id -> 'got' | 'retry'

const RANKS = ['A','B','C','D'];
RANKS.forEach(r=>{
  const chip = document.createElement('div');
  chip.className = 'rank-chip active';
  chip.dataset.rank = r;
  chip.textContent = '重要度' + r;
  chip.addEventListener('click', ()=>{
    if(activeRanks.has(r) && activeRanks.size===1){ return; } // keep at least one active
    if(activeRanks.has(r)){ activeRanks.delete(r); chip.classList.remove('active'); }
    else { activeRanks.add(r); chip.classList.add('active'); }
    buildList();
  });
  rankRow.appendChild(chip);
});

DATA.forEach((chapterObj, idx)=>{
  const opt = document.createElement('option');
  opt.value = idx;
  opt.textContent = '第' + chapterObj.ch + '章　' + chapterObj.title;
  chapterSelect.appendChild(opt);
});

chapterSelect.addEventListener('change', buildList);

function buildList(){
  const chIdx = parseInt(chapterSelect.value);
  const chapterObj = DATA[chIdx];
  chapterTitleMeta.textContent = '第' + chapterObj.ch + '章';
  currentList = chapterObj.items.filter(it => activeRanks.has(it.rank));
  chapterCountMeta.textContent = currentList.length + '問';
  currentIndex = 0;
  showingAnswer = false;
  renderCard();
}

function renderCard(){
  if(currentList.length === 0){
    cardId.textContent = '';
    rankBadge.textContent = '-';
    rankBadge.className = 'rank-badge D';
    modeTag.textContent = '該当なし';
    modeTag.className = 'mode-tag q';
    cardBody.className = 'card-body question';
    cardBody.textContent = 'この重要度フィルタに該当する論証がありません。上のチップで条件を変更してください。';
    commentBox.style.display = 'none';
    cardHint.textContent = '';
    selfCheck.style.display = 'none';
    progressFill.style.width = '0%';
    progressCount.textContent = '0 / 0';
    btnPrev.disabled = true;
    btnNext.disabled = true;
    return;
  }
  const item = currentList[currentIndex];
  cardId.textContent = '論証' + item.id;
  rankBadge.textContent = item.rank;
  rankBadge.className = 'rank-badge ' + item.rank;

  if(!showingAnswer){
    modeTag.textContent = '問題';
    modeTag.className = 'mode-tag q';
    cardBody.className = 'card-body question';
    cardBody.textContent = item.q;
    commentBox.style.display = 'none';
    cardHint.textContent = 'タップして解答を見る';
    selfCheck.style.display = 'none';
  } else {
    modeTag.textContent = '解答';
    modeTag.className = 'mode-tag a';
    cardBody.className = 'card-body answer';
    cardBody.textContent = item.a;
    if(item.cm){
      commentBox.style.display = 'block';
      commentBox.textContent = '💡 ' + item.cm;
    } else {
      commentBox.style.display = 'none';
    }
    cardHint.textContent = 'タップして問題に戻る';
    selfCheck.style.display = 'flex';
    btnGot.classList.toggle('on', statusMap[item.id]==='got');
    btnRetry.classList.toggle('on', statusMap[item.id]==='retry');
  }

  progressCount.textContent = (currentIndex+1) + ' / ' + currentList.length;
  progressFill.style.width = ((currentIndex+1)/currentList.length*100) + '%';
  btnPrev.disabled = currentIndex === 0;
  btnNext.disabled = currentIndex === currentList.length - 1;
}

card.addEventListener('click', (e)=>{
  if(e.target.closest('.self-check')) return;
  if(currentList.length === 0) return;
  showingAnswer = !showingAnswer;
  renderCard();
});

btnPrev.addEventListener('click', ()=>{
  if(currentIndex > 0){ currentIndex--; showingAnswer=false; renderCard(); }
});
btnNext.addEventListener('click', ()=>{
  if(currentIndex < currentList.length-1){ currentIndex++; showingAnswer=false; renderCard(); }
});
btnShuffle.addEventListener('click', ()=>{
  for(let i=currentList.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [currentList[i],currentList[j]]=[currentList[j],currentList[i]];
  }
  currentIndex = 0;
  showingAnswer = false;
  renderCard();
});
btnGot.addEventListener('click', ()=>{
  const item = currentList[currentIndex];
  statusMap[item.id] = statusMap[item.id]==='got' ? null : 'got';
  renderCard();
});
btnRetry.addEventListener('click', ()=>{
  const item = currentList[currentIndex];
  statusMap[item.id] = statusMap[item.id]==='retry' ? null : 'retry';
  renderCard();
});

buildList();
</script>
</body>
</html>
